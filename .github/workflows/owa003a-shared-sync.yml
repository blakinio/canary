name: OWA-003A Shared Documentation Sync

on:
  push:
    branches:
      - feat/CAN-20260730-owa-003a-tcr-qa-freshness
    paths:
      - .github/workflows/owa003a-shared-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/CAN-20260730-owa-003a-tcr-qa-freshness
          fetch-depth: 0
      - name: Reconcile OWA-003A shared documents
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"expected one match in {path}, found {text.count(old)}")
              target.write_text(text.replace(old, new), encoding="utf-8")

          program = "docs/agents/programs/OTBM_WORLD_ASSURANCE_OPERATIONS_PROGRAM.md"
          replace_once(
              program,
              'updated: 2026-07-24T01:22:00+02:00\nlast_verified_commit: "332e47da1b1d8fb0d98fa4cf1e6698acb26f8e05"',
              'updated: 2026-07-30T12:30:00+02:00\nlast_verified_commit: "e1474d39d51c14bc1d2d016e35c7a7de970be4bd"',
          )
          replace_once(
              program,
              "# Active tasks\n\nNo active OWA task remains after the OWA-006 blocked-task lifecycle is merged.\n\nOWA-006 target-selection/preflight PR #848 is merged. The functional package remains blocked by `OWA006_NO_RETAINED_REVIEWED_REAL_CANDIDATE_CHAIN`; lifecycle closure archives that task and releases ownership without changing the functional blocker into completion.",
              "# Active tasks\n\nOWA-003A is active in draft PR #1031 under task `CAN-20260730-owa-003a-tcr-qa-freshness`. It owns only exact TCR-011 route-to-existing-QA-016 freshness verification; it does not produce QA-008/002/007 evidence, execute validators/E2E or refresh QA-006.\n\nOWA-006 target-selection/preflight PR #848 is merged. The functional package remains blocked by `OWA006_NO_RETAINED_REVIEWED_REAL_CANDIDATE_CHAIN`; lifecycle closure archives that task and releases ownership without changing the functional blocker into completion.",
          )
          replace_once(
              program,
              "| OWA-003 | TCR-to-QA Drift and Freshness Integration | blocked on stable TCR parity/drift outputs | stable owning TCR outputs + QA-008/016/002/007 | medium | Re-derive scope from stable merged TCR producer contracts only after required parity/drift outputs exist; OWA consumes them but never parses client reference inputs. |",
              "| OWA-003 | TCR-to-QA Drift and Freshness Integration | OWA-003A active/in-review in #1031; downstream evidence integration remains separate | stable TCR-011 routing + QA-016 for OWA-003A; later QA-008/002/007/006 evidence owned downstream | medium | Complete exact-head validation and merge of the bounded freshness-impact contract. Do not promote TCR evidence into Semantic Diff, validator selection, execution results, assurance or refreshed certification. |",
          )
          replace_once(
              program,
              "6. **OWA-003** — begin only after stable owning TCR parity/drift outputs and explicit producer/consumer contracts exist.\n\nAll currently executable non-TCR OWA work has been performed. OWA-006 is not functionally complete and may resume only when its missing real candidate producer evidence exists. OWA-003 remains dependency-gated by TCR.",
              "6. **OWA-003A** — active in #1031: verify exact reviewed TCR-011 route/component/dimension mappings against existing QA-016 staleness only.\n7. **OWA-003 downstream** — begin only as separate bounded packages when exact canonical QA-008/002/007/006 inputs exist; never synthesize them from TCR.\n\nAll currently executable non-TCR OWA work has been performed. OWA-006 is not functionally complete and may resume only when its missing real candidate producer evidence exists. The TCR dependency is satisfied; OWA-003A is active, while downstream QA execution/assurance evidence remains unproven and separately owned.",
          )
          replace_once(
              program,
              "## OWA-003 — TCR-to-QA Drift and Freshness Integration\n\nAfter stable owning TCR formats exist:\n\n```text\nTCR exact parity/drift finding\n  -> explicit dependency mapping\n  -> QA-016 staleness\n  -> QA-008 proven blast radius where declared\n  -> QA-002 impacted validation\n  -> owning validators / Physical E2E\n  -> QA-007 assurance\n  -> refreshed QA-006 certification\n```\n\nOWA never parses `staticdata`, `staticmapdata`, proficiency or minimap files and never guesses identifier mappings.\n\nCurrent gate: a stable package/reference manifest or StaticData index alone is insufficient. OWA-003 remains blocked until the owning TCR programme delivers the required stable parity/drift producer outputs.",
              "## OWA-003 — TCR-to-QA Drift and Freshness Integration\n\nStable TCR-009/010/011 outputs now satisfy the producer dependency. OWA-003 is split into bounded evidence-preserving stages:\n\n```text\nTCR-011 exact reviewed route\n  -> OWA-003A reviewer-authored route/component/dimension mapping\n  -> verify existing QA-016 changed components and stale dimensions\n  -> downstream QA-008/002/007/006 remains not-evaluated/not-refreshed\n```\n\nOWA-003A public formats in PR #1031 are `canary-otbm-tcr-qa-freshness-manifest-v1` and `canary-otbm-tcr-qa-freshness-impact-v1`. They require complete route/target coverage, exact extract identity and exact equality between mapped components and QA-016 `changedDependencies`. Unsupported/blocked routes remain targetless review-required outcomes.\n\nOWA never parses `staticdata`, `staticmapdata`, proficiency or minimap files and never guesses identifier mappings. OWA-003A does not invoke QA-008, generate Semantic Diff or QA-002 selection, create QA-007 execution evidence, run validators/Physical E2E or refresh QA-006. Those stages require their canonical downstream inputs and separate ownership.",
          )
          replace_once(
              program,
              "The programme therefore remains active: OWA-006 condition 6 is unproven and OWA-003 remains dependency-gated. Completion still does not imply that every tile, quest or mechanic in the entire world is gameplay-correct. Certification remains reviewed-target- and evidence-bounded.",
              "The programme therefore remains active: OWA-006 condition 6 is unproven and OWA-003A alone does not complete the downstream QA-008/002/007/006 chain. Completion still does not imply that every tile, quest or mechanic in the entire world is gameplay-correct. Certification remains reviewed-target- and evidence-bounded.",
          )
          replace_once(
              program,
              "- OWA-003 remains dependency-gated by stable owning TCR parity/drift outputs and must be re-derived from the actual merged producer contracts at task start.",
              "- OWA-003A is active in PR #1031 after stable TCR delivery; later QA-008/002/007/006 stages remain separate and require exact canonical map-change, dependency, execution, health and certification evidence rather than TCR-derived substitutes.",
          )
          replace_once(
              program,
              "```text\nall currently executable non-TCR OWA work completed\nOWA-006 operational adoption remains blocked on retained reviewed real candidate/change evidence\nOWA-003 remains dependency-blocked by TCR\n```\n\nThe programme itself is not complete while OWA-006 functional adoption and OWA-003 required producer-dependent integration remain unproven.",
              "```text\nall currently executable non-TCR OWA work completed\nOWA-006 operational adoption remains blocked on retained reviewed real candidate/change evidence\nOWA-003A exact TCR-to-QA-016 freshness verification is active in PR #1031\nOWA-003 downstream QA-008/002/007/006 evidence remains separate and unproven\n```\n\nThe programme itself is not complete while OWA-006 functional adoption and the downstream OWA-003 assurance chain remain unproven.",
          )
          replace_once(
              program,
              "- OWA-003 package scope must be re-derived from the TCR formats that are actually stable and merged at that time.",
              "- After OWA-003A merges, a fresh bounded preflight must determine whether any exact retained canonical QA-008/002/007/006 evidence chain exists; missing evidence must be recorded as a blocker rather than synthesized from TCR.",
          )

          roadmap = "docs/ai-agent/OTBM_WORLD_ASSURANCE_OPERATIONS_ROADMAP.md"
          replace_once(
              roadmap,
              "# OWA-003 — TCR-to-QA Drift and Freshness Integration\n\n**Priority: dependency-gated.**\n\n## Goal\n\nUse stable exact Tibia Client Reference outputs to invalidate or refresh only the QA/certification dimensions that explicitly depend on them.\n\n## Dependency\n\nImplementation starts only after the required owning TCR packages and formats are merged and stable. OWA never parses client files itself.\n\n## Intended flow\n\n```text\nstable TCR exact parity/drift finding\n  -> explicit dependency mapping\n  -> QA-016 dependency-scoped staleness\n  -> QA-008 proven blast radius where declared\n  -> QA-002 impacted validation selection\n  -> owning validators / Universal Physical E2E execute\n  -> QA-007 assurance\n  -> refreshed QA-006 certification state\n```\n\n## Hard boundaries\n\n- no `staticdata`, `staticmapdata`, proficiency or minimap parsing in OWA;\n- no guessed item/server/object identifier mapping;\n- client reference is not map authority;\n- quest ID/name drift does not prove quest-stage/runtime changes;\n- matching proficiency IDs do not prove runtime/persistence/protocol parity;\n- dependency uncertainty fails closed to stale/review-required or broader validation.\n\n## Success condition\n\nA stable TCR change can deterministically identify which OTBM certification/assurance dimensions become stale or require revalidation without duplicating TCR ownership.",
              "# OWA-003 — TCR-to-QA Drift and Freshness Integration\n\n**Priority: active bounded first slice; downstream evidence-gated.**\n\n## Goal\n\nUse stable exact Tibia Client Reference outputs to invalidate or refresh only the QA/certification dimensions that explicitly depend on them.\n\n## OWA-003A delivered boundary in PR #1031\n\nThe first slice consumes one exact stable `canary-tibia-reference-adoption-routing-v1` report, one exact existing `canary-otbm-release-provenance-v1` report and one reviewer-authored hash-pinned mapping. It emits `canary-otbm-tcr-qa-freshness-impact-v1` only when every TCR route/target is covered and the mapped component set for each dimension exactly equals QA-016 `changedDependencies`.\n\n```text\nTCR-011 exact route/extract/target\n  -> reviewed QA-016 component/dimension mapping\n  -> exact existing changed/stale verification\n  -> review-required freshness impact\n```\n\nUnsupported/blocked routes remain explicit targetless `not-mapped` outcomes. Unrelated QA-016 dimensions are not broadened into the impact set.\n\n## Downstream flow remains separate\n\n```text\nverified OWA-003A freshness impact\n  -> QA-008 proven blast radius where exact canonical inputs exist\n  -> QA-002 impacted validation from canonical Semantic Diff\n  -> owning validators / Universal Physical E2E execute\n  -> QA-007 exact result-set assurance\n  -> refreshed QA-006 certification state\n```\n\nOWA-003A records QA-008/002/007 as `not-evaluated` and QA-006 as `not-refreshed`; it does not create those inputs or invoke those owners.\n\n## Hard boundaries\n\n- no `staticdata`, `staticmapdata`, proficiency or minimap parsing in OWA;\n- no guessed item/server/object identifier mapping;\n- client reference is not map authority;\n- quest ID/name drift does not prove quest-stage/runtime changes;\n- matching proficiency IDs do not prove runtime/persistence/protocol parity;\n- no dependency-edge discovery, Semantic Diff generation, validator selection, execution-ledger generation, Physical E2E execution or certification refresh;\n- dependency uncertainty fails closed to stale/review-required or broader validation.\n\n## Success condition\n\nA stable TCR route can deterministically verify which explicitly reviewed QA-016 dimensions are already stale without duplicating TCR or QA-016 ownership. Full downstream assurance remains a separate success condition requiring canonical QA evidence.",
          )

          catalog = "docs/agents/MODULE_CATALOG.md"
          anchor = "| OTBM Release Provenance and Certification Freshness | merged (#737) | Versioned `canary-otbm-release-bom-v1` exact component SHA-256 inventory and deterministic `canary-otbm-release-provenance-v1` previous/current comparison with explicit dimension dependencies and dependency-scoped staleness | `tools/ai-agent/otbm_release_provenance.py`, CLI, focused tests, `docs/ai-agent/OTBM_RELEASE_PROVENANCE.md`, BOM/report schemas | Exact hashes and declared dependencies are freshness evidence; timestamps are not. The composer does not rerun Semantic Diff, validators or Physical E2E, mutate evidence/certification, or prove runtime compatibility after a dependency change. |"
          new_row = "| OTBM TCR-to-QA Freshness Impact | active OWA-003A (#1031) | Deterministic read-only `canary-otbm-tcr-qa-freshness-manifest-v1` and `canary-otbm-tcr-qa-freshness-impact-v1` verification of exact TCR-011 route/extract/target mappings against existing QA-016 changed components and stale dimensions | `tools/ai-agent/otbm_tcr_qa_freshness*.py`, focused tests, `.github/workflows/otbm-tcr-qa-freshness.yml`, `docs/ai-agent/OTBM_TCR_QA_FRESHNESS.md`, manifest/report schemas | Reuse stable TCR-011 and existing QA-016 only. Require complete route-target coverage and exact changed-dependency equality; preserve unsupported/blocked outcomes. Do not invoke QA-008, generate Semantic Diff/QA-002, create QA-007 execution evidence, run E2E, refresh QA-006, mutate state or claim gameplay parity. |"
          replace_once(catalog, anchor, anchor + "\n" + new_row)

          changelog = "docs/agents/CHANGELOG.md"
          replace_once(
              changelog,
              "## Unreleased\n",
              "## Unreleased\n\n- Adds OWA-003A `canary-otbm-tcr-qa-freshness-manifest-v1` and `canary-otbm-tcr-qa-freshness-impact-v1` as deterministic read-only verification of complete exact TCR-011 route/extract/target mappings against an existing QA-016 release-provenance report. Routed mappings require changed non-removed components, stale non-removed dimensions and exact aggregate equality with QA-016 `changedDependencies`; unsupported/blocked routes remain targetless review-required outcomes. The package leaves QA-008/002/007 `not-evaluated` and QA-006 `not-refreshed`, parses no client/OTBM input, discovers no dependency edge, runs no validator/E2E, mutates nothing and claims no gameplay parity.\n",
          )
          PY
          rm .github/workflows/owa003a-shared-sync.yml
      - name: Commit shared reconciliation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/agents/programs/OTBM_WORLD_ASSURANCE_OPERATIONS_PROGRAM.md docs/ai-agent/OTBM_WORLD_ASSURANCE_OPERATIONS_ROADMAP.md docs/agents/MODULE_CATALOG.md docs/agents/CHANGELOG.md .github/workflows/owa003a-shared-sync.yml
          git commit -m "docs(otbm): reconcile OWA-003A programme state"
          git push origin HEAD:feat/CAN-20260730-owa-003a-tcr-qa-freshness
