---
name: TCR-010 Lifecycle Closeout

on:
  pull_request:
    paths:
      - ".github/workflows/tcr010-lifecycle-closeout.yml"
      - "tools/agents/tcr010_lifecycle_closeout.py"

permissions:
  contents: write

jobs:
  closeout:
    if: github.event.pull_request.head.repo.full_name == 'blakinio/canary'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: docs/CAN-20260730-tcr-010-archive
          fetch-depth: 0
      - name: Archive task and release TCR-011
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python tools/agents/tcr010_lifecycle_closeout.py
          rm .github/workflows/tcr010-lifecycle-closeout.yml
          rm .github/workflows/tcr010-lifecycle-trigger.yml
          rm tools/agents/tcr010_lifecycle_closeout.py
          git add docs/agents/tasks docs/agents/programs/OTBM_TIBIA_CLIENT_REFERENCE_PROGRAM.md docs/agents/MODULE_CATALOG.md .github/workflows tools/agents/tcr010_lifecycle_closeout.py
          git commit -m "docs(agents): archive TCR-010 evidence gateway"
          git push origin HEAD:docs/CAN-20260730-tcr-010-archive
