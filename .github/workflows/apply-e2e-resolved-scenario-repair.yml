name: Apply E2E resolved scenario repair

on:
  push:
    branches:
      - fix/e2e-resolved-scenario-reuse

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v6
        with:
          ref: fix/e2e-resolved-scenario-reuse
          fetch-depth: 2

      - name: Apply exact resolver patch and tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path("tools/e2e/run_agent_e2e.py")
          text = source.read_text(encoding="utf-8")
          needle = '''def _resolve_pr_fallback_selection(root: Path, suite: str, scenario_id: str) -> tuple[str, str]:
              """Replace only the canonical PR fallback with one exact changed scenario."""

              if (suite, scenario_id) != (CANONICAL_PR_SUITE, CANONICAL_PR_SCENARIO):
          '''
          replacement = '''def _resolve_pr_fallback_selection(root: Path, suite: str, scenario_id: str) -> tuple[str, str]:
              """Replace only the canonical PR fallback with one exact changed scenario."""

              if os.environ.get("GITHUB_JOB") == "physical-client":
                  resolved_suite = os.environ.get("AGENT_E2E_SUITE", "").strip()
                  resolved_scenario = os.environ.get("AGENT_E2E_SCENARIO_ID", "").strip()
                  if not resolved_suite or not resolved_scenario:
                      raise ScenarioError(
                          "physical-client job requires the workflow-resolved scenario identity"
                      )
                  if (resolved_suite, resolved_scenario) != (suite, scenario_id):
                      raise ScenarioError(
                          "physical-client resolved scenario mismatch: "
                          f"requested={suite}/{scenario_id} "
                          f"resolved={resolved_suite}/{resolved_scenario}"
                      )
                  print(
                      "Reusing workflow-resolved scenario selection: "
                      f"{resolved_suite}/{resolved_scenario}",
                      file=sys.stderr,
                  )
                  return resolved_suite, resolved_scenario

              if (suite, scenario_id) != (CANONICAL_PR_SUITE, CANONICAL_PR_SCENARIO):
          '''
          if text.count(needle) != 1:
              raise SystemExit("resolver patch anchor was not found exactly once")
          source.write_text(text.replace(needle, replacement, 1), encoding="utf-8")

          test = Path("tests/e2e/test_resolved_scenario_reuse.py")
          test.write_text('''from __future__ import annotations

import importlib.util
import os
import sys
import unittest
from pathlib import Path
from unittest import mock


ROOT = Path(__file__).resolve().parents[2]
MODULE_PATH = ROOT / "tools" / "e2e" / "run_agent_e2e.py"
SPEC = importlib.util.spec_from_file_location("canary_e2e_resolved_scenario_reuse", MODULE_PATH)
if SPEC is None or SPEC.loader is None:
    raise RuntimeError(f"cannot load {MODULE_PATH}")
MODULE = importlib.util.module_from_spec(SPEC)
sys.modules[SPEC.name] = MODULE
SPEC.loader.exec_module(MODULE)


class ResolvedScenarioReuseTest(unittest.TestCase):
    def test_physical_job_reuses_exact_workflow_resolved_identity(self) -> None:
        environment = {
            "GITHUB_JOB": "physical-client",
            "GITHUB_EVENT_NAME": "pull_request",
            "AGENT_E2E_SUITE": "login",
            "AGENT_E2E_SCENARIO_ID": "relog",
        }
        with mock.patch.dict(os.environ, environment, clear=True):
            with mock.patch.object(
                MODULE,
                "_load_pr_scenario_selector",
                side_effect=AssertionError("PR selection must not run twice"),
            ):
                self.assertEqual(
                    ("login", "relog"),
                    MODULE._resolve_pr_fallback_selection(ROOT, "login", "relog"),
                )

    def test_physical_job_rejects_missing_resolved_identity(self) -> None:
        environment = {
            "GITHUB_JOB": "physical-client",
            "GITHUB_EVENT_NAME": "pull_request",
            "AGENT_E2E_SUITE": "login",
        }
        with mock.patch.dict(os.environ, environment, clear=True):
            with self.assertRaisesRegex(
                MODULE.ScenarioError,
                "requires the workflow-resolved scenario identity",
            ):
                MODULE._resolve_pr_fallback_selection(ROOT, "login", "relog")

    def test_physical_job_rejects_resolved_identity_mismatch(self) -> None:
        environment = {
            "GITHUB_JOB": "physical-client",
            "GITHUB_EVENT_NAME": "pull_request",
            "AGENT_E2E_SUITE": "login",
            "AGENT_E2E_SCENARIO_ID": "other",
        }
        with mock.patch.dict(os.environ, environment, clear=True):
            with self.assertRaisesRegex(
                MODULE.ScenarioError,
                "requested=login/relog resolved=login/other",
            ):
                MODULE._resolve_pr_fallback_selection(ROOT, "login", "relog")

    def test_non_physical_non_pr_caller_keeps_existing_selection(self) -> None:
        environment = {
            "GITHUB_JOB": "resolve",
            "GITHUB_EVENT_NAME": "workflow_dispatch",
            "AGENT_E2E_SUITE": "login",
            "AGENT_E2E_SCENARIO_ID": "other",
        }
        with mock.patch.dict(os.environ, environment, clear=True):
            self.assertEqual(
                ("login", "relog"),
                MODULE._resolve_pr_fallback_selection(ROOT, "login", "relog"),
            )


if __name__ == "__main__":
    unittest.main()
''', encoding="utf-8")
          PY

          python3 -m py_compile tools/e2e/run_agent_e2e.py
          python3 -m unittest -v tests.e2e.test_resolved_scenario_reuse

      - name: Commit bounded repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-e2e-resolved-scenario-repair.yml
          git add tools/e2e/run_agent_e2e.py tests/e2e/test_resolved_scenario_reuse.py
          git commit -m "fix(e2e): reuse resolved scenario in physical job"
          git push origin HEAD:fix/e2e-resolved-scenario-reuse
