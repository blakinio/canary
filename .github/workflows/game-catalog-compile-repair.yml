name: Game Catalog Compile Repair

on:
  pull_request:
    paths:
      - '.github/workflows/game-catalog-compile-repair.yml'
      - 'src/game/catalog/game_catalog_exporter.cpp'
      - 'src/game/catalog/catalog_runtime.cpp'

permissions:
  contents: write

concurrency:
  group: game-catalog-compile-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  repair:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply exact compile repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          exporter_path = Path('src/game/catalog/game_catalog_exporter.cpp')
          exporter = exporter_path.read_text(encoding='utf-8')
          old_sort = '''\tstd::ranges::sort(entities, {}, [](const Json &entity) {
\t\treturn std::pair(entity.at("type").get<std::string>(), entity.at("canonical_key").get<std::string>());
\t});
\tstd::ranges::sort(relations, {}, [](const Json &relation) {
\t\treturn std::pair(relation.at("type").get<std::string>(), relation.at("canonical_key").get<std::string>());
\t});

\tJson releases = manifest.releases;
\tstd::ranges::sort(releases, {}, [](const Json &release) {
\t\treturn std::pair(release.at("release_order").get<std::int64_t>(), release.at("key").get<std::string>());
\t});'''
          new_sort = '''\tauto &entityArray = entities.get_ref<Json::array_t&>();
\tstd::ranges::sort(entityArray, {}, [](const Json &entity) {
\t\treturn std::pair(entity.at("type").get<std::string>(), entity.at("canonical_key").get<std::string>());
\t});
\tauto &relationArray = relations.get_ref<Json::array_t&>();
\tstd::ranges::sort(relationArray, {}, [](const Json &relation) {
\t\treturn std::pair(relation.at("type").get<std::string>(), relation.at("canonical_key").get<std::string>());
\t});

\tJson releases = manifest.releases;
\tauto &releaseArray = releases.get_ref<Json::array_t&>();
\tstd::ranges::sort(releaseArray, {}, [](const Json &release) {
\t\treturn std::pair(release.at("release_order").get<std::int64_t>(), release.at("key").get<std::string>());
\t});'''
          if old_sort in exporter:
              exporter = exporter.replace(old_sort, new_sort, 1)
              exporter_path.write_text(exporter, encoding='utf-8', newline='\n')
          elif new_sort not in exporter:
              raise RuntimeError('Expected Game Catalog sort block was not found')

          runtime_path = Path('src/game/catalog/catalog_runtime.cpp')
          runtime = runtime_path.read_text(encoding='utf-8')
          old_helper = '''
\tvoid stopExportRuntime() {
\t\tg_dispatcher().shutdown();
\t\tg_threadPool().shutdown();
\t}
'''
          if old_helper in runtime:
              runtime = runtime.replace(old_helper, '\n', 1)

          old_function = '''int CanaryServer::exportGameCatalogOnly(const game_catalog::ExportOptions &options) {
\ttry {'''
          new_function = '''int CanaryServer::exportGameCatalogOnly(const game_catalog::ExportOptions &options) {
\tconst auto stopExportRuntime = [] {
\t\tg_dispatcher().shutdown();
\t\tg_threadPool().shutdown();
\t};

\ttry {'''
          if old_function in runtime:
              runtime = runtime.replace(old_function, new_function, 1)
          elif new_function not in runtime:
              raise RuntimeError('Expected Game Catalog export function was not found')
          runtime_path.write_text(runtime, encoding='utf-8', newline='\n')
          PY

      - name: Commit repair when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/game/catalog/game_catalog_exporter.cpp src/game/catalog/catalog_runtime.cpp; then
            echo 'Compile repair already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game/catalog/game_catalog_exporter.cpp src/game/catalog/catalog_runtime.cpp
          git commit -m 'fix(catalog): compile ordered snapshot and runtime shutdown'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
