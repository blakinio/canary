---
name: TCR-009 Discovery Reconcile

on:
  pull_request:
    paths:
      - "docs/agents/programs/OTBM_TIBIA_CLIENT_REFERENCE_PROGRAM.md"
      - "docs/agents/MODULE_CATALOG.md"
      - ".github/workflows/tcr009-discovery-reconcile.yml"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Reconcile merged TCR-009 discovery state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          program = Path("docs/agents/programs/OTBM_TIBIA_CLIENT_REFERENCE_PROGRAM.md")
          text = program.read_text(encoding="utf-8")
          old_tcr009 = "| TCR-009 | Client Reference Drift | active draft (#1018) | `canary-tibia-client-reference-drift-v1`; consumed request `RTREQ-TCR-ITEM-DEFINITIONS-0002`; retained evidence summary `6224a175...`; retained drift `be0593cb...` | TCR-002, TCR-003, TCR-004/TCR-004A | medium | Complete exact-final-head validation and merge. The producer consumes manifests/indexes only, skips StaticData record comparison across `legacy -> newer`, and grants no gameplay or mutation authority. |"
          new_tcr009 = "| TCR-009 | Client Reference Drift | merged | `canary-tibia-client-reference-drift-v1`; PR #1018; merge `c678d904...`; consumed request `RTREQ-TCR-ITEM-DEFINITIONS-0002`; retained evidence summary `6224a175...`; retained drift `be0593cb...` | TCR-002, TCR-003, TCR-004/TCR-004A | medium | Complete. Deterministic manifest/index drift is stable/merged; StaticData `legacy -> newer` remains an explicit family boundary and the contract grants no gameplay or mutation authority. |"
          old_tcr010 = "| TCR-010 | Compact Evidence Gateway Integration | blocked-by-TCR-009 | stable TCR-005/006/007 exist; TCR-009 is not stable | TCR-005, TCR-006, TCR-007, TCR-009 stable/merged | low | Do not start until `canary-tibia-client-reference-drift-v1` is genuinely stable/merged. Reuse QA-018. |"
          new_tcr010 = "| TCR-010 | Compact Evidence Gateway Integration | ready | Stable TCR-005/006/007 and merged TCR-009 `c678d904...` | TCR-005, TCR-006, TCR-007, TCR-009 stable/merged | low | Start the smallest read-only QA-018 gateway integration for bounded house, content, proficiency and drift extracts; do not reparse sources or add mutation authority. |"
          for old, new, label in ((old_tcr009, new_tcr009, "TCR-009"), (old_tcr010, new_tcr010, "TCR-010")):
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f"{label} queue row not found")
          program.write_text(text, encoding="utf-8")

          catalog = Path("docs/agents/MODULE_CATALOG.md")
          text = catalog.read_text(encoding="utf-8")
          old = "| Tibia client-reference drift | active TCR-009 (#1018) | Deterministic provenance-closed `canary-tibia-client-reference-drift-v1` over two exact retained final/bootstrap manifests plus StaticData, StaticMapData and proficiency indexes; explicit input/record findings, `legacy -> newer` schema-family boundary and dependency-scoped staleness | `tools/ai-agent/tibia_client_reference_drift.py`, focused tests, schema, `.github/workflows/tibia-client-reference-drift.yml`, `docs/ai-agent/TIBIA_CLIENT_REFERENCE_DRIFT.md` | Reuse existing TCR indexes only. Never reparse proprietary inputs, compare StaticData records across different families, use timestamps as freshness proof, infer gameplay impact or authorize OTBM/datapack/runtime/production mutation. |"
          new = "| Tibia client-reference drift | merged TCR-009 (#1018) | Deterministic provenance-closed `canary-tibia-client-reference-drift-v1` over two exact retained final/bootstrap manifests plus StaticData, StaticMapData and proficiency indexes; explicit input/record findings, `legacy -> newer` schema-family boundary and dependency-scoped staleness | `tools/ai-agent/tibia_client_reference_drift.py`, focused tests, schema, `.github/workflows/tibia-client-reference-drift.yml`, `docs/ai-agent/TIBIA_CLIENT_REFERENCE_DRIFT.md` | Reuse existing TCR indexes only. Never reparse proprietary inputs, compare StaticData records across different families, use timestamps as freshness proof, infer gameplay impact or authorize OTBM/datapack/runtime/production mutation. |"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("TCR-009 catalogue row not found")
          catalog.write_text(text, encoding="utf-8")
          PY
          rm .github/workflows/tcr009-discovery-reconcile.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/agents/programs/OTBM_TIBIA_CLIENT_REFERENCE_PROGRAM.md docs/agents/MODULE_CATALOG.md .github/workflows/tcr009-discovery-reconcile.yml
          git commit -m "docs(tcr): mark TCR-009 merged and unblock TCR-010"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
