---
name: TCR-009 Evidence Request Generate

on:
  push:
    branches:
      - docs/tcr-009-client-reference-drift-blocker-20260728
    paths:
      - docs/agents/real-tibia/evidence/requests/tcr/RTREQ-TCR-CLIENT-REFERENCE-DRIFT-0001.yaml
      - .github/workflows/tcr009-evidence-request-generate.yml

permissions:
  contents: write

concurrency:
  group: tcr009-evidence-request-generate
  cancel-in-progress: false

jobs:
  regenerate:
    name: Regenerate and remove helper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: docs/tcr-009-client-reference-drift-blocker-20260728
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate canonical evidence indexes
        run: |
          python tools/agents/real_tibia_evidence.py generate --as-of 2026-07-26
          python tools/agents/real_tibia_evidence.py validate --as-of 2026-07-26
          python tools/agents/real_tibia_evidence.py generate --check --as-of 2026-07-26

      - name: Remove one-shot helper and commit generated files
        run: |
          rm .github/workflows/tcr009-evidence-request-generate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/agents/real-tibia/evidence/generated/EVIDENCE_INDEXES.json
          git add docs/agents/real-tibia/evidence/modules/item-definitions/EVIDENCE_INDEX.yaml
          git add .github/workflows/tcr009-evidence-request-generate.yml
          git diff --cached --exit-code && { echo "Expected generated index changes were not produced"; exit 1; } || true
          git commit -m "chore(tcr): regenerate evidence request indexes"
          git push origin HEAD:docs/tcr-009-client-reference-drift-blocker-20260728
