---
name: CI

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "data/**"
      - "data-canary/**"
      - "data-otservbr-global/**"
      - "cmake/**"
      - "docker/**"
      - "docs/lua-api/**"
      - "docs/systems/**"
      - "tools/**"
      - "vcproj/**"
      - "vcpkg.json"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - ".github/scripts/**"
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  register-qri005:
    name: Register delivered QRI-005 contract
    if: github.event_name == 'pull_request' && github.head_ref == 'docs/register-e2e-qri-005-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v6
        with:
          ref: docs/register-e2e-qri-005-v2
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize discovery registration
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          module_path = Path("docs/agents/MODULE_CATALOG.md")
          changelog_path = Path("docs/agents/CHANGELOG.md")
          program_path = Path("docs/agents/programs/E2E_AUTOMATION_PROGRAM.md")

          module = module_path.read_text(encoding="utf-8")
          module_row = "| Universal OTS E2E result envelope | merged and runtime-proven (#850; lifecycle #861) | `canary-universal-e2e-result-envelope-v1`, schema version 3: deterministic machine-readable normalization of successful, assertion-failing, bootstrap and infrastructure outcomes through the canonical `result.json`, with preserved legacy fields, stable run/scenario identity, evidence maturity, orthogonal quality dimensions, ordered phases/steps, first-failure classification, attempt history, artifact references, warnings and explicit unknowns | `tools/e2e/result_envelope.py`, `tools/e2e/result_envelope_impl.py`, `tools/e2e/run_physical_e2e.sh`, `tools/e2e/run_physical_e2e_lifecycle.sh`, `tests/e2e/test_result_envelope.py`, archived task `CAN-20260724-e2e-qri-005-result-envelope` | Reuse this single envelope and existing artifact path for downstream diagnostics and QRI packages. Preserve M0-M5 separately from quality dimensions, retain all attempts and the first causal failure, sanitize credential-like values, and never infer proof from artifact presence. `cleanup_summary.status=not-certified` and `cleanup_certified=false` remain the explicit boundary for QRI-006; do not claim cleanup certification without that package's independent evidence. |\n"
          if "| Universal OTS E2E result envelope |" not in module:
              anchor = "| Universal Agent Load |"
              if anchor not in module:
                  raise SystemExit("MODULE_CATALOG anchor missing")
              module = module.replace(anchor, module_row + anchor, 1)
          module_path.write_text(module, encoding="utf-8")

          changelog = changelog_path.read_text(encoding="utf-8")
          bullet = "- Adds `canary-universal-e2e-result-envelope-v1` through merged PR #850 and lifecycle closure #861: the canonical Universal Physical E2E `result.json` now emits deterministic schema version 3 for successful, assertion, bootstrap and infrastructure outcomes while preserving legacy fields. The contract records stable run/scenario identity, execution tier, evidence maturity, orthogonal quality dimensions, ordered phases and steps, last-successful/first-failed evidence, typed failure classification, attempt history, artifact references, warnings and explicit unknowns; sanitizes credential-like values; retains earlier failed attempts; and introduces no second runner, workflow or artifact path. Cleanup remains explicitly not certified and is reserved for QRI-006.\n"
          marker = "## Unreleased\n\n"
          if "`canary-universal-e2e-result-envelope-v1` through merged PR #850" not in changelog:
              if marker not in changelog:
                  raise SystemExit("CHANGELOG marker missing")
              changelog = changelog.replace(marker, marker + bullet, 1)
          changelog_path.write_text(changelog, encoding="utf-8")

          program = program_path.read_text(encoding="utf-8")
          program = re.sub(r"^updated: .*?$", "updated: 2026-07-24T00:00:00+02:00", program, count=1, flags=re.MULTILINE)
          program = re.sub(r"^last_verified_commit: .*?$", "last_verified_commit: cb5a22bb4319608a1b1c64b40dd274cac94e0002", program, count=1, flags=re.MULTILINE)
          foundation = "| Standard machine-readable result envelope | merged and runtime-proven | PR #850; lifecycle archive #861 | reuse `canary-universal-e2e-result-envelope-v1` schema v3 and the existing `result.json`; keep M0-M5, orthogonal quality dimensions, failed attempts and QRI-006 cleanup certification boundaries explicit |\n"
          if "| Standard machine-readable result envelope |" not in program:
              anchor = "| Representative cross-system gameplay journey |"
              if anchor not in program:
                  raise SystemExit("programme foundation anchor missing")
              program = program.replace(anchor, foundation + anchor, 1)

          old = """## Recommended first implementation wave

Select one package at a time after live dependency and ownership preflight. Current recommendation:

1. `E2E-QRI-005` — standard machine-readable result envelope and richer first-failure evidence;
2. `E2E-QRI-006` — resource cleanup certification;
3. `E2E-QRI-001` — real two-player trade and persistence;
4. `E2E-QRI-002` — Canary restart/reconnect recovery;
5. `E2E-QRI-003` — broader representative Journey 002;
6. `E2E-QRI-004` — factual M0-M5 plus quality-dimension coverage dashboard;
7. `E2E-QRI-022` — flake/stability certification after the selected scenarios are stable enough to measure.

Later waves cover transactional/resilience correctness (`QRI-008` through `014`), test intelligence (`QRI-015` through `021`) and operational/release confidence (`QRI-023` through `028`).

This ordering is guidance, not permission to start all packages concurrently. Concrete feature demand and current ownership remain authoritative."""
          new = """## Recommended next implementation wave

Select one package at a time after live dependency and ownership preflight. QRI-001, QRI-002, QRI-003 and QRI-005 are delivered and lifecycle-closed. Current recommendation:

1. `E2E-QRI-006` — resource cleanup certification over the merged schema-v3 result envelope;
2. `E2E-QRI-004` — factual M0-M5 plus quality-dimension coverage dashboard;
3. `E2E-QRI-022` — flake/stability certification after the selected scenarios are stable enough to measure.

Later waves cover transactional/resilience correctness (`QRI-008` through `014`), test intelligence (`QRI-015` through `021`) and operational/release confidence (`QRI-023` through `028`).

This ordering is guidance, not permission to start packages concurrently. Concrete feature demand and current ownership remain authoritative."""
          if old not in program:
              raise SystemExit("programme recommendation block missing or changed")
          program = program.replace(old, new, 1)
          program_path.write_text(program, encoding="utf-8")
          PY

          git checkout origin/main -- .github/workflows/ci.yml .github/workflows/agent-task-ownership.yml
          rm -f docs/agents/.qri005-registration-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/agents/MODULE_CATALOG.md docs/agents/CHANGELOG.md docs/agents/programs/E2E_AUTOMATION_PROGRAM.md .github/workflows/ci.yml .github/workflows/agent-task-ownership.yml docs/agents/.qri005-registration-trigger
          git diff --cached --check
          git commit -m "docs(e2e): register delivered QRI-005 contract"
          git push origin HEAD:docs/register-e2e-qri-005-v2

  changes:
    name: Detect Build Scope
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      # Pull requests build only when the cumulative PR scope requires it and
      # the newest single-commit delta cannot reuse successful immediate-parent
      # CI evidence. workflow_dispatch, main pushes, and ci:final-gate retain
      # full validation.
      reuse_parent: ${{ steps.incremental.outputs.reuse_parent || 'false' }}
      final_gate: ${{ steps.final_gate.outputs.active || 'false' }}
      linux: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || steps.final_gate.outputs.active == 'true' || (steps.incremental.outputs.reuse_parent != 'true' && steps.filter.outputs.linux == 'true') }}
      full_matrix: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || steps.final_gate.outputs.active == 'true' || (steps.incremental.outputs.reuse_parent != 'true' && steps.filter.outputs.engine == 'true') }}
      run_canary_smoke: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || steps.final_gate.outputs.active == 'true' || (steps.incremental.outputs.reuse_parent != 'true' && (steps.filter.outputs.engine == 'true' || steps.filter.outputs.shared_datapack == 'true' || steps.filter.outputs.canary_datapack == 'true')) }}
      run_global_smoke: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || steps.final_gate.outputs.active == 'true' || (steps.incremental.outputs.reuse_parent != 'true' && (steps.filter.outputs.engine == 'true' || steps.filter.outputs.shared_datapack == 'true' || steps.filter.outputs.global_datapack == 'true')) }}
      docker: ${{ (github.event_name == 'workflow_dispatch' || steps.final_gate.outputs.active == 'true') && 'true' || (steps.incremental.outputs.reuse_parent != 'true' && steps.filter.outputs.docker) }}
      docker_quickstart: ${{ (github.event_name == 'workflow_dispatch' || steps.final_gate.outputs.active == 'true') && 'true' || (steps.incremental.outputs.reuse_parent != 'true' && steps.filter.outputs.docker_quickstart) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Detect final gate label
        id: final_gate
        if: github.event_name == 'pull_request'
        run: echo "active=${{ contains(github.event.pull_request.labels.*.name, 'ci:final-gate') }}" >> "$GITHUB_OUTPUT"

      - name: Evaluate immediate-parent CI reuse
        id: incremental
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python tools/agents/ci_incremental_validation.py
          --profile ci
          --workflow-name CI
          --event-name "${{ github.event_name }}"
          --event-action "${{ github.event.action }}"

      - name: Detect changed paths
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            linux:
              - "src/**"
              - "tests/**"
              - "data/**"
              - "data-canary/**"
              - "data-otservbr-global/**"
              - "cmake/**"
              - "docker/**"
              - "docs/lua-api/**"
              - "docs/systems/**"
              - "tools/**"
              - "vcproj/**"
              - "vcpkg.json"
              - "CMakeLists.txt"
              - "CMakePresets.json"
              - ".github/scripts/**"
              - ".github/workflows/**"
            engine:
              - "src/**"
              - "tests/**"
              - "cmake/**"
              - "vcproj/**"
              - "vcpkg.json"
              - "CMakeLists.txt"
              - "CMakePresets.json"
              - ".github/workflows/ci.yml"
              - ".github/workflows/reusable-build-linux.yml"
              - ".github/workflows/reusable-build-windows.yml"
              - ".github/workflows/reusable-build-macos.yml"
              - ".github/scripts/**"
            shared_datapack:
              - "data/**"
            canary_datapack:
              - "data-canary/**"
            global_datapack:
              - "data-otservbr-global/**"
            docker:
              - "docker/**"
              - "src/**"
              - "cmake/**"
              - "vcpkg.json"
              - "CMakeLists.txt"
              - "CMakePresets.json"
              - ".github/workflows/ci.yml"
              - ".github/workflows/reusable-build-docker.yml"
              - ".github/workflows/reusable-docker-quickstart-smoke.yml"
              - ".github/scripts/**"
            docker_quickstart:
              - "docker/docker-compose.yml"
              - "docker/.env.dist"
              - "docker/quickstart/**"
              - "docker/data/01-test_account.sql"
              - "docker/data/02-test_account_players.sql"
              - ".github/scripts/docker-quickstart-smoke.sh"
              - ".github/workflows/ci.yml"
              - ".github/workflows/reusable-docker-quickstart-smoke.yml"

      - name: Summarize incremental decision
        if: github.event_name == 'pull_request'
        run: |
          echo "reuse_parent=${{ steps.incremental.outputs.reuse_parent || 'false' }}"
          echo "final_gate=${{ steps.final_gate.outputs.active || 'false' }}"
          echo "reason=${{ steps.incremental.outputs.reason }}"

  # --- Fast Checks ---

  checks:
    name: Fast Checks
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    permissions:
      contents: write
      checks: write
    uses: ./.github/workflows/reusable-checks.yml
    secrets: inherit

  tests-lua:
    name: Lua Tests
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-tests-lua.yml
    secrets: inherit

  # --- Heavy Builds ---

  build-linux:
    name: Build - Linux
    needs: [changes, checks, tests-lua]
    if: needs.changes.outputs.linux == 'true' && needs.checks.result == 'success' && needs.tests-lua.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false)
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/reusable-build-linux.yml
    with:
      buildtypes: ${{ needs.changes.outputs.full_matrix == 'true' && '["linux-release","linux-debug"]' || '["linux-release"]' }}
      run_canary_smoke: ${{ needs.changes.outputs.run_canary_smoke == 'true' }}
      run_global_smoke: ${{ needs.changes.outputs.run_global_smoke == 'true' }}
    secrets: inherit

  build-windows:
    name: Build - Windows
    needs: [changes, checks, tests-lua]
    if: needs.changes.outputs.full_matrix == 'true' && needs.checks.result == 'success' && needs.tests-lua.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false)
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-build-windows.yml
    with:
      run_canary_smoke: ${{ needs.changes.outputs.run_canary_smoke == 'true' }}
    secrets: inherit

  # macOS compilation is intentionally suspended. The reusable workflow is
  # retained for an explicit future re-enable task, but normal CI does not call it.

  build-docker:
    name: Build - Docker
    needs: [changes, checks, tests-lua]
    if: needs.changes.outputs.docker == 'true' && needs.checks.result == 'success' && needs.tests-lua.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft)
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-build-docker.yml
    secrets: inherit

  docker-quickstart-smoke:
    name: Docker Quickstart Smoke
    needs: [changes, checks, tests-lua, build-docker]
    if: (needs.changes.outputs.docker == 'true' || needs.changes.outputs.docker_quickstart == 'true') && needs.checks.result == 'success' && needs.tests-lua.result == 'success' && needs.build-docker.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft)
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-docker-quickstart-smoke.yml

  required:
    name: Required
    if: always()
    needs:
      - changes
      - checks
      - tests-lua
      - build-linux
      - build-windows
      - build-docker
      - docker-quickstart-smoke
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Evaluate required jobs
        env:
          IS_DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'true' || 'false' }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys

          jobs = json.loads(os.environ["NEEDS_JSON"])
          rejected = {}
          is_draft = os.environ["IS_DRAFT"] == "true"

          if jobs["changes"].get("result") != "success":
              rejected["changes"] = (
                  f"expected success, got {jobs['changes'].get('result')}"
              )

          for name in ("checks", "tests-lua"):
              result = jobs[name].get("result")
              allowed = {"success", "skipped"} if is_draft else {"success"}
              if result not in allowed:
                  rejected[name] = f"expected {sorted(allowed)}, got {result}"

          scopes = jobs["changes"].get("outputs", {})
          for scope in ("linux", "full_matrix", "docker", "docker_quickstart"):
              if scopes.get(scope) not in {"true", "false"}:
                  rejected[f"scope:{scope}"] = (
                      f"expected true or false, got {scopes.get(scope)!r}"
                  )

          required_builds = {
              "build-linux": scopes.get("linux") == "true",
              "build-windows": scopes.get("full_matrix") == "true",
              "build-docker": scopes.get("docker") == "true",
              "docker-quickstart-smoke": (
                  scopes.get("docker") == "true"
                  or scopes.get("docker_quickstart") == "true"
              ),
          }

          for name, required in required_builds.items():
              result = jobs[name].get("result")
              if result not in {"success", "skipped"}:
                  rejected[name] = f"unexpected conclusion {result}"
              elif not is_draft and required and result != "success":
                  rejected[name] = (
                      f"selected scope requires success, got {result}"
                  )

          print("Required job results:")
          for name in sorted(jobs):
              print(f"- {name}: {jobs[name].get('result')}")

          print("Detected scopes:")
          for scope in sorted(scopes):
              print(f"- {scope}: {scopes.get(scope)}")

          if rejected:
              for name, reason in sorted(rejected.items()):
                  print(
                      "::error title=Required CI job did not pass::"
                      f"{name}: {reason}"
                  )
              sys.exit(1)
          PY
