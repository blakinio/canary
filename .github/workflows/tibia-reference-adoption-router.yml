name: Tibia Reference Adoption Router

on:
  pull_request:
    paths:
      - "tools/ai-agent/tibia_reference_adoption_router.py"
      - "tools/ai-agent/tibia_reference_adoption_router_tool.py"
      - "tools/ai-agent/test_tibia_reference_adoption_router.py"
      - "tools/ai-agent/test_tibia_reference_adoption_router_output_safety.py"
      - "tools/ai-agent/test_tibia_reference_adoption_router_schema.py"
      - "docs/ai-agent/TIBIA_REFERENCE_ADOPTION_ROUTER.md"
      - "docs/ai-agent/TIBIA_REFERENCE_ADOPTION_ROUTING_REQUEST.schema.json"
      - "docs/ai-agent/TIBIA_REFERENCE_ADOPTION_ROUTING.schema.json"
      - ".github/workflows/tibia-reference-adoption-router.yml"
      - "docs/agents/tasks/active/CAN-20260730-tcr-011-adoption-router.md"
      - "docs/agents/programs/OTBM_TIBIA_CLIENT_REFERENCE_PROGRAM.md"
      - "docs/agents/MODULE_CATALOG.md"
      - "docs/agents/CHANGELOG.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  adoption-router:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Unit tests
        run: >-
          python -m unittest discover
          -s tools/ai-agent
          -p "test_tibia_reference_adoption_router*.py"
          -v
      - name: Compile Python
        run: >-
          python -m py_compile
          tools/ai-agent/tibia_reference_adoption_router.py
          tools/ai-agent/tibia_reference_adoption_router_tool.py
          tools/ai-agent/test_tibia_reference_adoption_router.py
          tools/ai-agent/test_tibia_reference_adoption_router_output_safety.py
          tools/ai-agent/test_tibia_reference_adoption_router_schema.py
      - name: Validate schemas
        run: |
          python -m json.tool docs/ai-agent/TIBIA_REFERENCE_ADOPTION_ROUTING_REQUEST.schema.json >/dev/null
          python -m json.tool docs/ai-agent/TIBIA_REFERENCE_ADOPTION_ROUTING.schema.json >/dev/null
      - name: Validate CLI
        run: python tools/ai-agent/tibia_reference_adoption_router_tool.py --help >/dev/null

  harden-input-identity:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: adoption-router
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply exact input-identity hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old in text:
                  if text.count(old) != 1:
                      raise SystemExit(f"expected one match in {path}, found {text.count(old)}")
                  target.write_text(text.replace(old, new), encoding="utf-8")
                  return
              if new in text:
                  return
              raise SystemExit(f"neither old nor hardened text found in {path}")

          core = "tools/ai-agent/tibia_reference_adoption_router.py"
          replace_once(
              core,
              '''def canonical_json(value: Any) -> str:\n    return json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(",", ":"))\n''',
              '''def canonical_json(value: Any) -> str:\n    try:\n        return json.dumps(\n            value,\n            ensure_ascii=False,\n            sort_keys=True,\n            separators=(",", ":"),\n            allow_nan=False,\n        )\n    except (TypeError, ValueError) as exc:\n        raise AdoptionRoutingError("value is not canonical JSON") from exc\n''',
          )
          replace_once(
              core,
              '''def load_json_file(path: Path, *, label: str) -> dict[str, Any]:\n    candidate = path.expanduser()\n    if candidate.is_symlink():\n        raise AdoptionRoutingError(f"{label} must not be a symlink: {path}")\n    source = candidate.resolve(strict=True)\n    if not source.is_file():\n        raise AdoptionRoutingError(f"{label} must be a regular file: {source}")\n    before = source.stat()\n    if before.st_size > MAX_INPUT_BYTES:\n        raise AdoptionRoutingError(f"{label} exceeds {MAX_INPUT_BYTES} bytes")\n    data = source.read_bytes()\n    after = source.stat()\n    before_identity = (before.st_dev, before.st_ino, before.st_size, before.st_mtime_ns)\n    after_identity = (after.st_dev, after.st_ino, after.st_size, after.st_mtime_ns)\n    if before_identity != after_identity or len(data) != after.st_size:\n        raise AdoptionRoutingError(f"{label} changed while reading")\n    try:\n        document = json.loads(data.decode("utf-8"), object_pairs_hook=_pairs_no_duplicates)\n    except UnicodeDecodeError as exc:\n        raise AdoptionRoutingError(f"{label} must be UTF-8") from exc\n    except json.JSONDecodeError as exc:\n        raise AdoptionRoutingError(\n            f"{label} is invalid JSON: {exc.msg} at line {exc.lineno}, column {exc.colno}"\n        ) from exc\n    if not isinstance(document, dict):\n        raise AdoptionRoutingError(f"{label} must contain a JSON object")\n    return document\n''',
              '''def load_json_file_with_sha256(\n    path: Path, *, label: str\n) -> tuple[dict[str, Any], str]:\n    candidate = path.expanduser()\n    if candidate.is_symlink():\n        raise AdoptionRoutingError(f"{label} must not be a symlink: {path}")\n    source = candidate.resolve(strict=True)\n    if not source.is_file():\n        raise AdoptionRoutingError(f"{label} must be a regular file: {source}")\n    before = source.stat()\n    if before.st_size > MAX_INPUT_BYTES:\n        raise AdoptionRoutingError(f"{label} exceeds {MAX_INPUT_BYTES} bytes")\n    data = source.read_bytes()\n    after = source.stat()\n    before_identity = (before.st_dev, before.st_ino, before.st_size, before.st_mtime_ns)\n    after_identity = (after.st_dev, after.st_ino, after.st_size, after.st_mtime_ns)\n    if before_identity != after_identity or len(data) != after.st_size:\n        raise AdoptionRoutingError(f"{label} changed while reading")\n    try:\n        document = json.loads(\n            data.decode("utf-8"),\n            object_pairs_hook=_pairs_no_duplicates,\n            parse_constant=lambda token: (_ for _ in ()).throw(\n                AdoptionRoutingError(f"{label} contains non-finite number {token}")\n            ),\n        )\n    except UnicodeDecodeError as exc:\n        raise AdoptionRoutingError(f"{label} must be UTF-8") from exc\n    except json.JSONDecodeError as exc:\n        raise AdoptionRoutingError(\n            f"{label} is invalid JSON: {exc.msg} at line {exc.lineno}, column {exc.colno}"\n        ) from exc\n    if not isinstance(document, dict):\n        raise AdoptionRoutingError(f"{label} must contain a JSON object")\n    return document, hashlib.sha256(data).hexdigest()\n\n\ndef load_json_file(path: Path, *, label: str) -> dict[str, Any]:\n    document, _ = load_json_file_with_sha256(path, label=label)\n    return document\n''',
          )

          cli = "tools/ai-agent/tibia_reference_adoption_router_tool.py"
          replace_once(
              cli,
              '''    load_json_file,\n    sha256_path,\n''',
              '''    load_json_file_with_sha256,\n''',
          )
          replace_once(
              cli,
              '''    gateway = load_json_file(gateway_path, label="gateway report")\n    request = load_json_file(request_path, label="routing request")\n    report = build_routing_report(\n        gateway,\n        request,\n        gateway_file_sha256=sha256_path(gateway_path),\n        request_file_sha256=sha256_path(request_path),\n    )\n''',
              '''    gateway, gateway_file_sha256 = load_json_file_with_sha256(\n        gateway_path, label="gateway report"\n    )\n    request, request_file_sha256 = load_json_file_with_sha256(\n        request_path, label="routing request"\n    )\n    report = build_routing_report(\n        gateway,\n        request,\n        gateway_file_sha256=gateway_file_sha256,\n        request_file_sha256=request_file_sha256,\n    )\n''',
          )

          schema_test = "tools/ai-agent/test_tibia_reference_adoption_router_schema.py"
          replace_once(
              schema_test,
              '''from tibia_reference_adoption_router import (\n    ALL_TARGETS,\n    REPORT_FORMAT,\n    REQUEST_FORMAT,\n)\n''',
              '''from tibia_reference_adoption_router import (\n    ALL_TARGETS,\n    AdoptionRoutingError,\n    REPORT_FORMAT,\n    REQUEST_FORMAT,\n    canonical_sha256,\n)\n''',
          )
          replace_once(
              schema_test,
              '''    def test_report_schema_preserves_non_execution_policy(self) -> None:\n''',
              '''    def test_non_finite_numbers_are_not_canonical_json(self) -> None:\n        with self.assertRaisesRegex(AdoptionRoutingError, "not canonical JSON"):\n            canonical_sha256({"value": float("nan")})\n        with self.assertRaisesRegex(AdoptionRoutingError, "not canonical JSON"):\n            canonical_sha256({"value": float("inf")})\n\n    def test_report_schema_preserves_non_execution_policy(self) -> None:\n''',
          )
          PY
      - name: Commit input-identity hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/ai-agent/tibia_reference_adoption_router.py tools/ai-agent/tibia_reference_adoption_router_tool.py tools/ai-agent/test_tibia_reference_adoption_router_schema.py
          if git diff --cached --quiet; then
            echo "Input-identity hardening already applied."
          else
            git commit -m "fix(tcr): bind routing hashes to exact input bytes"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
