---
name: SEC-005 recovery materializer

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/sec005-recovery-materialize.yml"
      - "docs/agents/CHANGELOG.md"
      - "docs/agents/MODULE_CATALOG.md"
      - "docs/agents/tasks/active/CAN-20260726-security-authenticated-session-transport-recovery.md"

permissions:
  contents: write

concurrency:
  group: sec005-recovery-materialize-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/security-authenticated-session-transport-recovery'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout recovery head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          fetch-depth: 0
      - name: Apply idempotent shared-record updates
        run: |
          python - <<'PY'
          from pathlib import Path

          changelog_path = Path("docs/agents/CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          changelog_entry = "- Recovers OTS-SEC-005 authenticated game-session and post-login sequence/XTEA validation from stale PR #514 onto current `main` through PR #974: the strict code-owned plan uses repository-owned disposable fixtures and literal loopback, proves the current first-game Adler32/RSA handoff, then validates authenticated control, zero-sequence, sequence-gap, sequence-replay and invalid-XTEA-padding cases with same-session expected-sequence recovery plus a fresh distinct-source control. Manifests cannot supply credentials, packet bytes, key material, commands or network targets; session races, economy/transactions, Redis/multichannel, hostile-server client behavior, sustained capacity and production targets remain separate evidence."
          if changelog_entry not in changelog:
              marker = "## Unreleased\n\n"
              if marker not in changelog:
                  raise SystemExit("missing Unreleased marker")
              changelog = changelog.replace(marker, marker + changelog_entry + "\n", 1)
              changelog_path.write_text(changelog, encoding="utf-8")

          catalog_path = Path("docs/agents/MODULE_CATALOG.md")
          catalog = catalog_path.read_text(encoding="utf-8")
          old_row = "| OTS Security Validation Platform | active (#433, #440, #451, #462) | Product-neutral source-regression registry and runtime delegation layer with bounded exact-head unauthenticated status-parser and login-protocol boundary packs using fixed code-owned cases, deterministic isolated loopback sources, protocol-aware controls, process/fatal diagnostics and SHA-256 evidence | `tools/security/**`, `tests/security/**`, `docs/security/SECURITY_VALIDATION_PLATFORM.md`, `.github/workflows/security-validation.yml` | Reuse the source-regression, delegation and bounded runtime contracts. Runtime drivers must stay on explicitly authorized disposable targets and reuse Universal E2E/Agent Load lifecycle; never add arbitrary manifest commands, packet payloads, credentials or network targets, and do not treat SEC-003/SEC-004 as successful authentication, game-session, post-login transport or flood coverage. |"
          new_row = "| OTS Security Validation Platform | active (#433, #440, #451, #462, #974; stale source #514) | Product-neutral source-regression registry and runtime delegation layer with bounded exact-head unauthenticated status-parser, login-boundary and authenticated game-session/post-login sequence/XTEA packs using fixed code-owned cases, deterministic isolated loopback sources, protocol-aware controls, process/fatal diagnostics and SHA-256 evidence | `tools/security/**`, `tests/security/**`, `docs/security/SECURITY_VALIDATION_PLATFORM.md`, `docs/security/SECURITY_VALIDATION_SEC005.md`, `.github/workflows/security-validation.yml` | Reuse the source-regression, delegation and bounded runtime contracts. Runtime drivers must stay on explicitly authorized disposable targets and reuse Universal E2E/Agent Load lifecycle; never add arbitrary manifest commands, packet payloads, credentials or network targets. SEC-005 proves only its registered disposable-fixture authentication and sequence/XTEA rejection-and-recovery assertions; session races, economy/transactions, Redis/multichannel, hostile-server client behavior, sustained capacity and production remain separate evidence. |"
          if new_row not in catalog:
              if old_row not in catalog:
                  raise SystemExit("current security catalogue row did not match")
              catalog = catalog.replace(old_row, new_row, 1)
              catalog_path.write_text(catalog, encoding="utf-8")

          task_path = Path("docs/agents/tasks/active/CAN-20260726-security-authenticated-session-transport-recovery.md")
          task = task_path.read_text(encoding="utf-8")
          task = task.replace('related_pr: "pending"', 'related_pr: "974"', 1)
          task = task.replace("pr: pending", "pr: 974", 1)
          task_path.write_text(task, encoding="utf-8")
          PY
      - name: Commit materialized records
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet; then
            echo "Shared records already materialized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/agents/CHANGELOG.md docs/agents/MODULE_CATALOG.md docs/agents/tasks/active/CAN-20260726-security-authenticated-session-transport-recovery.md
          git commit -m "docs(security): integrate SEC-005 shared records"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
