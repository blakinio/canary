name: OWA-003D Exact Execution

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/owa-003d-exact-execution.yml"
      - "docs/agents/tasks/active/CAN-20260731-owa-003d-exact-execution.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retain-operational-evidence:
    name: Retain exact operational evidence
    runs-on: ubuntu-latest
    env:
      EVIDENCE_BLOB_SHA: 9011cd11936f62300b5580f7df8f8d8a66375eaf
      EVIDENCE_ARCHIVE_SHA256: a6eee52e88db1012b2cdc1555892fca56aa3db69c0ec486a18b65841f99c0fc0
    steps:
      - name: Materialize uncommitted evidence archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${EVIDENCE_BLOB_SHA}" --jq .content \
            | tr -d '\n' \
            | base64 --decode \
            > owa-003d-operational-evidence.tar.gz
          printf '%s  %s\n' "${EVIDENCE_ARCHIVE_SHA256}" owa-003d-operational-evidence.tar.gz \
            | sha256sum --check --strict

      - name: Record workflow execution identity
        shell: bash
        run: |
          set -euo pipefail
          cat > workflow-execution.json <<EOF
          {
            "artifactName": "owa-003d-operational-evidence",
            "archiveSha256": "${EVIDENCE_ARCHIVE_SHA256}",
            "evidenceBlobSha": "${EVIDENCE_BLOB_SHA}",
            "headSha": "${GITHUB_SHA}",
            "repository": "${GITHUB_REPOSITORY}",
            "runAttempt": "${GITHUB_RUN_ATTEMPT}",
            "workflowRunId": "${GITHUB_RUN_ID}"
          }
          EOF
          sha256sum owa-003d-operational-evidence.tar.gz workflow-execution.json > SHA256SUMS

      - name: Upload retained operational evidence
        uses: actions/upload-artifact@v4
        with:
          name: owa-003d-operational-evidence
          path: |
            owa-003d-operational-evidence.tar.gz
            workflow-execution.json
            SHA256SUMS
          if-no-files-found: error
          retention-days: 90
