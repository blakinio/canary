---
name: Agent Task Ownership

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "AGENTS.md"
      - "docs/agents/**"
      - "tools/agents/*.py"
      - ".github/workflows/agent-task-ownership.yml"
      - ".github/workflows/agent-task-lifecycle.yml"
  push:
    branches:
      - main
    paths:
      - "AGENTS.md"
      - "docs/agents/**"
      - "tools/agents/*.py"
      - ".github/workflows/agent-task-ownership.yml"
      - ".github/workflows/agent-task-lifecycle.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate active ownership
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile agent tooling
        run: >-
          python -m py_compile
          tools/agents/task_ownership.py
          tools/agents/test_task_ownership.py
          tools/agents/checkpoint.py
          tools/agents/execution_mode.py
          tools/agents/context.py
          tools/agents/resume.py
          tools/agents/task_lifecycle.py
          tools/agents/efficiency_eval.py
          tools/agents/supervisor_queue.py
          tools/agents/ci_incremental_validation.py
          tools/agents/test_context_orchestration.py
          tools/agents/test_task_lifecycle.py
          tools/agents/test_efficiency_eval.py
          tools/agents/test_supervisor_queue.py
          tools/agents/test_ci_incremental_validation.py

      - name: Run focused unit tests
        working-directory: tools/agents
        run: >-
          python -m unittest -v
          test_task_ownership.py
          test_context_orchestration.py
          test_task_lifecycle.py
          test_efficiency_eval.py
          test_supervisor_queue.py
          test_ci_incremental_validation.py

      - name: Collect changed files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          mkdir -p artifacts/agent-coordination
          output="artifacts/agent-coordination/CHANGED_FILES.txt"

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --name-only "origin/${BASE_REF}...HEAD" > "$output"
          elif [[ "$EVENT_NAME" == "push" && -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            git diff --name-only "$BEFORE_SHA...HEAD" > "$output"
          else
            : > "$output"
          fi

          cat "$output"

      - name: Validate changed active task checkpoints
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          args=(
            validate-changed
            --changed-files-file artifacts/agent-coordination/CHANGED_FILES.txt
          )
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            args+=(--current-pr "$PR_NUMBER")
          fi
          python tools/agents/task_lifecycle.py "${args[@]}" 2>&1 \
            | tee artifacts/agent-coordination/CHANGED_TASK_VALIDATION.txt

      - name: Validate tasks and render ownership index
        run: >-
          python tools/agents/task_ownership.py
          --write-index artifacts/agent-coordination/OWNERSHIP_INDEX.md

      - name: Upload ownership diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: active-task-ownership
          path: |
            artifacts/agent-coordination/CHANGED_FILES.txt
            artifacts/agent-coordination/CHANGED_TASK_VALIDATION.txt
            artifacts/agent-coordination/OWNERSHIP_INDEX.md
          if-no-files-found: warn
          retention-days: 14

  qri006_client_event_hardening:
    name: Apply QRI-006 client-event hardening
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/e2e-qri-006-client-event-paths'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch client event, regression test and active task
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test -f .github/qri006-client-event-hardening.trigger
          python3 - <<'PY'
          import os
          from pathlib import Path

          pr = os.environ["PR_NUMBER"]

          client_path = Path("tools/e2e/client/agent_e2e.lua")
          client = client_path.read_text(encoding="utf-8")
          old = '''\tlocal packetRecord = string.format("%s/session-%d.record", ARTIFACT_DIR, phase)
          \tappendEvent("login_request_" .. phase, string.format("%s:%d/%s/%s/v%d", HOST, GAME_PORT, WORLD, CHARACTER, CLIENT_VERSION))
          \tappendEvent("packet_record_" .. phase, packetRecord)
          '''
          new = '''\tlocal packetRecordName = string.format("session-%d.record", phase)
          \tlocal packetRecord = string.format("%s/%s", ARTIFACT_DIR, packetRecordName)
          \tappendEvent("login_request_" .. phase, string.format("%s:%d/%s/%s/v%d", HOST, GAME_PORT, WORLD, CHARACTER, CLIENT_VERSION))
          \tappendEvent("packet_record_" .. phase, packetRecordName)
          '''
          if old not in client:
              raise SystemExit("client packet-record block not found")
          client_path.write_text(client.replace(old, new, 1), encoding="utf-8")

          test_path = Path("tests/e2e/test_cleanup_result_envelope.py")
          test = test_path.read_text(encoding="utf-8")
          marker = '''\n\nif __name__ == "__main__":\n'''
          addition = '''
              def test_client_driver_emits_only_packet_record_artifact_name(self):
                  repo_root = Path(__file__).resolve().parents[2]
                  source = (repo_root / "tools/e2e/client/agent_e2e.lua").read_text(
                      encoding="utf-8"
                  )
                  self.assertIn(
                      'local packetRecordName = string.format("session-%d.record", phase)',
                      source,
                  )
                  self.assertIn(
                      'local packetRecord = string.format("%s/%s", ARTIFACT_DIR, packetRecordName)',
                      source,
                  )
                  self.assertIn(
                      'appendEvent("packet_record_" .. phase, packetRecordName)',
                      source,
                  )
                  self.assertIn(
                      'g_game.loginWorld(ACCOUNT, PASSWORD, WORLD, HOST, GAME_PORT, CHARACTER, "", sessionKey, packetRecord)',
                      source,
                  )
                  self.assertNotIn(
                      'appendEvent("packet_record_" .. phase, packetRecord)',
                      source,
                  )
          '''
          if marker not in test:
              raise SystemExit("test insertion marker not found")
          test_path.write_text(test.replace(marker, addition + marker, 1), encoding="utf-8")

          task_path = Path("docs/agents/tasks/active/CAN-20260724-e2e-qri-006-cleanup-certification.md")
          task = task_path.read_text(encoding="utf-8")
          replacements = {
              "status: ready": "status: implementing",
              "branch: feat/e2e-qri-006-cleanup-certification": "branch: fix/e2e-qri-006-client-event-paths",
              'last_verified_commit: "d996db1dc3c585766bb17eb5000f57a19f2a1e9c"': 'last_verified_commit: "6ad2172eb8e4d5a9fcda0d69f2b6c88906082bfb"',
              'related_pr: "871"': f'related_pr: "{pr}"',
              "head: 8cd80cd92b3c5a904f3bfea910328ca828604a3a": "head: 4a6d7c418f3dead8616862476971a2a8ee23e606",
              "pr: 871": f"pr: {pr}",
              "next_action: Complete the exact final-head CI, ownership and physical gate, then squash-merge PR 871 and verify the automated lifecycle archive PR.": "next_action: Run exact-head ownership, CI and physical login/relog; inspect raw client-events.tsv for zero absolute runner paths; merge the hardening PR and archive QRI-006.",
          }
          for old_text, new_text in replacements.items():
              if old_text not in task:
                  raise SystemExit(f"task replacement missing: {old_text}")
              task = task.replace(old_text, new_text, 1)
          ownership_anchor = "    - docs/agents/tasks/active/CAN-20260724-e2e-qri-006-cleanup-certification.md\n"
          if ownership_anchor not in task:
              raise SystemExit("task ownership anchor missing")
          task = task.replace(
              ownership_anchor,
              ownership_anchor + "    - tools/e2e/client/agent_e2e.lua\n",
              1,
          )
          changed_anchor = "  - tools/e2e/run_physical_e2e.sh\n"
          if changed_anchor not in task:
              raise SystemExit("changed path anchor missing")
          task = task.replace(
              changed_anchor,
              changed_anchor + "  - tools/e2e/client/agent_e2e.lua\n",
              1,
          )
          proven_anchor = "  - Absolute runner paths found in legacy session-record events were reduced to artifact basenames by d996db1dc3c585766bb17eb5000f57a19f2a1e9c with a focused regression test.\n"
          if proven_anchor not in task:
              raise SystemExit("proven anchor missing")
          task = task.replace(
              proven_anchor,
              proven_anchor
              + "  - Delivery PR 871 merged as 6ad2172eb8e4d5a9fcda0d69f2b6c88906082bfb after exact-head ownership, full CI and Universal Agent E2E passed at 4a6d7c418f3dead8616862476971a2a8ee23e606.\n"
              + "  - Post-merge artifact 8597198699 retained absolute /home/runner paths only in raw client-events.tsv packet_record_1/2 values; result.json and cleanup-certification.json remained sanitized and cleanup certified 18/18.\n"
              + "  - The follow-up keeps the full packet-record path for loginWorld while emitting only session-N.record into client-events.tsv.\n",
              1,
          )
          task = task.replace(
              "unknown: []",
              "unknown:\n  - Raw client-events.tsv basename hardening is not physically re-proven until the follow-up login/relog artifact is inspected.",
              1,
          )
          task_path.write_text(task, encoding="utf-8")
          PY

          python -m unittest -v tests.e2e.test_cleanup_result_envelope
          python -m py_compile tests/e2e/test_cleanup_result_envelope.py

          git fetch origin main
          git checkout origin/main -- .github/workflows/agent-task-ownership.yml
          rm -f .github/qri006-client-event-hardening.trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/e2e/client/agent_e2e.lua tests/e2e/test_cleanup_result_envelope.py docs/agents/tasks/active/CAN-20260724-e2e-qri-006-cleanup-certification.md .github/workflows/agent-task-ownership.yml .github/qri006-client-event-hardening.trigger
          git commit -m "fix(e2e): redact raw packet-record event paths"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
