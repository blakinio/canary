---
name: Agent Task Ownership

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "AGENTS.md"
      - "docs/agents/**"
      - "tools/agents/*.py"
      - ".github/workflows/agent-task-ownership.yml"
      - ".github/workflows/agent-task-lifecycle.yml"
  push:
    branches:
      - main
    paths:
      - "AGENTS.md"
      - "docs/agents/**"
      - "tools/agents/*.py"
      - ".github/workflows/agent-task-ownership.yml"
      - ".github/workflows/agent-task-lifecycle.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate active ownership
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile agent tooling
        run: >-
          python -m py_compile
          tools/agents/task_ownership.py
          tools/agents/test_task_ownership.py
          tools/agents/checkpoint.py
          tools/agents/execution_mode.py
          tools/agents/context.py
          tools/agents/resume.py
          tools/agents/task_lifecycle.py
          tools/agents/efficiency_eval.py
          tools/agents/supervisor_queue.py
          tools/agents/ci_incremental_validation.py
          tools/agents/test_context_orchestration.py
          tools/agents/test_task_lifecycle.py
          tools/agents/test_efficiency_eval.py
          tools/agents/test_supervisor_queue.py
          tools/agents/test_ci_incremental_validation.py

      - name: Run focused unit tests
        working-directory: tools/agents
        run: >-
          python -m unittest -v
          test_task_ownership.py
          test_context_orchestration.py
          test_task_lifecycle.py
          test_efficiency_eval.py
          test_supervisor_queue.py
          test_ci_incremental_validation.py

      - name: Collect changed files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          mkdir -p artifacts/agent-coordination
          output="artifacts/agent-coordination/CHANGED_FILES.txt"

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --name-only "origin/${BASE_REF}...HEAD" > "$output"
          elif [[ "$EVENT_NAME" == "push" && -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            git diff --name-only "$BEFORE_SHA...HEAD" > "$output"
          else
            : > "$output"
          fi

          cat "$output"

      - name: Validate changed active task checkpoints
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          args=(
            validate-changed
            --changed-files-file artifacts/agent-coordination/CHANGED_FILES.txt
          )
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            args+=(--current-pr "$PR_NUMBER")
          fi
          python tools/agents/task_lifecycle.py "${args[@]}" 2>&1 \
            | tee artifacts/agent-coordination/CHANGED_TASK_VALIDATION.txt

      - name: Validate tasks and render ownership index
        run: >-
          python tools/agents/task_ownership.py
          --write-index artifacts/agent-coordination/OWNERSHIP_INDEX.md

      - name: Upload ownership diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: active-task-ownership
          path: |
            artifacts/agent-coordination/CHANGED_FILES.txt
            artifacts/agent-coordination/CHANGED_TASK_VALIDATION.txt
            artifacts/agent-coordination/OWNERSHIP_INDEX.md
          if-no-files-found: warn
          retention-days: 14

  tcr009-matrix-repair:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 993
    name: Repair TCR-009 validation matrix
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout lifecycle branch
        uses: actions/checkout@v6
        with:
          ref: docs/archive-tcr-009-blocked-20260728
          fetch-depth: 0

      - name: Repair validation matrix only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/agents/programs/OTBM_TIBIA_CLIENT_REFERENCE_PROGRAM.md')
          text = path.read_text(encoding='utf-8')
          start = text.index('# Validation matrix')
          end = text.index('# Last bounded lifecycle disposition', start)
          prefix = text[:start]
          matrix = text[start:end]
          suffix = text[end:]
          replacements = {
              '| TCR-008 | Optional Minimap Reference | optional/deferred-no-concrete-use-case | no concrete parity use case found in fresh 2026-07-28 preflight | TCR-001 merged | low | Do not implement on speculation. Reopen only for a documented advisory-only use case not already covered by World Index, landmarks, Reachability, factual rendering or StaticMapData. |': '| TCR-008 | required | required | required | minimap fixtures | no pathfinder duplication | no |',
              '| TCR-009 | Client Reference Drift | blocked-external-evidence | PR #992 / merge `8a88e2f0...`; request `RTREQ-TCR-ITEM-DEFINITIONS-0002`; blocker `TCR009_REQUIRES_TWO_COMPLETE_EXACT_REFERENCE_SNAPSHOTS` | TCR-002, TCR-003, TCR-004 | medium | Owner must provide two distinct complete exact retained manifest/index snapshot sets. No drift producer or stable-contract claim exists yet. |': '| TCR-009 | required | both snapshots | n/a | drift fixtures | release provenance/freshness | no |',
              '| TCR-010 | Compact Evidence Gateway Integration | blocked-by-TCR-009 | stable TCR-005/006/007 exist; TCR-009 is not stable | TCR-005, TCR-006, TCR-007, TCR-009 stable/merged | low | Do not start until `canary-tibia-client-reference-drift-v1` is genuinely stable/merged. Reuse QA-018. |': '| TCR-010 | existing QA-018 | existing QA-018 | existing QA-018 | pointer fixtures | evidence gateway | no |',
              '| TCR-011 | Reviewed Adoption Router | blocked-by-TCR-009-and-TCR-010 | stable TCR-005/006/007 exist; TCR-009/010 are not stable | TCR-005, TCR-006, TCR-007, TCR-009, TCR-010 stable/merged | medium | Do not start until all required producer/gateway contracts are stable/merged. No executor or mutation authority. |': '| TCR-011 | required | exact finding refs | n/a | routing fixtures | repair/subsystem owners | downstream |',
          }
          for old, new in replacements.items():
              assert matrix.count(old) == 1, old
              matrix = matrix.replace(old, new, 1)
          repaired = prefix + matrix + suffix
          assert repaired.count('| TCR-008 | optional/deferred-no-concrete-use-case |') == 1
          assert '| TCR-008 | required | required | required | minimap fixtures | no pathfinder duplication | no |' in repaired
          path.write_text(repaired, encoding='utf-8')
          PY

      - name: Validate repaired programme
        shell: bash
        run: |
          grep -Fq '| TCR-008 | required | required | required | minimap fixtures | no pathfinder duplication | no |' docs/agents/programs/OTBM_TIBIA_CLIENT_REFERENCE_PROGRAM.md
          grep -Fq '| TCR-009 | required | both snapshots | n/a | drift fixtures | release provenance/freshness | no |' docs/agents/programs/OTBM_TIBIA_CLIENT_REFERENCE_PROGRAM.md
          grep -Fq '| TCR-010 | existing QA-018 | existing QA-018 | existing QA-018 | pointer fixtures | evidence gateway | no |' docs/agents/programs/OTBM_TIBIA_CLIENT_REFERENCE_PROGRAM.md
          grep -Fq '| TCR-011 | required | exact finding refs | n/a | routing fixtures | repair/subsystem owners | downstream |' docs/agents/programs/OTBM_TIBIA_CLIENT_REFERENCE_PROGRAM.md
          python tools/agents/real_tibia_evidence.py validate --as-of 2026-07-26
          python tools/agents/real_tibia_evidence.py generate --check --as-of 2026-07-26

      - name: Commit repair and remove temporary workflow change
        shell: bash
        run: |
          git checkout origin/main -- .github/workflows/agent-task-ownership.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/agents/programs/OTBM_TIBIA_CLIENT_REFERENCE_PROGRAM.md .github/workflows/agent-task-ownership.yml
          git diff --cached --quiet && { echo "Expected matrix repair was not produced"; exit 1; }
          git commit -m "docs(tcr): restore validation matrix semantics"
          git push origin HEAD:docs/archive-tcr-009-blocked-20260728
