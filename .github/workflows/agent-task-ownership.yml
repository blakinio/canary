---
name: Agent Task Ownership

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "AGENTS.md"
      - "docs/agents/**"
      - "tools/agents/*.py"
      - ".github/workflows/agent-task-ownership.yml"
      - ".github/workflows/agent-task-lifecycle.yml"
  push:
    branches:
      - main
    paths:
      - "AGENTS.md"
      - "docs/agents/**"
      - "tools/agents/*.py"
      - ".github/workflows/agent-task-ownership.yml"
      - ".github/workflows/agent-task-lifecycle.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate active ownership
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile agent tooling
        run: >-
          python -m py_compile
          tools/agents/task_ownership.py
          tools/agents/test_task_ownership.py
          tools/agents/checkpoint.py
          tools/agents/execution_mode.py
          tools/agents/context.py
          tools/agents/resume.py
          tools/agents/task_lifecycle.py
          tools/agents/efficiency_eval.py
          tools/agents/supervisor_queue.py
          tools/agents/ci_incremental_validation.py
          tools/agents/test_context_orchestration.py
          tools/agents/test_task_lifecycle.py
          tools/agents/test_efficiency_eval.py
          tools/agents/test_supervisor_queue.py
          tools/agents/test_ci_incremental_validation.py

      - name: Run focused unit tests
        working-directory: tools/agents
        run: >-
          python -m unittest -v
          test_task_ownership.py
          test_context_orchestration.py
          test_task_lifecycle.py
          test_efficiency_eval.py
          test_supervisor_queue.py
          test_ci_incremental_validation.py

      - name: Collect changed files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          mkdir -p artifacts/agent-coordination
          output="artifacts/agent-coordination/CHANGED_FILES.txt"

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --name-only "origin/${BASE_REF}...HEAD" > "$output"
          elif [[ "$EVENT_NAME" == "push" && -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            git diff --name-only "$BEFORE_SHA...HEAD" > "$output"
          else
            : > "$output"
          fi

          cat "$output"

      - name: Validate changed active task checkpoints
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          args=(
            validate-changed
            --changed-files-file artifacts/agent-coordination/CHANGED_FILES.txt
          )
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            args+=(--current-pr "$PR_NUMBER")
          fi
          python tools/agents/task_lifecycle.py "${args[@]}" 2>&1 \
            | tee artifacts/agent-coordination/CHANGED_TASK_VALIDATION.txt

      - name: Validate tasks and render ownership index
        run: >-
          python tools/agents/task_ownership.py
          --write-index artifacts/agent-coordination/OWNERSHIP_INDEX.md

      - name: Upload ownership diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: active-task-ownership
          path: |
            artifacts/agent-coordination/CHANGED_FILES.txt
            artifacts/agent-coordination/CHANGED_TASK_VALIDATION.txt
            artifacts/agent-coordination/OWNERSHIP_INDEX.md
          if-no-files-found: warn
          retention-days: 14

  qri006_checkpoint_compaction:
    name: Compact QRI-006 follow-up checkpoint
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/e2e-qri-006-client-event-paths'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compact checkpoint and restore workflow
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/qri006-checkpoint-compaction.trigger
          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/agents/tasks/active/CAN-20260724-e2e-qri-006-cleanup-certification.md")
          text = path.read_text(encoding="utf-8")
          obsolete = "  - Absolute runner paths found in legacy session-record events were reduced to artifact basenames by d996db1dc3c585766bb17eb5000f57a19f2a1e9c with a focused regression test.\n"
          inserted = (
              "  - Delivery PR 871 merged as 6ad2172eb8e4d5a9fcda0d69f2b6c88906082bfb after exact-head ownership, full CI and Universal Agent E2E passed at 4a6d7c418f3dead8616862476971a2a8ee23e606.\n"
              "  - Post-merge artifact 8597198699 retained absolute /home/runner paths only in raw client-events.tsv packet_record_1/2 values; result.json and cleanup-certification.json remained sanitized and cleanup certified 18/18.\n"
              "  - The follow-up keeps the full packet-record path for loginWorld while emitting only session-N.record into client-events.tsv.\n"
          )
          compact = "  - Delivery PR 871 merged as 6ad2172eb8e4d5a9fcda0d69f2b6c88906082bfb after exact-head gates; post-merge artifact 8597198699 proved cleanup 18/18 but exposed absolute packet_record_1/2 values only in raw client-events.tsv, so PR 875 keeps the full loginWorld path while emitting only session-N.record events.\n"
          if obsolete not in text:
              raise SystemExit("obsolete proven entry missing")
          if inserted not in text:
              raise SystemExit("follow-up proven entries missing")
          text = text.replace(obsolete, "", 1).replace(inserted, compact, 1)
          path.write_text(text, encoding="utf-8")
          PY
          git fetch origin main
          git checkout origin/main -- .github/workflows/agent-task-ownership.yml
          rm -f .github/qri006-checkpoint-compaction.trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/agents/tasks/active/CAN-20260724-e2e-qri-006-cleanup-certification.md .github/workflows/agent-task-ownership.yml .github/qri006-checkpoint-compaction.trigger
          git commit -m "docs(e2e): compact QRI-006 follow-up checkpoint"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
