---
name: Tibia Client Reference Drift

on:
  pull_request:
    paths:
      - "tools/ai-agent/tibia_client_reference_drift.py"
      - "tools/ai-agent/test_tibia_client_reference_drift.py"
      - "docs/ai-agent/TIBIA_CLIENT_REFERENCE_DRIFT.md"
      - "docs/ai-agent/TIBIA_CLIENT_REFERENCE_DRIFT.schema.json"
      - "docs/agents/real-tibia/evidence/**"
      - "docs/agents/programs/OTBM_TIBIA_CLIENT_REFERENCE_PROGRAM.md"
      - "docs/agents/MODULE_CATALOG.md"
      - "docs/agents/CHANGELOG.md"
      - ".github/workflows/tibia-client-reference-drift.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: tools/ai-agent
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install schema checker
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Run drift tests
        run: python -m unittest discover -s tools/ai-agent -p "test_tibia_client_reference_drift.py" -v
      - name: Compile producer
        run: python -m py_compile tools/ai-agent/tibia_client_reference_drift.py tools/ai-agent/test_tibia_client_reference_drift.py
      - name: Validate drift schema syntax
        run: python -m json.tool docs/ai-agent/TIBIA_CLIENT_REFERENCE_DRIFT.schema.json > /dev/null
      - name: Validate canonical evidence result
        run: |
          python tools/agents/real_tibia_evidence.py validate --as-of 2026-07-29
          python tools/agents/real_tibia_evidence.py generate --check --as-of 2026-07-29
          test "$(python -c 'import json; print(json.load(open("docs/agents/real-tibia/evidence/requests/tcr/RTREQ-TCR-ITEM-DEFINITIONS-0002.yaml"))["status"])')" = "consumed"
