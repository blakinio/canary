name: RTEC-002 Lifecycle Repair

on:
  push:
    branches:
      - automation/archive-agent-task-pr-910-manual
    paths:
      - ".github/workflows/rtec-002-lifecycle-repair.yml"

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply canonical lifecycle transformation
        shell: bash
        run: |
          set -euo pipefail
          python tools/agents/task_lifecycle.py archive-pr \
            --pr-number 910 \
            --merge-commit fe35eda9c14766c80d13c161d38ce13a1db6e0d5 \
            --merged-at 2026-07-25T08:52:56Z \
            --feature-head a3ff7430e190a61ab2c6465b4ba1daa4526d6743 \
            --write
          rm .github/workflows/rtec-002-lifecycle-repair.yml
          test ! -e docs/agents/tasks/active/CAN-20260725-rtec-002-vocations-pilot.md
          test -e docs/agents/tasks/archive/CAN-20260725-rtec-002-vocations-pilot.md

      - name: Commit exact lifecycle result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No lifecycle changes produced"; exit 1; }
          git commit -m "docs(agents): archive merged PR #910 task"
          git push origin "HEAD:${GITHUB_REF_NAME}"
