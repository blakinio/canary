---
name: Tibia Client Reference

on:
  pull_request:
    paths:
      - ".github/workflows/tibia-client-reference.yml"
      - "docs/agents/tasks/active/CAN-20260724-tcr-006-content-reference-correlation.md"

permissions:
  contents: read

jobs:
  compact-tcr006-handover:
    if: github.head_ref == 'feat/tcr-006-content-reference-correlation'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Context checkpoint
        run: >-
          python tools/agents/checkpoint.py
          docs/agents/tasks/active/CAN-20260724-tcr-006-content-reference-correlation.md
          --require-checkpoint

      - name: Generate compact handover
        run: |
          mkdir -p artifacts/agent-coordination
          python tools/agents/resume.py \
            --task docs/agents/tasks/active/CAN-20260724-tcr-006-content-reference-correlation.md \
            | tee artifacts/agent-coordination/TCR006_COMPACT_HANDOVER.txt

      - name: Upload compact handover
        uses: actions/upload-artifact@v4
        with:
          name: tcr006-compact-handover
          path: artifacts/agent-coordination/TCR006_COMPACT_HANDOVER.txt
          if-no-files-found: error
