---
name: Tibia Client Reference

on:
  pull_request:
    paths:
      - ".github/workflows/tibia-client-reference.yml"
      - ".tcr006-stage/payload.zip"
      - ".tcr006-stage/test-failure.txt"

permissions:
  contents: write

jobs:
  finalize-tcr006-implementation:
    if: >-
      github.head_ref == 'feat/tcr-006-content-reference-correlation' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore current main catalogue
        run: |
          git fetch --depth=1 origin main
          git show FETCH_HEAD:docs/agents/MODULE_CATALOG.md > docs/agents/MODULE_CATALOG.md

      - name: Add TCR-006 catalogue entry
        shell: python
        run: |
          from pathlib import Path

          catalog_path = Path('docs/agents/MODULE_CATALOG.md')
          catalog = catalog_path.read_text(encoding='utf-8')
          row = (
              '| Tibia content reference correlation | active TCR-006 (#880) | '
              'Deterministic provenance-pinned `canary-tibia-content-reference-resolver-v1` and read-only '
              '`canary-tibia-content-reference-correlation-v1` across StaticData creature/monster, boss, '
              'title/achievement and quest registry evidence routed to existing subsystem owners | '
              '`tools/ai-agent/tibia_content_reference_correlation*.py`, focused tests, '
              '`docs/ai-agent/TIBIA_CONTENT_REFERENCE_CORRELATION.md`, resolver/correlation schemas, dedicated workflow | '
              'Preserve legacy/newer source vocabulary, require reviewed per-namespace mappings, keep shared IDs and quest '
              'source selection fail-closed, exclude houses owned by TCR-005, and never infer runtime/gameplay parity or mutate sources. |'
          )
          if row not in catalog:
              lines = catalog.splitlines()
              anchor = '| OTBM house reference parity |'
              matches = [index for index, line in enumerate(lines) if line.startswith(anchor)]
              if len(matches) != 1:
                  raise SystemExit(f'expected one house-parity anchor, found {len(matches)}')
              lines.insert(matches[0] + 1, row)
              catalog = '\n'.join(lines) + '\n'
          if catalog.count(row) != 1:
              raise SystemExit(f'expected one TCR-006 row, found {catalog.count(row)}')
          catalog_path.write_text(catalog, encoding='utf-8')

      - name: Remove temporary staging files
        run: rm -rf .tcr006-stage

      - name: Validate implementation package
        env:
          PYTHONPATH: tools/ai-agent
        run: |
          python -m unittest discover -s tools/ai-agent -p "test_tibia_content_reference_correlation.py" -v
          python -m py_compile \
            tools/ai-agent/tibia_content_reference_correlation.py \
            tools/ai-agent/tibia_content_reference_correlation_tool.py \
            tools/ai-agent/test_tibia_content_reference_correlation.py
          python -m json.tool docs/ai-agent/TIBIA_CONTENT_REFERENCE_CORRELATION.schema.json > /dev/null
          python -m json.tool docs/ai-agent/TIBIA_CONTENT_REFERENCE_RESOLVER.schema.json > /dev/null
          python tools/ai-agent/tibia_content_reference_correlation_tool.py --help > /dev/null
          git diff --check

      - name: Commit catalogue and staging cleanup
        run: |
          set -euo pipefail
          git add docs/agents/MODULE_CATALOG.md
          git add -A -- .tcr006-stage
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(tcr): catalogue content reference correlation"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
