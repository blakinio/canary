---
name: TCR-007 Catalogue Finalizer

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/tibia-client-reference.yml"
      - "docs/agents/MODULE_CATALOG.md"
      - "tools/ai-agent/tibia_proficiency_reference_correlation.py"

permissions:
  contents: write

jobs:
  finalize-catalogue:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/tcr-007-proficiency-reference-correlation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Add exact TCR-007 catalogue row
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/agents/MODULE_CATALOG.md')
          text = path.read_text(encoding='utf-8')
          anchor = "| Tibia client-reference proficiency index | active TCR-004 (#858) | Deterministic manifest-bound read-only `canary-tibia-proficiency-index-v1` preserving IDs, names, optional versions, ordered levels, optional XP requirements and reviewed perk records with explicit duplicate findings | `tools/ai-agent/tibia_proficiency_reference_index*.py`, focused tests, `docs/ai-agent/TIBIA_PROFICIENCY_REFERENCE_INDEX.md`, schema, dedicated workflow | Reuse for exact selected proficiency-definition evidence. It does not parse appearances, write `items.xml`, register runtime data or prove persistence/protocol/gameplay. TCR-007 owns correlation through the canonical appearance index. |"
          row = "| Tibia proficiency reference correlation | active TCR-007 (#898) | Deterministic provenance-pinned `canary-tibia-proficiency-reference-resolver-v1` and read-only `canary-tibia-proficiency-reference-correlation-v1` across exact TCR-004 definitions, canonical appearance proficiency/object bindings and compact Canary loader/runtime evidence | `tools/ai-agent/tibia_proficiency_reference_*.py`, focused tests, `docs/ai-agent/TIBIA_PROFICIENCY_REFERENCE_CORRELATION.md`, resolver/correlation schemas, dedicated workflow | Reuse the canonical proficiency and appearance indexes plus loader-backed item binding evidence. Keep definition, appearance, item, runtime, persistence, protocol/client, automated behavior and Physical E2E dimensions separate; never infer numeric equivalence without reviewed resolver evidence, mutate sources or claim gameplay parity. |"
          if row not in text:
              if text.count(anchor) != 1:
                  raise SystemExit(f'expected one exact TCR-004 anchor, found {text.count(anchor)}')
              path.write_text(text.replace(anchor, anchor + '\n' + row, 1), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/agents/MODULE_CATALOG.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'docs(tcr): register proficiency reference correlation'
          git push origin HEAD:feat/tcr-007-proficiency-reference-correlation
