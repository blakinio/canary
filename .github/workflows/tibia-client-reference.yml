name: TCR-007 Materialize via Canonical Workflow

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/tibia-client-reference.yml
      - .github/workflows/tcr007-materialize.yml
      - .tcr007-stage/payload.tar.xz
      - .tcr007-stage/payload.sha256.actual
      - .tcr007-stage/payload-diagnostic.log
      - docs/agents/tasks/active/CAN-20260724-tcr-007-proficiency-reference-correlation.md

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/tcr-007-proficiency-reference-correlation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture exact staged archive diagnostics
        shell: bash
        run: |
          set +e
          {
            echo 'sha256:'
            sha256sum .tcr007-stage/payload.tar.xz
            echo 'file:'
            file .tcr007-stage/payload.tar.xz
            echo 'xz-test:'
            xz -tv .tcr007-stage/payload.tar.xz
            echo 'tar-list:'
            tar -tvJf .tcr007-stage/payload.tar.xz
            echo 'python-tarfile:'
            python - <<'PY'
          import json
          import tarfile
          rows = []
          with tarfile.open('.tcr007-stage/payload.tar.xz', mode='r:xz') as archive:
              for member in archive.getmembers():
                  rows.append({
                      'name': member.name,
                      'type': 'file' if member.isfile() else 'directory' if member.isdir() else 'symlink' if member.issym() else 'hardlink' if member.islnk() else 'other',
                      'size': member.size,
                      'linkname': member.linkname,
                  })
          print(json.dumps(rows, indent=2, sort_keys=True))
          PY
          } > .tcr007-stage/payload-diagnostic.log 2>&1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .tcr007-stage/payload-diagnostic.log
          if ! git diff --cached --quiet; then
            git commit -m 'ci(tcr): record staged archive diagnostics'
            git push origin HEAD:feat/tcr-007-proficiency-reference-correlation
          fi
          exit 1
