name: TCR-007 Materialize via Canonical Workflow

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/tibia-client-reference.yml
      - .github/workflows/tcr007-materialize.yml
      - .tcr007-stage/payload.tar.xz
      - .tcr007-stage/payload.sha256.actual
      - docs/agents/tasks/active/CAN-20260724-tcr-007-proficiency-reference-correlation.md

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/tcr-007-proficiency-reference-correlation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact staged payload
        shell: bash
        run: |
          expected='23c33d4bb1a79b3c70ac698e3a77c4e054b3ca061ce4a86610e0149cf8603547'
          actual="$(sha256sum .tcr007-stage/payload.tar.xz | awk '{print $1}')"
          test "$actual" = "$expected"
          python - <<'PY'
          from pathlib import PurePosixPath
          import tarfile

          expected = {
              'tools/ai-agent/tibia_proficiency_reference_common.py',
              'tools/ai-agent/tibia_proficiency_reference_inventory.py',
              'tools/ai-agent/tibia_proficiency_reference_resolver.py',
              'tools/ai-agent/tibia_proficiency_reference_correlation.py',
              'tools/ai-agent/tibia_proficiency_reference_correlation_tool.py',
              'tools/ai-agent/tibia_proficiency_reference_test_support.py',
              'tools/ai-agent/test_tibia_proficiency_reference_correlation.py',
              'tools/ai-agent/test_tibia_proficiency_reference_inventory.py',
              'docs/ai-agent/TIBIA_PROFICIENCY_REFERENCE_CORRELATION.md',
              'docs/ai-agent/TIBIA_PROFICIENCY_REFERENCE_CORRELATION.schema.json',
              'docs/ai-agent/TIBIA_PROFICIENCY_REFERENCE_RESOLVER.schema.json',
          }
          observed = set()
          with tarfile.open('.tcr007-stage/payload.tar.xz', mode='r:xz') as archive:
              for member in archive.getmembers():
                  normalized = member.name[2:] if member.name.startswith('./') else member.name
                  path = PurePosixPath(normalized)
                  assert normalized and not path.is_absolute() and '..' not in path.parts, member.name
                  assert member.isfile() or member.isdir(), f'unsupported tar member: {member.name}'
                  if member.isfile():
                      observed.add(normalized)
          assert observed == expected, {'missing': sorted(expected - observed), 'extra': sorted(observed - expected)}
          PY
      - name: Extract staged implementation
        shell: bash
        run: |
          tar -xJf .tcr007-stage/payload.tar.xz
          chmod +x tools/ai-agent/tibia_proficiency_reference_correlation_tool.py
      - name: Validate focused implementation
        env:
          PYTHONPATH: tools/ai-agent
        shell: bash
        run: |
          python -m unittest discover -s tools/ai-agent -p 'test_tibia_proficiency_reference_*.py' -v
          python -m py_compile \
            tools/ai-agent/tibia_proficiency_reference_common.py \
            tools/ai-agent/tibia_proficiency_reference_inventory.py \
            tools/ai-agent/tibia_proficiency_reference_resolver.py \
            tools/ai-agent/tibia_proficiency_reference_correlation.py \
            tools/ai-agent/tibia_proficiency_reference_correlation_tool.py \
            tools/ai-agent/tibia_proficiency_reference_test_support.py \
            tools/ai-agent/test_tibia_proficiency_reference_correlation.py \
            tools/ai-agent/test_tibia_proficiency_reference_inventory.py
          python -m json.tool docs/ai-agent/TIBIA_PROFICIENCY_REFERENCE_RESOLVER.schema.json >/dev/null
          python -m json.tool docs/ai-agent/TIBIA_PROFICIENCY_REFERENCE_CORRELATION.schema.json >/dev/null
          python tools/ai-agent/tibia_proficiency_reference_correlation_tool.py --help >/dev/null
          python tools/ai-agent/tibia_proficiency_reference_correlation_tool.py inventory --repository-root . --output /tmp/TCR007_CANARY_EVIDENCE_A.json
          python tools/ai-agent/tibia_proficiency_reference_correlation_tool.py inventory --repository-root . --output /tmp/TCR007_CANARY_EVIDENCE_B.json
          cmp /tmp/TCR007_CANARY_EVIDENCE_A.json /tmp/TCR007_CANARY_EVIDENCE_B.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/TCR007_CANARY_EVIDENCE_A.json').read_text())
          assert report['format'] == 'canary-tcr007-canary-evidence-v1'
          assert report['runtimeDefinitions']['recordCount'] > 0
          assert report['itemBindingContract']['objectIdAssignsItemId'] is True
          assert report['itemBindingContract']['proficiencyFlagAssignsRuntimeBinding'] is True
          assert report['itemBindingContract']['unknownRuntimeDefinitionsRejected'] is True
          assert report['runtimeSupport']['persistence'] == 'source-supported'
          PY
      - name: Commit validated implementation
        shell: bash
        run: |
          rm -rf .tcr007-stage .github/workflows/tcr007-materialize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(tcr): implement proficiency reference correlation'
          git push origin HEAD:feat/tcr-007-proficiency-reference-correlation
