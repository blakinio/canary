name: TCR-006 Closeout Finalizer

on:
  push:
    branches:
      - docs/tcr-006-lifecycle-closeout
    paths:
      - .github/workflows/tibia-client-reference.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct handoff and restore workflows
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/agents/programs/OTBM_TIBIA_CLIENT_REFERENCE_PROGRAM.md')
          text = path.read_text(encoding='utf-8')
          old = '7. Do not silently continue into TCR-007 or another TCR package in the same PR.'
          new = '7. Do not silently continue into TCR-008 or another TCR package in the same PR.'
          if text.count(old) != 1:
              raise SystemExit(f'expected one stale kickoff line, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git fetch origin main
          git show origin/main:.github/workflows/tibia-client-reference.yml > .github/workflows/tibia-client-reference.yml
          rm -f .github/workflows/tcr006-lifecycle-fix.yml
          python tools/agents/checkpoint.py docs/agents/tasks/archive/CAN-20260724-tcr-006-content-reference-correlation.md
          grep -F '7. Do not silently continue into TCR-008 or another TCR package in the same PR.' docs/agents/programs/OTBM_TIBIA_CLIENT_REFERENCE_PROGRAM.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(tcr): finalize TCR-006 lifecycle handoff"
          git push origin HEAD:docs/tcr-006-lifecycle-closeout
