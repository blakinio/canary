---
name: Tibia Client Reference

on:
  pull_request:
    paths:
      - ".github/workflows/tibia-client-reference.yml"
      - ".tcr006-stage/payload.zip"

permissions:
  contents: write

jobs:
  materialize-tcr006-payload:
    if: >-
      github.head_ref == 'feat/tcr-006-content-reference-correlation' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify and materialize exact payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object .tcr006-stage/payload.zip)" = "f0446001244d636ccc8745a821b67cedc5fb9577"
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import stat
          import zipfile
          from pathlib import Path, PurePosixPath

          archive = Path('.tcr006-stage/payload.zip')
          expected = (
              'docs/ai-agent/TIBIA_CONTENT_REFERENCE_CORRELATION.md',
              'docs/ai-agent/TIBIA_CONTENT_REFERENCE_CORRELATION.schema.json',
              'docs/ai-agent/TIBIA_CONTENT_REFERENCE_RESOLVER.schema.json',
              'tools/ai-agent/test_tibia_content_reference_correlation.py',
              'tools/ai-agent/tibia_content_reference_correlation.py',
              'tools/ai-agent/tibia_content_reference_correlation_tool.py',
          )
          expected_set = set(expected)

          with zipfile.ZipFile(archive) as payload:
              files: list[str] = []
              for info in payload.infolist():
                  path = PurePosixPath(info.filename)
                  if path.is_absolute() or '..' in path.parts or '\\' in info.filename:
                      raise SystemExit(f'unsafe archive member: {info.filename!r}')
                  if info.flag_bits & 0x1:
                      raise SystemExit(f'encrypted archive member: {info.filename!r}')
                  if stat.S_ISLNK(info.external_attr >> 16):
                      raise SystemExit(f'symlink archive member: {info.filename!r}')
                  if info.is_dir():
                      continue
                  files.append(info.filename)

              if len(files) != len(set(files)):
                  raise SystemExit('duplicate archive member detected')
              if set(files) != expected_set:
                  raise SystemExit(
                      'unexpected payload members: '
                      f'missing={sorted(expected_set - set(files))}, '
                      f'extra={sorted(set(files) - expected_set)}'
                  )

              for name in expected:
                  destination = Path(name)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  data = payload.read(name)
                  destination.write_bytes(data)
                  print(f'{name} sha256={hashlib.sha256(data).hexdigest()} bytes={len(data)}')
          PY

      - name: Run focused tests
        run: python -m unittest -v tools/ai-agent/test_tibia_content_reference_correlation.py

      - name: Compile implementation
        run: >-
          python -m py_compile
          tools/ai-agent/tibia_content_reference_correlation.py
          tools/ai-agent/tibia_content_reference_correlation_tool.py
          tools/ai-agent/test_tibia_content_reference_correlation.py

      - name: Validate schema syntax
        run: |
          python -m json.tool docs/ai-agent/TIBIA_CONTENT_REFERENCE_CORRELATION.schema.json > /dev/null
          python -m json.tool docs/ai-agent/TIBIA_CONTENT_REFERENCE_RESOLVER.schema.json > /dev/null

      - name: Check materialized diff
        run: |
          git diff --check -- \
            docs/ai-agent/TIBIA_CONTENT_REFERENCE_CORRELATION.md \
            docs/ai-agent/TIBIA_CONTENT_REFERENCE_CORRELATION.schema.json \
            docs/ai-agent/TIBIA_CONTENT_REFERENCE_RESOLVER.schema.json \
            tools/ai-agent/test_tibia_content_reference_correlation.py \
            tools/ai-agent/tibia_content_reference_correlation.py \
            tools/ai-agent/tibia_content_reference_correlation_tool.py

      - name: Commit exact implementation files
        shell: bash
        run: |
          set -euo pipefail
          expected="$RUNNER_TEMP/tcr006-expected.txt"
          actual="$RUNNER_TEMP/tcr006-actual.txt"
          cat > "$expected" <<'EOF'
          docs/ai-agent/TIBIA_CONTENT_REFERENCE_CORRELATION.md
          docs/ai-agent/TIBIA_CONTENT_REFERENCE_CORRELATION.schema.json
          docs/ai-agent/TIBIA_CONTENT_REFERENCE_RESOLVER.schema.json
          tools/ai-agent/test_tibia_content_reference_correlation.py
          tools/ai-agent/tibia_content_reference_correlation.py
          tools/ai-agent/tibia_content_reference_correlation_tool.py
          EOF
          git status --porcelain=v1 | sed -E 's/^.. //' | sort > "$actual"
          diff -u "$expected" "$actual"
          git add --pathspec-from-file="$expected"
          git diff --cached --check
          git diff --cached --name-only | sort | diff -u "$expected" -
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(tcr): add content reference correlation consumer"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
