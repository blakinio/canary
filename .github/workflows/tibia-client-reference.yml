name: TCR-006 Closeout Finalizer

on:
  pull_request:
    branches:
      - main
    paths:
      - .tcr006-finalizer-trigger
      - .github/workflows/tibia-client-reference.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'docs/tcr-006-lifecycle-closeout'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/tcr-006-lifecycle-closeout
          fetch-depth: 0
      - name: Correct durable handoff
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/agents/programs/OTBM_TIBIA_CLIENT_REFERENCE_PROGRAM.md')
          text = path.read_text(encoding='utf-8')
          old = '7. Do not silently continue into TCR-007 or another TCR package in the same PR.'
          new = '7. Do not silently continue into TCR-008 or another TCR package in the same PR.'
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          elif new not in text:
              raise SystemExit('neither expected handoff line is present')
          PY
          rm -f .tcr006-finalizer-trigger
          grep -F '7. Do not silently continue into TCR-008 or another TCR package in the same PR.' docs/agents/programs/OTBM_TIBIA_CLIENT_REFERENCE_PROGRAM.md
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/agents/programs/OTBM_TIBIA_CLIENT_REFERENCE_PROGRAM.md .tcr006-finalizer-trigger
          git commit -m "docs(tcr): finalize TCR-006 lifecycle handoff"
          git push origin HEAD:docs/tcr-006-lifecycle-closeout
