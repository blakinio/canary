name: TCR-007 Materialize via Canonical Workflow

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/tibia-client-reference.yml
      - .github/workflows/tcr007-materialize.yml
      - .tcr007-stage/payload.tar.xz
      - .tcr007-stage/payload.sha256.actual
      - .tcr007-stage/payload-members.json
      - docs/agents/tasks/active/CAN-20260724-tcr-007-proficiency-reference-correlation.md

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/tcr-007-proficiency-reference-correlation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact staged payload
        shell: bash
        run: |
          expected='23c33d4bb1a79b3c70ac698e3a77c4e054b3ca061ce4a86610e0149cf8603547'
          actual="$(sha256sum .tcr007-stage/payload.tar.xz | awk '{print $1}')"
          test "$actual" = "$expected"
          python - <<'PY'
          import json
          import tarfile
          from pathlib import Path

          rows = []
          with tarfile.open('.tcr007-stage/payload.tar.xz', mode='r:xz') as archive:
              for member in archive.getmembers():
                  rows.append({
                      'name': member.name,
                      'type': 'file' if member.isfile() else 'directory' if member.isdir() else 'symlink' if member.issym() else 'hardlink' if member.islnk() else 'other',
                      'size': member.size,
                      'linkname': member.linkname,
                  })
          Path('.tcr007-stage/payload-members.json').write_text(json.dumps(rows, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .tcr007-stage/payload-members.json
          if ! git diff --cached --quiet; then
            git commit -m 'ci(tcr): record exact staged tar members'
            git push origin HEAD:feat/tcr-007-proficiency-reference-correlation
          fi
          exit 1
