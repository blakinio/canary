name: OTBM Crystal Lifecycle Materialize

on:
  push:
    branches:
      - docs/otbm-crystal-parity-lifecycle
    paths:
      - ".github/workflows/otbm-crystal-lifecycle-materialize.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.ref == 'refs/heads/docs/otbm-crystal-parity-lifecycle'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: docs/otbm-crystal-parity-lifecycle
          fetch-depth: 0

      - name: Materialize lifecycle documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          archive = Path("docs/agents/tasks/archive/CAN-20260725-otbm-crystal-parity-baseline.md")
          text = archive.read_text(encoding="utf-8")
          text = text.replace('related_pr: "923"', 'related_pr: "923, 935"', 1)
          text = text.replace('- Lifecycle closure PR: pending.', '- Lifecycle closure PR: #935.', 1)
          text = text.replace(
              'Delivery PR #923 is merged. The lifecycle closure releases every task-owned path and records the global-world baseline as durable read-only evidence.',
              'Delivery PR #923 is merged. Lifecycle closure PR #935 releases every task-owned path and records the global-world baseline as durable read-only evidence.',
              1,
          )
          archive.write_text(text, encoding="utf-8")

          catalog = Path("docs/agents/MODULE_CATALOG.md")
          lines = catalog.read_text(encoding="utf-8").splitlines()
          matches = [i for i, line in enumerate(lines) if line.startswith("| Semantic OTBM Diff |")]
          if len(matches) != 1:
              raise SystemExit(f"expected one Semantic OTBM Diff row, found {len(matches)}")
          lines[matches[0]] = (
              "| Semantic OTBM Diff | merged (#311, #923; lifecycle #935) | "
              "Deterministic read-only tile, item-stack, mechanic and Phase 3 walkability comparison over two canonical World Index inputs; "
              "report `canary-otbm-semantic-diff-v1` and factual render manifest `canary-otbm-semantic-diff-render-v1`; "
              "the full-world area-major correction preserves exact counters over canonical compound area/tile ordering and records the pinned CrystalServer global baseline | "
              "`tools/ai-agent/otbm_semantic_diff*.py`, 34 focused tests, schema, `.github/workflows/otbm-semantic-diff.yml`, "
              "`docs/ai-agent/OTBM_SEMANTIC_DIFF.md`, `docs/agents/real-tibia/OTBM_CRYSTAL_PARITY_BASELINE_2026-07-25.md` | "
              "Reuse the native scanner/World Index, exact Phase 3 tile classifier and existing factual renderer. "
              "Do not parse OTBM again, match items heuristically, treat selected-scope correlation as global proof, modify maps or generate AI map imagery. "
              "The Crystal baseline is exact static comparison evidence, not runtime/gameplay parity or import authorization. |"
          )
          catalog.write_text("\n".join(lines) + "\n", encoding="utf-8")

          changelog = Path("docs/agents/CHANGELOG.md")
          lines = changelog.read_text(encoding="utf-8").splitlines()
          matches = [i for i, line in enumerate(lines) if line.startswith("- Fixes full-index `canary-otbm-semantic-diff-v1`")]
          if len(matches) != 1:
              raise SystemExit(f"expected one OTBM changelog row, found {len(matches)}")
          lines[matches[0]] = (
              "- Delivers through PR #923 and lifecycle closure #935 the full-index `canary-otbm-semantic-diff-v1` correction over canonical area-major World Index storage: "
              "exact compound area/tile ordering replaces the invalid global-position assumption, retained samples avoid discarded-object work after their budget is full, "
              "and validated unmatched areas use exact bulk totals. The corrected CrystalServer global baseline separately pins the gzip repository blob and decompressed OTBM payload, "
              "proves 1,159 shared 256x256-floor area keys and 17,214,872 unchanged tiles, and records 1,884,169 changed positions with 3,277,274 exact findings. "
              "These totals remain read-only investigation evidence and never authorize automatic repair, identifier remapping or CrystalServer authority."
          )
          changelog.write_text("\n".join(lines) + "\n", encoding="utf-8")

          program = Path("docs/agents/programs/CRYSTALSERVER_COMPARISON_PROGRAM.md")
          text = program.read_text(encoding="utf-8")
          text = re.sub(r"^updated: .+$", "updated: 2026-07-25T20:55:00+02:00", text, count=1, flags=re.MULTILINE)
          text = re.sub(
              r'^last_verified_commit: "[0-9a-f]{40}"$',
              'last_verified_commit: "5aaeb2373c4d5e2c8f5c592b629b646085277414"',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          marker = "Stage 1 merged through PR [#291](https://github.com/blakinio/canary/pull/291), squash commit `bceccba9349d35a1d84f446757e53ac3adb602e1`.\n"
          addition = (
              "\nA separate exact global-world OTBM baseline was completed through delivery PR #923 and lifecycle closure #935. "
              "It pins `zimbadev/crystalserver@75e9c72e33ce2c3f193e4f2d2ff17ebae4bbfaac` path `data-global/world/world.otbm`, "
              "compares it read-only with the external OTServBR map through the canonical World Index and Semantic Diff, and records exact static differences without authorizing content import or map mutation.\n"
          )
          if addition.strip() not in text:
              if marker not in text:
                  raise SystemExit("missing Stage 1 merge marker")
              text = text.replace(marker, marker + addition, 1)
          row_marker = "| `CAN-20260714-fs-mkdir-shell-injection` / [#326](https://github.com/blakinio/canary/pull/326) | Replaced shell-backed `FS.mkdir`/`FS.mkdir_p` with native `std::filesystem` bindings and added standalone Lua plus real-binding C++ security regressions | `70f6930647d818edfdf0a30b745aabe8d4fdaa29` | Preserve compatibility wrappers, error returns and the no-shell invariant; CS-007 remains independent. |"
          new_row = (
              "| `CAN-20260725-otbm-crystal-parity-baseline` / [#923](https://github.com/blakinio/canary/pull/923), lifecycle [#935](https://github.com/blakinio/canary/pull/935) | "
              "Corrected full-world Semantic OTBM Diff area-major ordering and published the exact read-only Crystal global ↔ OTServBR baseline: 1,159 shared areas, 17,214,872 unchanged tiles and 3,277,274 exact findings | "
              "`5aaeb2373c4d5e2c8f5c592b629b646085277414` | Use the baseline only to select separate bounded reviews with current script, reachability and subsystem evidence; never copy Crystal content or mutate maps automatically. |"
          )
          if new_row not in text:
              if row_marker not in text:
                  raise SystemExit("missing completed-work insertion marker")
              text = text.replace(row_marker, row_marker + "\n" + new_row, 1)
          program.write_text(text, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/otbm-crystal-lifecycle-materialize.yml
          git add docs/agents/CHANGELOG.md \
            docs/agents/MODULE_CATALOG.md \
            docs/agents/programs/CRYSTALSERVER_COMPARISON_PROGRAM.md \
            docs/agents/tasks/archive/CAN-20260725-otbm-crystal-parity-baseline.md \
            .github/workflows/otbm-crystal-lifecycle-materialize.yml
          git commit -m "docs(otbm): materialize lifecycle closure"
          git push origin HEAD:docs/otbm-crystal-parity-lifecycle
