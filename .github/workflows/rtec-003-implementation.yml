      - name: Add focused lifecycle tests
        shell: bash
        run: |
          set -euo pipefail
          cat > tools/agents/test_real_tibia_owner_request.py <<'PY'
          from __future__ import annotations

          import copy
          import hashlib
          import json
          from pathlib import Path
          from unittest import mock

          import real_tibia_owner_request as lifecycle
          from real_tibia_evidence_test_support import AS_OF, Corpus, EvidenceTestCase, LoadedDocument, dump

          OWNER_TASK = "CAN-OWNER-TEST"
          OWNER_PR = 77
          AT = "2026-07-25T15:45:00+02:00"
          COMMIT = "b" * 40
          DIGEST = "c" * 64


          class RealTibiaOwnerRequestLifecycleTests(EvidenceTestCase):
              def prepared_request(self, owner_kind: str = "e2e") -> dict[str, object]:
                  prefix = owner_kind.upper() if owner_kind != "protocol" else "PROTOCOL"
                  request = self.request(f"RTREQ-{prefix}-COMBAT-0001")
                  request["owner_kind"] = owner_kind
                  request["status"] = "active"
                  request["coordination"]["owner_task"] = OWNER_TASK
                  request["coordination"]["owner_pr"] = OWNER_PR
                  request["history"].append(
                      {
                          "at": AT,
                          "actor": "owner",
                          "actor_role": "owner",
                          "actor_task": OWNER_TASK,
                          "actor_pr": OWNER_PR,
                          "from_status": "planned",
                          "to_status": "active",
                          "reason": "Owner began bounded execution.",
                          "owner_evidence_ref": f"github-pr:blakinio/canary#{OWNER_PR}",
                      }
                  )
                  return request

              def owner_source(self, owner_kind: str, reference: str) -> dict[str, object]:
                  source_type = {
                      "e2e": "physical-e2e-result",
                      "otbm": "otbm-owner-result",
                      "tcr": "tcr-owner-result",
                      "protocol": "packet-capture",
                      "feature": "feature-owner-result",
                  }[owner_kind]
                  source = copy.deepcopy(self.record()["sources"][0])
                  source["source_id"] = f"{owner_kind}-owner-result"
                  source["source_type"] = source_type
                  source["proof_level_reached"] = "behavior-proven" if owner_kind not in {"tcr", "protocol"} else "protocol-proven"
                  source["proves"] = ["Bounded owner result proves the selected behavior."]
                  source["does_not_prove"] = ["The retained result does not prove whole-game parity."]
                  source["external_artifact"] = None
                  source["locator"] = {
                      "url": None,
                      "repository": None,
                      "commit_sha": None,
                      "repository_path": None,
                      "build": None,
                      "report_id": None,
                      "artifact_sha256": None,
                  }
                  parsed = lifecycle.parse_stable_result_ref(reference)
                  if parsed.kind == "repo-file":
                      source["locator"].update(
                          repository=parsed.repository,
                          commit_sha=parsed.commit_sha,
                          repository_path=parsed.repository_path,
                      )
                  elif parsed.kind == "github-commit":
                      source["locator"].update(repository=parsed.repository, commit_sha=parsed.commit_sha)
                  elif parsed.kind in {"github-pr", "github-actions-run", "github-actions-job"}:
                      source["locator"]["report_id"] = parsed.raw
                  elif parsed.kind == "github-actions-artifact":
                      source["locator"].update(
                          repository=parsed.repository,
                          report_id=parsed.raw,
                          artifact_sha256=parsed.sha256,
                      )
                  else:
                      source["locator"]["artifact_sha256"] = parsed.sha256
                  return source

              def result_available(self, owner_kind: str, reference: str) -> dict[str, object]:
                  request = self.prepared_request(owner_kind)
                  proof = "protocol-proven" if owner_kind in {"tcr", "protocol"} else "behavior-proven"
                  return lifecycle.record_result_value(
                      request,
                      expected_status="active",
                      at=AT,
                      actor="owner",
                      actor_task=OWNER_TASK,
                      actor_pr=OWNER_PR,
                      reason="Owner retained a bounded result.",
                      owner_evidence_ref=f"github-pr:blakinio/canary#{OWNER_PR}",
                      owner_task=OWNER_TASK,
                      owner_pr=OWNER_PR,
                      result_refs=[reference],
                      proof_level=proof,
                      proves=["Bounded owner result proves the selected behavior."],
                      does_not_prove=["The retained result does not prove whole-game parity."],
                      blockers=[],
                  )

              def evidence_document(self, request_id: str, owner_kind: str, reference: str) -> LoadedDocument:
                  record = self.record()
                  record["owner_request_refs"] = [request_id]
                  record["proof_level"] = "protocol-proven" if owner_kind in {"tcr", "protocol"} else "behavior-proven"
                  record["sources"] = [self.owner_source(owner_kind, reference)]
                  path = self.root / "docs/agents/real-tibia/evidence/modules/combat/records/RT-COMBAT-0001.yaml"
                  content = json.dumps(record, indent=2, sort_keys=True) + "\n"
                  return LoadedDocument(path, path.relative_to(self.root).as_posix(), record, hashlib.sha256(content.encode()).hexdigest())

              def test_stable_result_reference_grammar(self) -> None:
                  accepted = [
                      "github-pr:blakinio/canary#921",
                      f"github-commit:blakinio/canary@{COMMIT}",
                      "github-actions-run:blakinio/canary#123",
                      "github-actions-job:blakinio/canary#456",
                      f"github-actions-artifact:blakinio/canary#789@sha256:{DIGEST}",
                      f"repo-file:blakinio/canary@{COMMIT}:reports/result.json",
                      f"external-report:sha256:{DIGEST}",
                  ]
                  self.assertEqual([lifecycle.parse_stable_result_ref(item).raw for item in accepted], accepted)
                  for rejected in ("", " github-pr:blakinio/canary#1", "github-pr:bad#1", f"repo-file:blakinio/canary@{COMMIT}:../secret"):
                      with self.subTest(rejected=rejected), self.assertRaises(lifecycle.RequestLifecycleError):
                          lifecycle.parse_stable_result_ref(rejected)

              def test_owner_transition_requires_exact_owner_identity(self) -> None:
                  request = self.request()
                  request["status"] = "ready-for-owner-triage"
                  with self.assertRaisesRegex(lifecycle.RequestLifecycleError, "owner actor"):
                      lifecycle.transition_value(
                          request,
                          expected_status="ready-for-owner-triage",
                          to_status="accepted-by-owner",
                          at=AT,
                          actor="collector",
                          actor_role="collector",
                          actor_task="CAN-COLLECTOR",
                          actor_pr=1,
                          reason="invalid",
                          owner_evidence_ref="github-pr:blakinio/canary#1",
                      )
                  with self.assertRaisesRegex(lifecycle.RequestLifecycleError, "must match"):
                      lifecycle.transition_value(
                          request,
                          expected_status="ready-for-owner-triage",
                          to_status="accepted-by-owner",
                          at=AT,
                          actor="owner",
                          actor_role="owner",
                          actor_task=OWNER_TASK,
                          actor_pr=OWNER_PR,
                          reason="accepted",
                          owner_evidence_ref=f"github-pr:blakinio/canary#{OWNER_PR}",
                          owner_pr=OWNER_PR + 1,
                      )
                  value = lifecycle.transition_value(
                      request,
                      expected_status="ready-for-owner-triage",
                      to_status="accepted-by-owner",
                      at=AT,
                      actor="owner",
                      actor_role="owner",
                      actor_task=OWNER_TASK,
                      actor_pr=OWNER_PR,
                      reason="accepted",
                      owner_evidence_ref=f"github-pr:blakinio/canary#{OWNER_PR}",
                  )
                  self.assertEqual(value["coordination"]["owner_task"], OWNER_TASK)
                  self.assertEqual(value["coordination"]["owner_pr"], OWNER_PR)

              def test_record_result_requires_positive_actor_pr_and_boundaries(self) -> None:
                  request = self.prepared_request("feature")
                  kwargs = dict(
                      expected_status="active",
                      at=AT,
                      actor="owner",
                      actor_task=OWNER_TASK,
                      reason="result",
                      owner_evidence_ref=f"github-pr:blakinio/canary#{OWNER_PR}",
                      owner_task=OWNER_TASK,
                      owner_pr=OWNER_PR,
                      result_refs=[f"repo-file:blakinio/canary@{COMMIT}:reports/result.json"],
                      proof_level="behavior-proven",
                      proves=["Bounded owner result proves the selected behavior."],
                      does_not_prove=["The retained result does not prove whole-game parity."],
                      blockers=[],
                  )
                  with self.assertRaisesRegex(lifecycle.RequestLifecycleError, "positive actor PR"):
                      lifecycle.record_result_value(request, actor_pr=None, **kwargs)
                  with self.assertRaisesRegex(lifecycle.RequestLifecycleError, "must match"):
                      lifecycle.record_result_value(request, actor_pr=OWNER_PR, **{**kwargs, "owner_task": "OTHER"})
                  value = lifecycle.record_result_value(request, actor_pr=OWNER_PR, **kwargs)
                  self.assertEqual(value["status"], "result-available")
                  self.assertTrue(value["result"]["available"])

              def test_consumption_succeeds_for_all_owner_routes(self) -> None:
                  refs = {
                      "e2e": f"github-actions-artifact:blakinio/canary#9@sha256:{DIGEST}",
                      "otbm": f"repo-file:blakinio/canary@{COMMIT}:reports/otbm.json",
                      "tcr": f"github-commit:blakinio/canary@{COMMIT}",
                      "protocol": "github-actions-job:blakinio/canary#44",
                      "feature": f"external-report:sha256:{DIGEST}",
                  }
                  for owner_kind, reference in refs.items():
                      with self.subTest(owner_kind=owner_kind):
                          request = self.result_available(owner_kind, reference)
                          document = self.evidence_document(str(request["request_id"]), owner_kind, reference)
                          consumed = lifecycle.consume_result_value(
                              request,
                              expected_status="result-available",
                              at=AT,
                              actor="collector",
                              actor_role="collector",
                              actor_task="CAN-COLLECTOR",
                              actor_pr=921,
                              reason="Consumed exact retained owner result.",
                              evidence_ids=["RT-COMBAT-0001"],
                              evidence_documents=[document],
                          )
                          self.assertEqual(consumed["status"], "consumed")
                          self.assertEqual(consumed["result"]["consumed_by_evidence_records"], ["RT-COMBAT-0001"])

              def test_consumption_rejects_wrong_link_type_level_and_boundaries(self) -> None:
                  reference = f"repo-file:blakinio/canary@{COMMIT}:reports/result.json"
                  request = self.result_available("feature", reference)
                  document = self.evidence_document(str(request["request_id"]), "feature", reference)
                  cases = []
                  missing_link = copy.deepcopy(document.value)
                  missing_link["owner_request_refs"] = []
                  cases.append((missing_link, "must link owner request"))
                  wrong_type = copy.deepcopy(document.value)
                  wrong_type["sources"][0]["source_type"] = "current-canary"
                  cases.append((wrong_type, "lacks a feature owner-result source"))
                  high_level = copy.deepcopy(document.value)
                  high_level["proof_level"] = "gameplay-proven"
                  cases.append((high_level, "exceeds owner result proof"))
                  extra_claim = copy.deepcopy(document.value)
                  extra_claim["sources"][0]["proves"].append("Unretained extra claim.")
                  cases.append((extra_claim, "claims owner proof absent"))
                  dropped_boundary = copy.deepcopy(document.value)
                  dropped_boundary["sources"][0]["does_not_prove"] = ["Different caveat."]
                  cases.append((dropped_boundary, "drops retained result nonproof"))
                  for value, message in cases:
                      content = json.dumps(value, indent=2, sort_keys=True) + "\n"
                      changed = LoadedDocument(document.path, document.relative_path, value, hashlib.sha256(content.encode()).hexdigest())
                      with self.subTest(message=message), self.assertRaisesRegex(lifecycle.RequestLifecycleError, message):
                          lifecycle.consume_result_value(
                              request,
                              expected_status="result-available",
                              at=AT,
                              actor="collector",
                              actor_role="collector",
                              actor_task="CAN-COLLECTOR",
                              actor_pr=921,
                              reason="consume",
                              evidence_ids=["RT-COMBAT-0001"],
                              evidence_documents=[changed],
                          )

              def test_apply_candidate_dry_run_write_fence_and_rollback(self) -> None:
                  record = self.record()
                  record["owner_request_refs"] = ["RTREQ-E2E-COMBAT-0001"]
                  self.write_record(record)
                  request = self.request()
                  self.write_request(request)
                  self.refresh()
                  request_path = self.root / "docs/agents/real-tibia/evidence/requests/e2e/RTREQ-E2E-COMBAT-0001.yaml"
                  original = request_path.read_bytes()

                  mutation = lambda value, corpus: lifecycle.transition_value(
                      value,
                      expected_status="draft",
                      to_status="ready-for-owner-triage",
                      at=AT,
                      actor="reviewer",
                      actor_role="reviewer",
                      actor_task="CAN-REVIEW",
                      actor_pr=1,
                      reason="bounded and ready",
                  )
                  dry = lifecycle.apply_candidate(
                      root=self.root,
                      request_id="RTREQ-E2E-COMBAT-0001",
                      expected_status="draft",
                      expected_document_sha256=None,
                      as_of=AS_OF,
                      write=False,
                      mutation=mutation,
                  )
                  self.assertEqual(dry["status"], "ready-for-owner-triage")
                  self.assertEqual(request_path.read_bytes(), original)

                  with self.assertRaisesRegex(lifecycle.RequestLifecycleError, "expected sha256"):
                      lifecycle.apply_candidate(
                          root=self.root,
                          request_id="RTREQ-E2E-COMBAT-0001",
                          expected_status="draft",
                          expected_document_sha256="d" * 64,
                          as_of=AS_OF,
                          write=True,
                          mutation=mutation,
                      )

                  with mock.patch.object(lifecycle, "write_generated", side_effect=RuntimeError("boom")):
                      with self.assertRaisesRegex(RuntimeError, "boom"):
                          lifecycle.apply_candidate(
                              root=self.root,
                              request_id="RTREQ-E2E-COMBAT-0001",
                              expected_status="draft",
                              expected_document_sha256=None,
                              as_of=AS_OF,
                              write=True,
                              mutation=mutation,
                          )
                  self.assertEqual(request_path.read_bytes(), original)
                  self.assertEqual(Corpus.load(self.root).validate(AS_OF).errors, ())

                  lifecycle.apply_candidate(
                      root=self.root,
                      request_id="RTREQ-E2E-COMBAT-0001",
                      expected_status="draft",
                      expected_document_sha256=None,
                      as_of=AS_OF,
                      write=True,
                      mutation=mutation,
                  )
                  self.assertEqual(json.loads(request_path.read_text())["status"], "ready-for-owner-triage")
                  self.assertEqual(Corpus.load(self.root).validate(AS_OF).errors, ())

              def test_repository_vocations_request_remains_unexecuted(self) -> None:
                  corpus = Corpus.load(self.repo)
                  request = next(item.value for item in corpus.request_documents if item.value["request_id"] == "RTREQ-FEATURE-VOCATIONS-0001")
                  self.assertEqual(request["status"], "ready-for-owner-triage")
                  self.assertIsNone(request["coordination"]["owner_task"])
                  self.assertIsNone(request["coordination"]["owner_pr"])
                  self.assertFalse(request["result"]["available"])
                  self.assertEqual(request["result"]["result_refs"], [])


          if __name__ == "__main__":
              import unittest
              unittest.main()
          PY

      - name: Add operator documentation
        shell: bash
        run: |
          set -euo pipefail
          cat > docs/agents/real-tibia/evidence/OWNER_REQUEST_LIFECYCLE.md <<'MD'
          # Real Tibia owner-request lifecycle

          `tools/agents/real_tibia_owner_request.py` is the single dry-run-first mutation surface for schema-version-1 owner requests. It coordinates evidence; it never executes owner work.

          ## Safety contract

          Every command requires `--expected-status`. `--expected-document-sha256` adds a caller-supplied content fence. A write re-reads the request and rejects any status or content change that occurred after the initial load. Candidate state is validated against the complete corpus before writing. The request and deterministic indexes are written with backups and restored if validation or generation fails.

          Omit `--write` for the default dry run. Dry run prints the complete candidate request and its canonical SHA-256 without changing the repository.

          ## Roles and transitions

          The canonical transition graph remains in `real_tibia_evidence_lib.py`.

          - Collector/reviewer states may prepare, triage, plan, block, reject or supersede only where the graph permits.
          - `accepted-by-owner`, `active` and `result-available` require an owner actor, a positive exact owner PR and a stable owner-evidence reference.
          - Owner task/PR metadata must exactly match the actor recorded in history; aliases or substituted PRs are rejected.
          - `result-available` is created only by `record-result`.
          - `consumed` is created only by `consume-result`.

          ## Stable retained-result references

          Accepted compact references are:

          ```text
          github-pr:<owner>/<repo>#<pr>
          github-commit:<owner>/<repo>@<40-hex-sha>
          github-actions-run:<owner>/<repo>#<run-id>
          github-actions-job:<owner>/<repo>#<job-id>
          github-actions-artifact:<owner>/<repo>#<artifact-id>@sha256:<64-hex>
          repo-file:<owner>/<repo>@<40-hex-sha>:<safe-repository-path>
          external-report:sha256:<64-hex>
          ```

          Large or proprietary payloads stay outside Git. Git stores only compact references, hashes, proof boundaries and owner metadata.

          ## Transition example

          ```sh
          python tools/agents/real_tibia_owner_request.py transition \
            --request-id RTREQ-E2E-COMBAT-0001 \
            --expected-status ready-for-owner-triage \
            --as-of 2026-07-25 \
            --at 2026-07-25T16:00:00+02:00 \
            --actor "Universal E2E owner" \
            --actor-role owner \
            --actor-task CAN-OWNER-EXAMPLE \
            --actor-pr 123 \
            --to-status accepted-by-owner \
            --owner-evidence-ref github-pr:blakinio/canary#123 \
            --reason "Owner accepted the bounded request."
          ```

          Review the dry-run JSON, then repeat with `--write` and preferably the printed `--expected-document-sha256`.

          ## Owner result

          `record-result` is valid only from `active`. It requires one or more stable result references, the strongest proof level actually reached, non-empty `proves`, non-empty `does_not_prove`, and optional blockers. A lower-than-requested result remains valid evidence but does not satisfy a higher requested proof level.

          ## Collector consumption

          Before `consume-result`, the Collector adds or updates the exact evidence records that consume the retained result. The command verifies that every selected record:

          1. exists and links the request ID;
          2. does not exceed the owner result proof level;
          3. contains a source type allowed for the request owner route;
          4. matches at least one retained stable result reference;
          5. copies no owner `proves` claim absent from the retained result;
          6. preserves every retained `does_not_prove` boundary.

          Owner-route source types are bounded for E2E, OTBM/OWA, TCR, protocol/client and feature owners. Static source inspection cannot be relabeled as an owner result.

          ## Current vocations request

          `RTREQ-FEATURE-VOCATIONS-0001` remains `ready-for-owner-triage`. RTEC-003 does not accept it, execute it, fabricate a result or alter `RT-VOCATIONS-0005`. Runtime level-gain and promotion application remain `UNKNOWN` until the feature owner produces retained evidence.
          MD

