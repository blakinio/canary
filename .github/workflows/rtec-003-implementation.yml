name: RTEC-003 Implementation Builder

on:
  push:
    branches:
      - feat/rtec-003-owner-request-lifecycle-20260725
    paths:
      - ".github/workflows/rtec-003-implementation.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v6
        with:
          ref: feat/rtec-003-owner-request-lifecycle-20260725
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Harden lifecycle implementation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
