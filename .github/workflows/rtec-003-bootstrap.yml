name: RTEC-003 Builder Bootstrap

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/rtec-003-bootstrap.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.head_ref == 'feat/rtec-003-owner-request-lifecycle-20260725'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/rtec-003-owner-request-lifecycle-20260725
          fetch-depth: 0
      - name: Enable PR and push execution
        shell: bash
        run: |
          set -euo pipefail
          echo "Bootstrapping existing builder workflow"
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/rtec-003-implementation.yml')
          text = path.read_text(encoding='utf-8')
          old = '''  push:
    branches:
      - feat/rtec-003-owner-request-lifecycle-20260725
    paths:
      - ".github/workflows/rtec-003-implementation.yml"
'''
          new = old + '''  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/rtec-003-implementation.yml"
'''
          if text.count(old) != 1:
              raise SystemExit('implementation workflow trigger anchor mismatch')
          path.write_text(text.replace(old, new), encoding='utf-8')
          Path('.github/workflows/rtec-003-bootstrap.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci(agents): enable RTEC-003 builder execution"
          git push origin HEAD:feat/rtec-003-owner-request-lifecycle-20260725
