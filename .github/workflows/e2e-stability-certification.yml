name: Universal E2E Stability Certification

# Contract-only validation: this workflow never executes physical scenarios.
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/e2e-stability-certification.yml"
      - "tools/e2e/stability_certification.py"
      - "tests/e2e/test_stability_certification.py"
      - "docs/e2e/E2E_STABILITY_CERTIFICATION.md"
      - "docs/e2e/E2E_STABILITY_CERTIFICATION.schema.json"
      - "docs/agents/tasks/active/CAN-20260725-e2e-qri-022-stability-certification.md"
      - "docs/agents/MODULE_CATALOG.md"
      - "docs/agents/CHANGELOG.md"
      - "docs/agents/programs/E2E_AUTOMATION_PROGRAM.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Validate stability certification contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TASK_PATH: docs/agents/tasks/active/CAN-20260725-e2e-qri-022-stability-certification.md
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          ref: docs/e2e-qri-022-lifecycle-closure
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile focused tooling and tests
        run: |
          python -m py_compile \
            tools/e2e/stability_certification.py \
            tests/e2e/test_stability_certification.py

      - name: Run focused canonical-module tests
        run: python -m unittest -v tests/e2e/test_stability_certification.py

      - name: Parse strict report schema
        run: python -m json.tool docs/e2e/E2E_STABILITY_CERTIFICATION.schema.json >/dev/null

      - name: Validate checkpoint before handover
        run: python tools/agents/checkpoint.py "$TASK_PATH" --require-checkpoint

      - name: Record checkpoint validation
        run: |
          python - <<'PY'
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path(os.environ["TASK_PATH"])
          text = path.read_text(encoding="utf-8")
          head = os.environ["PR_HEAD_SHA"]
          updated = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")
          text, count = re.subn(r'last_verified_commit: "[0-9a-fA-F]+"', f'last_verified_commit: "{head}"', text, count=1)
          if count != 1:
              raise SystemExit("expected one last_verified_commit")
          text, count = re.subn(r'^updated_at: .+$', f'updated_at: {updated}', text, count=1, flags=re.MULTILINE)
          if count != 1:
              raise SystemExit("expected one checkpoint updated_at")
          text, count = re.subn(r'^head: [0-9a-fA-F]+$', f'head: {head}', text, count=1, flags=re.MULTILINE)
          if count != 1:
              raise SystemExit("expected one checkpoint head")
          old = """  - command: python tools/agents/checkpoint.py docs/agents/tasks/active/CAN-20260725-e2e-qri-022-stability-certification.md --require-checkpoint
    result: NOT_RUN
    evidence: Run immediately after writing this checkpoint."""
          new = """  - command: python tools/agents/checkpoint.py docs/agents/tasks/active/CAN-20260725-e2e-qri-022-stability-certification.md --require-checkpoint
    result: PASS
    evidence: Validated by the exact-head Universal E2E Stability Certification handover job."""
          if text.count(old) != 1:
              raise SystemExit("expected one checkpoint validation placeholder")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Validate finalized checkpoint
        run: python tools/agents/checkpoint.py "$TASK_PATH" --require-checkpoint

      - name: Generate compact resume bundle
        run: python tools/agents/resume.py --task "$TASK_PATH" > resume.txt

      - name: Upload compact resume bundle
        uses: actions/upload-artifact@v4
        with:
          name: qri022-compact-handover
          path: resume.txt
          if-no-files-found: error
          retention-days: 7

      - name: Restore workflows and push checkpoint
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- .github/workflows/e2e-stability-certification.yml
          rm -f .github/workflows/qri022-compact-handover.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(e2e): finalize QRI-022 compact checkpoint"
          git push origin HEAD:docs/e2e-qri-022-lifecycle-closure
