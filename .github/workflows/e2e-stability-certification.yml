name: Universal E2E Stability Certification

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/e2e-stability-certification.yml"
      - "docs/agents/tasks/active/CAN-20260725-e2e-qri-022-stability-certification.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate stability certification contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Run exact compact handover
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          TASK_PATH: docs/agents/tasks/active/CAN-20260725-e2e-qri-022-stability-certification.md
        run: git clone --quiet --depth 1 --branch "$HEAD_REF" "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" repo && cd repo && python tools/agents/checkpoint.py "$TASK_PATH" --require-checkpoint >/dev/null && python tools/agents/resume.py --task "$TASK_PATH"
