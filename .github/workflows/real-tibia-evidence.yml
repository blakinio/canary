name: Real Tibia Evidence Contracts

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "docs/**"
      - "ci/**"
    paths:
      - "docs/agents/real-tibia/evidence/**"
      - "docs/agents/real-tibia/OWNER_REQUEST_LIFECYCLE.md"
      - "docs/agents/templates/REAL_TIBIA_EVIDENCE_RECORD.yaml"
      - "docs/agents/templates/REAL_TIBIA_EVIDENCE_REQUEST.yaml"
      - "tools/agents/real_tibia_evidence.py"
      - "tools/agents/real_tibia_evidence_lib.py"
      - "tools/agents/real_tibia_evidence_test_support.py"
      - "tools/agents/real_tibia_owner_request.py"
      - "tools/agents/test_real_tibia_evidence.py"
      - "tools/agents/test_real_tibia_evidence_lifecycle.py"
      - "tools/agents/test_real_tibia_owner_request.py"
      - ".github/workflows/real-tibia-evidence.yml"
  pull_request:
    paths:
      - "docs/agents/real-tibia/evidence/**"
      - "docs/agents/real-tibia/OWNER_REQUEST_LIFECYCLE.md"
      - "docs/agents/templates/REAL_TIBIA_EVIDENCE_RECORD.yaml"
      - "docs/agents/templates/REAL_TIBIA_EVIDENCE_REQUEST.yaml"
      - "tools/agents/real_tibia_evidence.py"
      - "tools/agents/real_tibia_evidence_lib.py"
      - "tools/agents/real_tibia_evidence_test_support.py"
      - "tools/agents/real_tibia_owner_request.py"
      - "tools/agents/test_real_tibia_evidence.py"
      - "tools/agents/test_real_tibia_evidence_lifecycle.py"
      - "tools/agents/test_real_tibia_owner_request.py"
      - ".github/workflows/real-tibia-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile-relocated-guide:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/rtec-003-owner-request-lifecycle-20260725'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v6
        with:
          ref: feat/rtec-003-owner-request-lifecycle-20260725
          fetch-depth: 0

      - name: Reconcile durable references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('docs/agents/real-tibia/evidence/README.md'): [
                  ('├── OWNER_REQUEST_LIFECYCLE.md\n', ''),
                  ('Read `OWNER_REQUEST_LIFECYCLE.md` before moving a request.', 'Read `../OWNER_REQUEST_LIFECYCLE.md` before moving a request.'),
              ],
              Path('docs/agents/MODULE_CATALOG.md'): [
                  ('docs/agents/real-tibia/evidence/OWNER_REQUEST_LIFECYCLE.md', 'docs/agents/real-tibia/OWNER_REQUEST_LIFECYCLE.md'),
              ],
              Path('docs/agents/tasks/active/CAN-20260725-rtec-003-owner-request-lifecycle.md'): [
                  ('docs/agents/real-tibia/evidence/OWNER_REQUEST_LIFECYCLE.md', 'docs/agents/real-tibia/OWNER_REQUEST_LIFECYCLE.md'),
              ],
          }
          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'{path}: missing expected reference {old!r}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY

          git show HEAD^:.github/workflows/real-tibia-evidence.yml > .github/workflows/real-tibia-evidence.yml
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/real-tibia-evidence.yml')
          text = path.read_text(encoding='utf-8')
          anchor = '      - "docs/agents/real-tibia/evidence/**"\n'
          addition = anchor + '      - "docs/agents/real-tibia/OWNER_REQUEST_LIFECYCLE.md"\n'
          if text.count(anchor) != 2:
              raise SystemExit(f'workflow path anchor count is {text.count(anchor)}, expected 2')
          path.write_text(text.replace(anchor, addition), encoding='utf-8')
          PY

      - name: Validate relocated guide package
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/agents/real-tibia/OWNER_REQUEST_LIFECYCLE.md
          test ! -e docs/agents/real-tibia/evidence/OWNER_REQUEST_LIFECYCLE.md
          python -m py_compile \
            tools/agents/real_tibia_evidence.py \
            tools/agents/real_tibia_evidence_lib.py \
            tools/agents/real_tibia_evidence_test_support.py \
            tools/agents/real_tibia_owner_request.py \
            tools/agents/test_real_tibia_owner_request.py
          python -m unittest discover -v -s tools/agents -p 'test_real_tibia*.py'
          python tools/agents/real_tibia_registry.py validate
          python tools/agents/real_tibia_registry.py generate --check
          python tools/agents/real_tibia_evidence.py validate --as-of 2026-07-25
          python tools/agents/real_tibia_evidence.py generate --check --as-of 2026-07-25
          git diff --exit-code -- docs/agents/real-tibia/evidence/requests/feature/RTREQ-FEATURE-VOCATIONS-0001.yaml

      - name: Commit reference reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No reconciliation changes produced"; exit 1; }
          git commit -m "fix(agents): register relocated RTEC lifecycle guide"
          git push origin HEAD:feat/rtec-003-owner-request-lifecycle-20260725

  validate:
    name: Validate evidence contracts and indexes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Draft 2020-12 schema checker
        run: python -m pip install --disable-pip-version-check jsonschema

      - name: Compile standard-library tooling
        run: |
          python -m py_compile \
            tools/agents/real_tibia_evidence.py \
            tools/agents/real_tibia_evidence_lib.py \
            tools/agents/real_tibia_evidence_test_support.py \
            tools/agents/real_tibia_owner_request.py \
            tools/agents/test_real_tibia_evidence.py \
            tools/agents/test_real_tibia_evidence_lifecycle.py \
            tools/agents/test_real_tibia_owner_request.py

      - name: Run focused positive and negative tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -v -s tools/agents -p 'test_real_tibia*.py' 2>&1 \
            | tee /tmp/real-tibia-focused-tests.log

      - name: Upload focused-test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: real-tibia-focused-test-diagnostics
          path: /tmp/real-tibia-focused-tests.log
          if-no-files-found: error
          retention-days: 14

      - name: Validate canonical Real Tibia registry
        run: |
          python tools/agents/real_tibia_registry.py validate
          python tools/agents/real_tibia_registry.py generate --check

      - name: Validate evidence corpus
        run: python tools/agents/real_tibia_evidence.py validate --as-of 2026-07-25

      - name: Verify deterministic generated indexes
        run: python tools/agents/real_tibia_evidence.py generate --check --as-of 2026-07-25

      - name: Exercise factual index output
        run: python tools/agents/real_tibia_evidence.py show-index --as-of 2026-07-25 > /tmp/real-tibia-evidence-index.json

      - name: Verify production request stays unclaimed
        run: |
          python tools/agents/real_tibia_owner_request.py transition \
            --request-id RTREQ-FEATURE-VOCATIONS-0001 \
            --expected-status ready-for-owner-triage \
            --as-of 2026-07-25 \
            --at 2026-07-25T12:00:00+02:00 \
            --actor ci-dry-run \
            --actor-role reviewer \
            --actor-task CAN-RTEC-CI-DRY-RUN \
            --reason "CI dry-run verifies validation without owner-state mutation." \
            --to-status rejected > /tmp/real-tibia-owner-request-dry-run.json
          test "$(python -c 'import json; print(json.load(open("docs/agents/real-tibia/evidence/requests/feature/RTREQ-FEATURE-VOCATIONS-0001.yaml"))["status"])')" = "ready-for-owner-triage"
