name: Real Tibia Evidence Contracts

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "docs/**"
      - "ci/**"
    paths:
      - "docs/agents/real-tibia/evidence/**"
      - "docs/agents/templates/REAL_TIBIA_EVIDENCE_RECORD.yaml"
      - "docs/agents/templates/REAL_TIBIA_EVIDENCE_REQUEST.yaml"
      - "tools/agents/real_tibia_evidence.py"
      - "tools/agents/real_tibia_evidence_lib.py"
      - "tools/agents/real_tibia_evidence_test_support.py"
      - "tools/agents/real_tibia_owner_request.py"
      - "tools/agents/rtec_003_hardening.py"
      - "tools/agents/test_real_tibia_evidence.py"
      - "tools/agents/test_real_tibia_evidence_lifecycle.py"
      - "tools/agents/test_real_tibia_owner_request.py"
      - ".github/workflows/real-tibia-evidence.yml"
  pull_request:
    paths:
      - "docs/agents/real-tibia/evidence/**"
      - "docs/agents/templates/REAL_TIBIA_EVIDENCE_RECORD.yaml"
      - "docs/agents/templates/REAL_TIBIA_EVIDENCE_REQUEST.yaml"
      - "tools/agents/real_tibia_evidence.py"
      - "tools/agents/real_tibia_evidence_lib.py"
      - "tools/agents/real_tibia_evidence_test_support.py"
      - "tools/agents/real_tibia_owner_request.py"
      - "tools/agents/rtec_003_hardening.py"
      - "tools/agents/test_real_tibia_evidence.py"
      - "tools/agents/test_real_tibia_evidence_lifecycle.py"
      - "tools/agents/test_real_tibia_owner_request.py"
      - ".github/workflows/real-tibia-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rtec003-hardening:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/rtec-003-owner-request-lifecycle-20260725'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v6
        with:
          ref: feat/rtec-003-owner-request-lifecycle-20260725
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply review hardening
        run: |
          python tools/agents/rtec_003_hardening.py
          git show HEAD^:.github/workflows/real-tibia-evidence.yml > .github/workflows/real-tibia-evidence.yml

      - name: Validate hardened package
        run: |
          python -m py_compile \
            tools/agents/real_tibia_evidence.py \
            tools/agents/real_tibia_evidence_lib.py \
            tools/agents/real_tibia_evidence_test_support.py \
            tools/agents/real_tibia_owner_request.py \
            tools/agents/test_real_tibia_owner_request.py
          python -m unittest -v tools/agents/test_real_tibia_owner_request.py
          python -m unittest discover -v -s tools/agents -p 'test_real_tibia*.py'
          python tools/agents/real_tibia_registry.py validate
          python tools/agents/real_tibia_registry.py generate --check
          python tools/agents/real_tibia_evidence.py validate --as-of 2026-07-25
          python tools/agents/real_tibia_evidence.py generate --check --as-of 2026-07-25
          git diff --exit-code -- docs/agents/real-tibia/evidence/requests/feature/RTREQ-FEATURE-VOCATIONS-0001.yaml

      - name: Commit validated hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No hardening changes produced"; exit 1; }
          git commit -m "fix(agents): harden RTEC-003 owner result consumption"
          git push origin HEAD:feat/rtec-003-owner-request-lifecycle-20260725

  validate:
    name: Validate evidence contracts and indexes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Draft 2020-12 schema checker
        run: python -m pip install --disable-pip-version-check jsonschema

      - name: Compile standard-library tooling
        run: |
          python -m py_compile \
            tools/agents/real_tibia_evidence.py \
            tools/agents/real_tibia_evidence_lib.py \
            tools/agents/real_tibia_evidence_test_support.py \
            tools/agents/real_tibia_owner_request.py \
            tools/agents/test_real_tibia_evidence.py \
            tools/agents/test_real_tibia_evidence_lifecycle.py \
            tools/agents/test_real_tibia_owner_request.py

      - name: Run focused positive and negative tests
        run: python -m unittest discover -v -s tools/agents -p 'test_real_tibia*.py'

      - name: Validate canonical Real Tibia registry
        run: |
          python tools/agents/real_tibia_registry.py validate
          python tools/agents/real_tibia_registry.py generate --check

      - name: Validate evidence corpus
        run: python tools/agents/real_tibia_evidence.py validate --as-of 2026-07-25

      - name: Verify deterministic generated indexes
        run: python tools/agents/real_tibia_evidence.py generate --check --as-of 2026-07-25

      - name: Exercise factual index output
        run: python tools/agents/real_tibia_evidence.py show-index --as-of 2026-07-25 > /tmp/real-tibia-evidence-index.json

      - name: Verify production request stays unclaimed
        run: |
          python tools/agents/real_tibia_owner_request.py transition \
            --request-id RTREQ-FEATURE-VOCATIONS-0001 \
            --expected-status ready-for-owner-triage \
            --as-of 2026-07-25 \
            --at 2026-07-25T12:00:00+02:00 \
            --actor ci-dry-run \
            --actor-role reviewer \
            --actor-task CAN-RTEC-CI-DRY-RUN \
            --reason "CI dry-run verifies validation without owner-state mutation." \
            --to-status rejected > /tmp/real-tibia-owner-request-dry-run.json
          test "$(python -c 'import json; print(json.load(open("docs/agents/real-tibia/evidence/requests/feature/RTREQ-FEATURE-VOCATIONS-0001.yaml"))["status"])')" = "ready-for-owner-triage"
