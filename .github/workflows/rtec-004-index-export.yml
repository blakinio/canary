name: RTEC-004 Index Integration

on:
  push:
    branches:
      - feat/rtec-004-weapon-proficiency-20260725
    paths:
      - ".github/workflows/rtec-004-index-export.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          ref: feat/rtec-004-weapon-proficiency-20260725
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate deterministic evidence index
        run: python tools/agents/real_tibia_evidence.py generate --as-of 2026-07-25
      - name: Validate generated corpus
        run: |
          python tools/agents/real_tibia_evidence.py validate --as-of 2026-07-25
          python tools/agents/real_tibia_evidence.py generate --check --as-of 2026-07-25
      - name: Commit index and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rtec-004-index-export.yml
          git add docs/agents/real-tibia/evidence/generated/EVIDENCE_INDEXES.json
          git commit -m "chore(agents): integrate weapon proficiency evidence index"
          git push origin HEAD:feat/rtec-004-weapon-proficiency-20260725
