---
name: TCR-007 Lifecycle Closeout

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/tcr007-lifecycle-closeout.yml"
      - ".tcr007-closeout-diagnostic.json"
      - "docs/agents/tasks/archive/CAN-20260724-tcr-007-proficiency-reference-correlation.md"
      - "docs/agents/tasks/active/CAN-20260724-tcr-007-proficiency-reference-correlation.md"
      - "docs/agents/programs/OTBM_TIBIA_CLIENT_REFERENCE_PROGRAM.md"
      - "docs/agents/MODULE_CATALOG.md"

permissions:
  contents: write

jobs:
  closeout:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'docs/tcr-007-lifecycle-closeout'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Capture exact anchor counts
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          programme = Path('docs/agents/programs/OTBM_TIBIA_CLIENT_REFERENCE_PROGRAM.md').read_text(encoding='utf-8')
          catalog = Path('docs/agents/MODULE_CATALOG.md').read_text(encoding='utf-8')
          anchors = {
              'updated': 'updated: 2026-07-24T16:58:27Z',
              'last_verified': 'last_verified_commit: "78b3435510c7e09d10a87ca2338bef59a24475bb"',
              'queue_tcr007': '| TCR-007 | Proficiency Reference Correlation | planned | proficiency + appearances + Canary item/runtime evidence | TCR-004 | medium | Add `canary-tibia-proficiency-reference-correlation-v1`; keep OTBM/item evidence separate from runtime/persistence/protocol proof. |',
              'stable_intro': 'TCR-001, TCR-002, TCR-003, TCR-004, TCR-005 and TCR-006 stabilize these reference, resolver and correlation contracts:',
              'contracts_tail': 'canary-tibia-content-reference-correlation-v1\n```',
              'planned_list': 'The following remain planned and **not stable/merged**: TCR-007 proficiency correlation, optional TCR-008 minimap reference, `canary-tibia-client-reference-drift-v1`, gateway integration and adoption routing.',
              'package_tcr007': '## TCR-007 — Proficiency Reference Correlation\n\nPlanned public format:\n\n```text\ncanary-tibia-proficiency-reference-correlation-v1\n```',
              'last_completed': '# Last completed task\n\n- Task: `docs/agents/tasks/archive/CAN-20260724-tcr-006-content-reference-correlation.md`\n- PR: `#880` — merged.\n- Merge commit: `78b3435510c7e09d10a87ca2338bef59a24475bb`.\n- Scope: TCR-006 exact reviewed content-reference resolver and read-only StaticData-to-existing-owner correlation only; no runtime/gameplay parity, source/datapack/map mutation or automatic repair.',
              'next_action': '# Exact next action after TCR-006\n\nTCR-006 is merged. After this lifecycle closure lands, perform a fresh ownership/PR/reuse/identifier-resolution preflight and start **only TCR-007 — Proficiency Reference Correlation** if it remains the first unowned, unblocked, dependency-satisfied queue item.\n\nDo not start TCR-008 or another TCR package in the TCR-007 task or PR.',
              'content_paragraph': 'The content-reference resolver and correlation contracts are `stable/merged` as of PR #880 / merge `78b3435510c7e09d10a87ca2338bef59a24475bb`. They consume exact manifest-bound StaticData evidence and explicit reviewed mappings to existing creature/spawn, boss, quest/storage and achievement owners while preserving source-family vocabulary and unresolved joins. They emit review evidence only and do not prove runtime behavior, gameplay parity or authorize mutation.\n',
              'owa': 'OWA-003 may later consume `canary-tibia-client-reference-manifest-v1`, `canary-tibia-staticdata-index-v1`, `canary-tibia-staticmapdata-index-v1`, `canary-tibia-proficiency-index-v1`, `canary-otbm-house-id-resolver-v1`, `canary-otbm-house-reference-parity-v1`, `canary-tibia-content-reference-resolver-v1` and `canary-tibia-content-reference-correlation-v1` only within their exact stable provenance/reference boundaries where that dependency is required. It must not infer map authority, `staticmapdata.object_id` equivalence, cross-namespace proficiency-ID equivalence, gameplay/runtime parity or any still-planned TCR proficiency correlation, minimap, drift, gateway or routing output before the owning bounded package merges.',
              'handoff': 'treat `canary-tibia-client-reference-manifest-v1`, `canary-tibia-staticdata-index-v1`, `canary-tibia-staticmapdata-index-v1`, `canary-tibia-proficiency-index-v1`, `canary-otbm-house-id-resolver-v1`, `canary-otbm-house-reference-parity-v1`, `canary-tibia-content-reference-resolver-v1` and `canary-tibia-content-reference-correlation-v1` as stable/merged only within their exact provenance/reference boundaries; do not upgrade planned proficiency correlation, minimap, drift, gateway or routing contracts to stable without their own merged packages.',
          }
          old_row = '| Tibia proficiency reference correlation | active TCR-007 (#898) | Deterministic provenance-pinned `canary-tibia-proficiency-reference-resolver-v1` and read-only `canary-tibia-proficiency-reference-correlation-v1` across exact TCR-004 definitions, canonical appearance proficiency/object bindings and compact Canary loader/runtime evidence | `tools/ai-agent/tibia_proficiency_reference_*.py`, focused tests, `docs/ai-agent/TIBIA_PROFICIENCY_REFERENCE_CORRELATION.md`, resolver/correlation schemas, dedicated workflow | Reuse the canonical proficiency and appearance indexes plus loader-backed item binding evidence. Keep definition, appearance, item, runtime, persistence, protocol/client, automated behavior and Physical E2E dimensions separate; never infer numeric equivalence without reviewed resolver evidence, mutate sources or claim gameplay parity. |'
          result = {name: programme.count(value) for name, value in anchors.items()}
          result['catalog_row'] = catalog.count(old_row)
          Path('.tcr007-closeout-diagnostic.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .tcr007-closeout-diagnostic.json
          if ! git diff --cached --quiet; then
            git commit -m 'ci(tcr): record lifecycle anchor diagnostics'
            git push origin HEAD:docs/tcr-007-lifecycle-closeout
          fi
          exit 1
