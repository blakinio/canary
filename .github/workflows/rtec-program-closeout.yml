name: RTEC-001 Programme Closeout

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/rtec-program-closeout.yml"

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout closeout branch
        uses: actions/checkout@v6
        with:
          ref: docs/rtec-001-program-closeout
          fetch-depth: 0
          persist-credentials: true

      - name: Reconcile programme state
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/agents/programs/REAL_TIBIA_EVIDENCE_COLLECTION_PROGRAM.md")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "updated: 2026-07-24T22:50:00+02:00": "updated: 2026-07-24T23:56:17+02:00",
              'last_verified_commit: "4420e7cfa326ea8ae7b31e0eb5c3f4cbd43167c9"': 'last_verified_commit: "eaed92c5f541cc4097a85bac5b39620d67dcf206"',
              "RTEC-001 implements validators and deterministic generation but does not create empty dossiers or placeholder records for all modules. Broad population remains blocked until RTEC-001 merges and the single-module RTEC-002 pilot proves the complete collection/review flow.": "RTEC-001 implements validators and deterministic generation but does not create empty dossiers or placeholder records for all modules. Broad population remains blocked until the single-module RTEC-002 pilot proves the complete collection/review flow.",
              "| RTEC-001 | Evidence/request schemas, validator, deterministic indexes and tests | active — draft PR #897 | RTEC-000 | medium | Complete current-head CI/review/final gate and merge before any module worker starts. |": "| RTEC-001 | Evidence/request schemas, validator, deterministic indexes and tests | merged | RTEC-000 | medium | Contracts delivered by PR #897; lifecycle archived by PR #908. |",
              "| RTEC-002 | Pilot dossier on one bounded low-coupling module | blocked | RTEC-001 | medium | After RTEC-001 merges, select exactly one module after fresh ownership/source preflight and prove the end-to-end collection/review flow. |": "| RTEC-002 | Pilot dossier on one bounded low-coupling module | planned | RTEC-001 | medium | Run fresh main/open-PR/active-task/source preflight, select exactly one canonical low-coupling module and prove the end-to-end collection/review flow. |",
              "Start from this programme, the Collector architecture, current registry module record and the first active bounded task. Re-fetch live PR/task/source state. Do not restart the full 62-module audit from chat history and do not create parallel execution infrastructure.": "Start RTEC-002 only through one new bounded active task after fresh main/open-PR/active-task/source and canonical-module preflight. Select exactly one low-coupling module, reuse the merged schema-version-1 contracts and do not start parallel Collector workers or broad dossier population until the pilot review flow succeeds.",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one occurrence, found {count}: {old}")
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate focused diff
        run: |
          git diff --check
          git diff --exit-code -- . ':(exclude)docs/agents/programs/REAL_TIBIA_EVIDENCE_COLLECTION_PROGRAM.md' ':(exclude).github/workflows/rtec-program-closeout.yml'

      - name: Commit programme closeout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/agents/programs/REAL_TIBIA_EVIDENCE_COLLECTION_PROGRAM.md
          git commit -m "docs(agents): close RTEC-001 programme state"
          git push origin HEAD:docs/rtec-001-program-closeout
