name: Game Catalog

# Exact-head executable proof for the offline exporter.
on:
  pull_request:
    paths:
      - 'schemas/game-catalog/**'
      - 'src/game/catalog/**'
      - 'src/main.cpp'
      - 'src/canary_server.hpp'
      - 'src/canary_server.cpp'
      - 'src/game/CMakeLists.txt'
      - 'tests/unit/game/catalog/**'
      - 'tests/unit/game/CMakeLists.txt'
      - 'tools/game-catalog/**'
      - 'tests/game_catalog/**'
      - 'data-*/catalog/**'
      - 'docs/agents/tasks/active/CAN-20260728-game-catalog-exporter.md'
      - 'docs/agents/tasks/active/CAN-20260729-game-catalog-schema-1-1.md'
      - 'docs/agents/tasks/active/CAN-20260729-game-catalog-loot-threshold-schema.md'
      - '.github/workflows/game-catalog.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-catalog-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Contract and fixture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile validator and metadata tests
        run: python -m py_compile tools/game-catalog/validate_snapshot.py tests/game_catalog/test_*.py
      - name: Run focused tests
        run: python -m unittest discover -s tests/game_catalog -p 'test_*.py' -v
      - name: Validate shared fixture
        run: |
          python tools/game-catalog/validate_snapshot.py \
            tests/game_catalog/fixtures/minimal-snapshot.json \
            --schema schemas/game-catalog/v1/game-catalog-snapshot.schema.json \
            --expected-sha256 ec0658bb11877240f2e22575180513dbff426b3df1fc2af8f20343ed0d424055
          python tools/game-catalog/validate_snapshot.py \
            tests/game_catalog/fixtures/v1.1/minimal-snapshot.json \
            --schema schemas/game-catalog/v1.1/game-catalog-snapshot.schema.json \
            --expected-sha256 747467af3716873e2738973bc2d2c5cd0b0230bc69ae68e53f763e4d9f995dee
          python tools/game-catalog/validate_snapshot.py \
            tests/game_catalog/fixtures/v1.2/minimal-snapshot.json \
            --schema schemas/game-catalog/v1.2/game-catalog-snapshot.schema.json \
            --expected-sha256 42b832954f9aa68cf7e2465351f92266771b8132d9634757391d010eaec84855

  build-exporter:
    name: Build export binary
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/reusable-build-linux.yml
    with:
      buildtypes: '["linux-release"]'
      run_canary_smoke: false
      run_global_smoke: false
      checkout_ref: ${{ github.event.pull_request.head.sha || github.sha }}
    secrets: inherit

  export-smoke:
    name: Export-only runtime smoke
    needs: [contract, build-exporter]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Download export binary
        uses: actions/download-artifact@v7
        with:
          name: canary-linux-release
          path: build/linux-release/bin

      - name: Install smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y strace

      - name: Prepare isolated export inputs
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build/linux-release/bin/canary
          rm -rf artifacts/game-catalog-smoke
          mkdir -p \
            artifacts/game-catalog-smoke/manifests \
            artifacts/game-catalog-smoke/runtime-datapack

          cp -a data-canary/lib artifacts/game-catalog-smoke/runtime-datapack/lib
          cp -a tests/game_catalog/runtime-datapack/monster artifacts/game-catalog-smoke/runtime-datapack/monster
          cp -a tests/game_catalog/runtime-datapack/scripts artifacts/game-catalog-smoke/runtime-datapack/scripts
          mkdir -p artifacts/game-catalog-smoke/runtime-datapack/monster/dragons
          cp \
            data-otservbr-global/monster/dragons/dragon.lua \
            artifacts/game-catalog-smoke/runtime-datapack/monster/dragons/dragon.lua

          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          config = Path('config.lua.dist').read_text(encoding='utf-8')
          replacements = {
              'useAnyDatapackFolder': 'true',
              'dataPackDirectory': '"artifacts/game-catalog-smoke/runtime-datapack"',
              'mapDownloadUrl': '""',
              'toggleDownloadMap': 'false',
              'toggleMapCustom': 'false',
              'startupDatabaseOptimization': 'false',
              'mysqlDatabaseBackup': 'false',
              'toggleSaveInterval': 'false',
              'ip': '"127.0.0.1"',
              'mysqlHost': '"127.0.0.1"',
              'mysqlUser': '"catalog-ci"',
              'mysqlPass': '"catalog-ci"',
              'mysqlDatabase': '"catalog_ci"',
              'mysqlPort': '1',
              'mysqlSock': '""',
              'metricsEnablePrometheus': 'false',
              'metricsEnableOstream': 'false',
              'luaStartupLoadTelemetry': 'true',
          }
          for key, value in replacements.items():
              pattern = re.compile(rf'^{re.escape(key)}\s*=.*$', re.MULTILINE)
              if len(pattern.findall(config)) != 1:
                  raise RuntimeError(f'Expected exactly one config key: {key}')
              config = pattern.sub(f'{key} = {value}', config, count=1)
          Path('config.lua').write_text(config, encoding='utf-8', newline='\n')

          manifest_dir = Path('artifacts/game-catalog-smoke/manifests')
          profile = {
              'contract': 'oteryn.game-catalog',
              'schema_version': '1.2.0',
              'protocol_profile': 'oteryn-current',
              'runtime_release': '0.0.1-ci',
              'content_target_release': '0.0.1-ci',
              'verified_content_through_release': None,
              'contains_content_through_release': None,
              'loot_roll_maximum': 100000,
              'datapack_commit_sha': None,
              'producer_build_id': 'github-actions-game-catalog-smoke',
          }
          releases = [{
              'key': '0.0.1-ci',
              'display_label': 'CI smoke 0.0.1',
              'major': 0,
              'minor': 0,
              'patch': 1,
              'build': None,
              'release_order': 1,
              'protocol_family': 'oteryn-current',
              'released_at': None,
          }]
          (manifest_dir / 'profile.json').write_text(json.dumps(profile, indent=2) + '\n', encoding='utf-8')
          (manifest_dir / 'releases.json').write_text(json.dumps(releases, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Run export-only binary twice without database or network endpoints
        shell: bash
        env:
          CATALOG_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          run_export() {
            local output="$1"
            local generated_at="$2"
            local trace="$3"
            local log="$4"

            timeout 900s strace -f -qq \
              -e trace=connect,bind,listen,accept,accept4 \
              -o "${trace}" \
              build/linux-release/bin/canary \
                --export-game-catalog-only \
                --game-catalog-output="${output}" \
                --game-catalog-manifest-directory=artifacts/game-catalog-smoke/manifests \
                --game-catalog-generated-at="${generated_at}" \
                --game-catalog-canary-commit="${CATALOG_HEAD_SHA}" \
              >"${log}" 2>&1
          }

          run_export \
            artifacts/game-catalog-smoke/game-catalog-baseline.json \
            2026-07-27T00:00:00Z \
            artifacts/game-catalog-smoke/network-baseline.trace \
            artifacts/game-catalog-smoke/export-baseline.log

          run_export \
            artifacts/game-catalog-smoke/game-catalog.json \
            2026-07-28T00:00:00Z \
            artifacts/game-catalog-smoke/network.trace \
            artifacts/game-catalog-smoke/export.log

          for log in artifacts/game-catalog-smoke/export-baseline.log artifacts/game-catalog-smoke/export.log; do
            cat "${log}"
            grep -q 'Game Catalog export completed:' "${log}"
            if grep -Eq 'Database not initialized|Saving server|Shutting down thread pool|Failed to save' "${log}"; then
              echo 'Export-only mode entered a database-backed save/shutdown path.' >&2
              exit 1
            fi
          done

          for trace in artifacts/game-catalog-smoke/network-baseline.trace artifacts/game-catalog-smoke/network.trace; do
            if [[ -s "${trace}" ]]; then
              cat "${trace}" >&2
              echo 'Export-only mode attempted a database or network endpoint syscall.' >&2
              exit 1
            fi
          done

      - name: Validate runtime snapshots and sidecars
        shell: bash
        env:
          CATALOG_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          for output in \
            artifacts/game-catalog-smoke/game-catalog-baseline.json \
            artifacts/game-catalog-smoke/game-catalog.json; do
            sidecar="${output}.sha256"
            python3 tools/game-catalog/validate_snapshot.py \
              "${output}" \
              --schema schemas/game-catalog/v1.2/game-catalog-snapshot.schema.json
            (cd "$(dirname "${output}")" && sha256sum --check "$(basename "${sidecar}")")
            grep -Eq "^[0-9a-f]{64}  $(basename "${output}")$" "${sidecar}"
          done

          python3 - <<'PY'
          import copy
          import json
          import os
          from pathlib import Path

          directory = Path('artifacts/game-catalog-smoke')
          baseline = json.loads((directory / 'game-catalog-baseline.json').read_text(encoding='utf-8'))
          candidate = json.loads((directory / 'game-catalog.json').read_text(encoding='utf-8'))

          for document, generated_at in [
              (baseline, '2026-07-27T00:00:00Z'),
              (candidate, '2026-07-28T00:00:00Z'),
          ]:
              snapshot = document['snapshot']
              assert snapshot['canary_commit_sha'] == os.environ['CATALOG_HEAD_SHA']
              assert snapshot['generated_at'] == generated_at
              assert snapshot['entity_count'] == len(document['entities']) > 0
              assert snapshot['relation_count'] == len(document['relations']) > 0
              assert snapshot['verified_content_through_release'] is None
              assert {'item', 'creature'} <= {entity['type'] for entity in document['entities']}

          normalized_baseline = copy.deepcopy(baseline)
          normalized_candidate = copy.deepcopy(candidate)
          normalized_baseline['snapshot']['generated_at'] = 'normalized'
          normalized_candidate['snapshot']['generated_at'] = 'normalized'
          assert normalized_baseline == normalized_candidate
          assert (directory / 'game-catalog-baseline.json').read_bytes() != (directory / 'game-catalog.json').read_bytes()
          PY

      - name: Validate reviewed default metadata seed
        shell: bash
        env:
          CATALOG_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          run_export() {
            local output="$1"
            local generated_at="$2"
            local trace="$3"
            local log="$4"

            timeout 900s strace -f -qq \
              -e trace=connect,bind,listen,accept,accept4 \
              -o "${trace}" \
              build/linux-release/bin/canary \
                --export-game-catalog-only \
                --game-catalog-output="${output}" \
                --game-catalog-manifest-directory=data-otservbr-global/catalog \
                --game-catalog-generated-at="${generated_at}" \
                --game-catalog-canary-commit="${CATALOG_HEAD_SHA}" \
              >"${log}" 2>&1
          }

          run_export \
            artifacts/game-catalog-smoke/reviewed-baseline.json \
            2026-07-28T00:00:00Z \
            artifacts/game-catalog-smoke/reviewed-baseline.trace \
            artifacts/game-catalog-smoke/reviewed-baseline.log

          run_export \
            artifacts/game-catalog-smoke/reviewed-candidate.json \
            2026-07-29T00:00:00Z \
            artifacts/game-catalog-smoke/reviewed-candidate.trace \
            artifacts/game-catalog-smoke/reviewed-candidate.log

          for output in \
            artifacts/game-catalog-smoke/reviewed-baseline.json \
            artifacts/game-catalog-smoke/reviewed-candidate.json; do
            sidecar="${output}.sha256"
            python3 tools/game-catalog/validate_snapshot.py \
              "${output}" \
              --schema schemas/game-catalog/v1.2/game-catalog-snapshot.schema.json
            (cd "$(dirname "${output}")" && sha256sum --check "$(basename "${sidecar}")")
            grep -Eq "^[0-9a-f]{64}  $(basename "${output}")$" "${sidecar}"
          done

          for trace in \
            artifacts/game-catalog-smoke/reviewed-baseline.trace \
            artifacts/game-catalog-smoke/reviewed-candidate.trace; do
            if [[ -s "${trace}" ]]; then
              cat "${trace}" >&2
              echo 'Reviewed metadata export attempted a database or network endpoint syscall.' >&2
              exit 1
            fi
          done

          python3 - <<'PY'
          import copy
          import json
          from pathlib import Path

          directory = Path('artifacts/game-catalog-smoke')
          baseline = json.loads((directory / 'reviewed-baseline.json').read_text(encoding='utf-8'))
          candidate = json.loads((directory / 'reviewed-candidate.json').read_text(encoding='utf-8'))

          normalized_baseline = copy.deepcopy(baseline)
          normalized_candidate = copy.deepcopy(candidate)
          normalized_baseline['snapshot']['generated_at'] = 'normalized'
          normalized_candidate['snapshot']['generated_at'] = 'normalized'
          assert normalized_baseline == normalized_candidate

          snapshot = candidate['snapshot']
          assert snapshot['runtime_release'] == '15.25'
          assert snapshot['content_target_release'] == '15.25'
          assert snapshot['verified_content_through_release'] is None
          assert snapshot['contains_content_through_release'] is None

          entities = {entity['canonical_key']: entity for entity in candidate['entities']}
          item = entities['item:dragon-shield']
          creature = entities['creature:dragon']
          assert item['introduced_in'] is None
          assert item['removed_in'] is None
          assert item['completeness'] == 'unverified'
          assert item['availability'] == 'obtainable'
          assert item['data']['server_id'] == 3416
          assert creature['introduced_in'] is None
          assert creature['removed_in'] is None
          assert creature['completeness'] == 'unverified'
          assert creature['availability'] == 'encounterable'

          relations = {relation['canonical_key']: relation for relation in candidate['relations']}
          loot = relations['loot:dragon:dragon-shield']
          assert loot['source'] == 'creature:dragon'
          assert loot['target'] == 'item:dragon-shield'
          assert loot['introduced_in'] is None
          assert loot['removed_in'] is None
          assert loot['completeness'] == 'unverified'
          assert loot['data']['chance_model'] == 'canary_dynamic_threshold_v1'
          assert loot['data']['chance_threshold'] == 110
          assert loot['data']['roll_maximum'] == 100000
          PY

      - name: Prove complete default-datapack schema 1.2 export
        shell: bash
        env:
          CATALOG_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path('config.lua')
          config = path.read_text(encoding='utf-8')
          pattern = re.compile(r'^dataPackDirectory\s*=.*$', re.MULTILINE)
          if len(pattern.findall(config)) != 1:
              raise RuntimeError('Expected exactly one dataPackDirectory setting')
          config = pattern.sub('dataPackDirectory = "data-otservbr-global"', config, count=1)
          path.write_text(config, encoding='utf-8', newline='\n')
          PY

          output=artifacts/game-catalog-smoke/default-datapack.json
          trace=artifacts/game-catalog-smoke/default-datapack.trace
          log=artifacts/game-catalog-smoke/default-datapack.log
          set +e
          timeout 900s strace -f -qq \
            -e trace=connect,bind,listen,accept,accept4 \
            -o "${trace}" \
            build/linux-release/bin/canary \
              --export-game-catalog-only \
              --game-catalog-output="${output}" \
              --game-catalog-manifest-directory=data-otservbr-global/catalog \
              --game-catalog-generated-at=2026-07-29T00:00:00Z \
              --game-catalog-canary-commit="${CATALOG_HEAD_SHA}" \
            >"${log}" 2>&1
          status=$?
          set -e

          cat "${log}"
          if [[ ${status} -ne 0 ]]; then
            echo "Default-datapack export exited with status ${status}." >&2
            exit "${status}"
          fi
          grep -q 'Game Catalog export completed:' "${log}"
          if grep -q 'dangling endpoint' "${log}"; then
            echo 'Default-datapack export still contains dangling loot endpoints.' >&2
            exit 1
          fi
          if grep -q 'invalid loot chance model' "${log}"; then
            echo 'Default-datapack export contains an invalid schema 1.2 loot chance model.' >&2
            exit 1
          fi
          python3 tools/game-catalog/validate_snapshot.py \
            "${output}" \
            --schema schemas/game-catalog/v1.2/game-catalog-snapshot.schema.json
          (cd "$(dirname "${output}")" && sha256sum --check "$(basename "${output}.sha256")")
          grep -Eq "^[0-9a-f]{64}  $(basename "${output}")$" "${output}.sha256"
          python3 - <<'PY'
          import json
          from pathlib import Path

          document = json.loads(Path('artifacts/game-catalog-smoke/default-datapack.json').read_text(encoding='utf-8'))
          assert document['schema_version'] == '1.2.0'
          assert document['snapshot']['entity_count'] == len(document['entities']) > 0
          assert document['snapshot']['relation_count'] == len(document['relations']) > 0
          assert all(relation['source'] and relation['target'] for relation in document['relations'])
          loot_data = [relation['data'] for relation in document['relations']]
          assert loot_data
          assert all(data['chance_model'] == 'canary_dynamic_threshold_v1' for data in loot_data)
          assert all(data['roll_maximum'] == 100000 for data in loot_data)
          assert all('chance_numerator' not in data and 'chance_denominator' not in data for data in loot_data)
          assert sum(data['chance_threshold'] > data['roll_maximum'] for data in loot_data) == 92
          PY
          if [[ -s "${trace}" ]]; then
            cat "${trace}" >&2
            echo 'Default-datapack diagnostic attempted a database or network endpoint syscall.' >&2
            exit 1
          fi

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: game-catalog-export-smoke
          path: artifacts/game-catalog-smoke/
          if-no-files-found: error
