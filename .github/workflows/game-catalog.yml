name: Game Catalog

on:
  pull_request:
    paths:
      - '.github/workflows/game-catalog.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: game-catalog-diagnosis-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  runtime-backtrace:
    name: Export runtime backtrace
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Download last successful export binary
        uses: actions/download-artifact@v7
        with:
          name: canary-linux-release
          path: build/linux-release/bin
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 30390923631

      - name: Install debugger
        run: |
          sudo apt-get update
          sudo apt-get install -y gdb

      - name: Prepare isolated export inputs
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build/linux-release/bin/canary
          rm -rf artifacts/game-catalog-diagnosis
          mkdir -p artifacts/game-catalog-diagnosis/manifests

          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          config = Path('config.lua.dist').read_text(encoding='utf-8')
          replacements = {
              'dataPackDirectory': '"data-otservbr-global"',
              'mapDownloadUrl': '""',
              'toggleDownloadMap': 'false',
              'toggleMapCustom': 'false',
              'startupDatabaseOptimization': 'false',
              'mysqlDatabaseBackup': 'false',
              'toggleSaveInterval': 'false',
              'ip': '"127.0.0.1"',
              'mysqlHost': '"127.0.0.1"',
              'mysqlUser': '"catalog-ci"',
              'mysqlPass': '"catalog-ci"',
              'mysqlDatabase': '"catalog_ci"',
              'mysqlPort': '1',
              'mysqlSock': '""',
              'metricsEnablePrometheus': 'false',
              'metricsEnableOstream': 'false',
          }
          for key, value in replacements.items():
              pattern = re.compile(rf'^{re.escape(key)}\s*=.*$', re.MULTILINE)
              if len(pattern.findall(config)) != 1:
                  raise RuntimeError(f'Expected exactly one config key: {key}')
              config = pattern.sub(f'{key} = {value}', config, count=1)
          Path('config.lua').write_text(config, encoding='utf-8', newline='\n')

          manifest_dir = Path('artifacts/game-catalog-diagnosis/manifests')
          profile = {
              'contract': 'oteryn.game-catalog',
              'schema_version': '1.0.0',
              'protocol_profile': 'oteryn-current',
              'runtime_release': '0.0.1-ci',
              'content_target_release': '0.0.1-ci',
              'verified_content_through_release': '0.0.1-ci',
              'contains_content_through_release': None,
              'loot_chance_denominator': 100000,
              'datapack_commit_sha': None,
              'producer_build_id': 'github-actions-game-catalog-diagnosis',
          }
          releases = [{
              'key': '0.0.1-ci',
              'display_label': 'CI diagnosis 0.0.1',
              'major': 0,
              'minor': 0,
              'patch': 1,
              'build': None,
              'release_order': 1,
              'protocol_family': 'oteryn-current',
              'released_at': None,
          }]
          (manifest_dir / 'profile.json').write_text(json.dumps(profile, indent=2) + '\n', encoding='utf-8')
          (manifest_dir / 'releases.json').write_text(json.dumps(releases, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Capture export backtrace
        shell: bash
        env:
          CATALOG_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -o pipefail
          gdb -q -batch \
            -ex 'set pagination off' \
            -ex 'set print thread-events off' \
            -ex run \
            -ex 'thread apply all bt full' \
            --args build/linux-release/bin/canary \
              --export-game-catalog-only \
              --game-catalog-output=artifacts/game-catalog-diagnosis/game-catalog.json \
              --game-catalog-manifest-directory=artifacts/game-catalog-diagnosis/manifests \
              --game-catalog-generated-at=2026-07-28T00:00:00Z \
              --game-catalog-canary-commit="${CATALOG_HEAD_SHA}" \
            2>&1 | tee artifacts/game-catalog-diagnosis/gdb.log

          grep -q 'Program received signal SIGSEGV' artifacts/game-catalog-diagnosis/gdb.log
          grep -q '#0' artifacts/game-catalog-diagnosis/gdb.log

      - name: Upload diagnosis
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: game-catalog-runtime-backtrace
          path: artifacts/game-catalog-diagnosis/
          if-no-files-found: error
