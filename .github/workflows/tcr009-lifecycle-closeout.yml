---
name: TCR-009 Lifecycle Closeout

on:
  push:
    branches:
      - docs/archive-tcr-009-blocked-20260728
    paths:
      - .github/workflows/tcr009-lifecycle-closeout.yml

permissions:
  contents: write

concurrency:
  group: tcr009-lifecycle-closeout
  cancel-in-progress: false

jobs:
  closeout:
    name: Archive and release ownership
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lifecycle branch
        uses: actions/checkout@v4
        with:
          ref: docs/archive-tcr-009-blocked-20260728
          fetch-depth: 0

      - name: Apply bounded lifecycle closeout
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          feature_merge = "8a88e2f09257e620985770e5e053381df32f916d"
          active_path = Path("docs/agents/tasks/active/CAN-20260728-tcr-009-client-reference-drift.md")
          archive_path = Path("docs/agents/tasks/archive/CAN-20260728-tcr-009-client-reference-drift.md")
          program_path = Path("docs/agents/programs/OTBM_TIBIA_CLIENT_REFERENCE_PROGRAM.md")
          catalog_path = Path("docs/agents/MODULE_CATALOG.md")

          active = active_path.read_text(encoding="utf-8")
          assert "status: implementing" in active
          assert 'related_pr: ""' in active
          active = active.replace("status: implementing", "status: blocked", 1)
          active = active.replace("updated: 2026-07-28T23:26:00+02:00", "updated: 2026-07-28T23:29:00+02:00", 1)
          active = re.sub(r'last_verified_commit: "[0-9a-f]+"', f'last_verified_commit: "{feature_merge}"', active, count=1)
          active = active.replace('related_pr: ""', 'related_pr: "992"\nlifecycle_pr: "993"', 1)
          active = active.replace("- [ ] Early draft lifecycle PR published.", "- [x] Early draft lifecycle PR published.")
          active = active.replace("- [ ] Task archived with `status: blocked` and exact feature/CI evidence.", "- [x] Task archived with `status: blocked` and exact feature/CI evidence.")
          active = active.replace("- [ ] Programme queue, handoff and module discovery updated without claiming TCR-009 stable.", "- [x] Programme queue, handoff and module discovery updated without claiming TCR-009 stable.")
          active = active.replace("- [ ] Active task removed and ownership released.", "- [x] Active task removed and ownership released.")
          active = active.replace("- [ ] Lifecycle exact-final-head checks, Ready-state protected CI and merge completed.", "- [ ] Lifecycle exact-final-head checks, Ready-state protected CI and merge completed after this archive commit.")
          active = active.replace("# Planned closeout", "# Lifecycle closeout")
          active = re.sub(
              r"1\. Publish the early draft lifecycle PR\.\n2\. Archive this task and update the programme/module records in one bounded lifecycle change\.\n3\. Validate the exact final head, transition Ready, obtain protected CI, merge and verify no stale active ownership remains\.",
              "- Lifecycle PR `#993` was published early as draft.\n- This commit archives the blocked task, updates programme/module discovery and removes the active ownership record.\n- Remaining lifecycle action is exact-final-head validation, Ready-state protected CI and merge of PR `#993`.",
              active,
              count=1,
          )
          active = active.replace("pr: none", "pr: 993", 1)
          active = active.replace("status: implementing\ncontext_routes:", "status: blocked\ncontext_routes:", 1)
          active = active.replace(
              "next_action: Publish the early draft lifecycle PR, then archive the task and update programme/module discovery.",
              "next_action: Validate exact final head for lifecycle PR 993, transition Ready, obtain protected CI and merge.",
              1,
          )
          active += "\n# Ownership release\n\nThe active task path is removed by this lifecycle commit. Historical ownership claims remain in this archive only and do not authorize new implementation.\n"
          archive_path.write_text(active, encoding="utf-8")
          active_path.unlink()

          program = program_path.read_text(encoding="utf-8")
          program = re.sub(r"^updated: .*?$", "updated: 2026-07-28T23:29:00+02:00", program, count=1, flags=re.MULTILINE)
          program = re.sub(r'^last_verified_commit: "[0-9a-f]+"$', f'last_verified_commit: "{feature_merge}"', program, count=1, flags=re.MULTILINE)
          replacements = {
              "| TCR-008 |": "| TCR-008 | Optional Minimap Reference | optional/deferred-no-concrete-use-case | no concrete parity use case found in fresh 2026-07-28 preflight | TCR-001 merged | low | Do not implement on speculation. Reopen only for a documented advisory-only use case not already covered by World Index, landmarks, Reachability, factual rendering or StaticMapData. |",
              "| TCR-009 |": "| TCR-009 | Client Reference Drift | blocked-external-evidence | PR #992 / merge `8a88e2f0...`; request `RTREQ-TCR-ITEM-DEFINITIONS-0002`; blocker `TCR009_REQUIRES_TWO_COMPLETE_EXACT_REFERENCE_SNAPSHOTS` | TCR-002, TCR-003, TCR-004 | medium | Owner must provide two distinct complete exact retained manifest/index snapshot sets. No drift producer or stable-contract claim exists yet. |",
              "| TCR-010 |": "| TCR-010 | Compact Evidence Gateway Integration | blocked-by-TCR-009 | stable TCR-005/006/007 exist; TCR-009 is not stable | TCR-005, TCR-006, TCR-007, TCR-009 stable/merged | low | Do not start until `canary-tibia-client-reference-drift-v1` is genuinely stable/merged. Reuse QA-018. |",
              "| TCR-011 |": "| TCR-011 | Reviewed Adoption Router | blocked-by-TCR-009-and-TCR-010 | stable TCR-005/006/007 exist; TCR-009/010 are not stable | TCR-005, TCR-006, TCR-007, TCR-009, TCR-010 stable/merged | medium | Do not start until all required producer/gateway contracts are stable/merged. No executor or mutation authority. |",
          }
          lines = program.splitlines()
          seen = set()
          for index, line in enumerate(lines):
              for prefix, replacement in replacements.items():
                  if line.startswith(prefix):
                      lines[index] = replacement
                      seen.add(prefix)
          assert seen == set(replacements), f"missing queue rows: {set(replacements) - seen}"
          program = "\n".join(lines) + "\n"
          old_state = "The following remain planned and **not stable/merged**: optional TCR-008 minimap reference, `canary-tibia-client-reference-drift-v1`, gateway integration and adoption routing."
          new_state = "TCR-008 is `optional/deferred-no-concrete-use-case`. TCR-009 is `blocked-external-evidence` on `TCR009_REQUIRES_TWO_COMPLETE_EXACT_REFERENCE_SNAPSHOTS` with exact owner request `RTREQ-TCR-ITEM-DEFINITIONS-0002`. TCR-010 and TCR-011 remain dependency-blocked. `canary-tibia-client-reference-drift-v1`, gateway integration and adoption routing are **not stable/merged**."
          assert old_state in program
          program = program.replace(old_state, new_state, 1)
          program = re.sub(
              r"# Last completed task\n.*?(?=# Blockers and unresolved references)",
              "# Last bounded lifecycle disposition\n\n- Task: `docs/agents/tasks/archive/CAN-20260728-tcr-009-client-reference-drift.md`.\n- Feature/preflight PR: `#992`; exact head `ada7a9e6f7d855a2d6f8c34d003b752a49251c1b`; merge `8a88e2f09257e620985770e5e053381df32f916d`.\n- Ready-state protected CI: run `30399382989`, success.\n- Lifecycle PR: `#993`.\n- Disposition: `blocked-external-evidence`; no TCR-009 producer contract was delivered or stabilized.\n\n",
              program,
              count=1,
              flags=re.DOTALL,
          )
          tail_marker = "# Exact next action after TCR-007"
          assert tail_marker in program
          program = program[: program.index(tail_marker)] + """# Exact next action after TCR-009 evidence preflight

All currently executable programme work is complete. TCR-000 through TCR-007 remain stable/merged within their exact evidence boundaries. TCR-008 is optional/deferred because no concrete minimap parity use case was found.

TCR-009 must not resume until owner request `RTREQ-TCR-ITEM-DEFINITIONS-0002` is satisfied with two distinct complete exact retained snapshot sets, each containing a validated manifest plus compatible StaticData, StaticMapData and proficiency indexes with exact hashes, revisions and explicit client-build evidence state. The first failure remains:

```text
TCR009_REQUIRES_TWO_COMPLETE_EXACT_REFERENCE_SNAPSHOTS
```

Do not start TCR-010, TCR-011 or OWA-003 before TCR-009 is genuinely implemented, validated and merged stable. Do not synthesize snapshots, reuse one snapshot as A and B, infer build identity from filenames or commit proprietary/generated client artifacts.

# Handoff

A continuation agent must:

1. read root `AGENTS.md`, repository/context routing and this programme;
2. re-fetch current `main`, active tasks, branches, PRs and retained evidence;
3. inspect `RTREQ-TCR-ITEM-DEFINITIONS-0002` first;
4. resume TCR-009 only if two distinct complete exact snapshot sets now satisfy the request contract;
5. create one new bounded active task/branch/early draft PR for the drift producer;
6. reuse TCR-001 through TCR-004 producers and QA-016 dependency-scoped freshness semantics;
7. preserve unresolved ID spaces and never equate reference drift with gameplay regression;
8. keep all proprietary inputs and generated reports outside Git;
9. leave TCR-008 deferred unless a concrete non-duplicative advisory use case exists;
10. leave TCR-010, TCR-011 and OWA-003 blocked until their exact dependencies are stable/merged.

# Agent kickoff prompt

```text
Continue CAN-PROGRAM-OTBM-TIBIA-CLIENT-REFERENCE from repository state.
Repository writes are allowed only in blakinio/canary.
Do not rely on previous chat history.

Fresh preflight is mandatory. Read AGENTS.md, repository/context routing, this programme, OTBM_TIBIA_CLIENT_REFERENCE_ARCHITECTURE.md and owner request RTREQ-TCR-ITEM-DEFINITIONS-0002.

Current durable state:
- TCR-000..007 stable/merged within exact evidence boundaries;
- TCR-008 optional/deferred-no-concrete-use-case;
- TCR-009 blocked-external-evidence on TCR009_REQUIRES_TWO_COMPLETE_EXACT_REFERENCE_SNAPSHOTS;
- TCR-010, TCR-011 and OWA-003 dependency-blocked;
- no canary-tibia-client-reference-drift-v1 stable contract exists.

Resume TCR-009 only when two distinct complete exact retained manifest/index snapshot sets are proven. Otherwise do not create a task or synthetic evidence. Never commit proprietary client packages or generated reports, and never create duplicate parsers, indexes, gateways, assurance engines, pathfinders or E2E runners.
```
"""
          program_path.write_text(program, encoding="utf-8")

          catalog = catalog_path.read_text(encoding="utf-8")
          catalog = re.sub(r"^Last reviewed: .*?$", "Last reviewed: 2026-07-28", catalog, count=1, flags=re.MULTILINE)
          prefix = "| OTBM Tibia client reference architecture |"
          replacement = "| OTBM Tibia client reference architecture | active programme; TCR-000..007 stable/merged, TCR-008 optional/deferred, TCR-009 evidence-blocked | Exact official-client manifest, StaticData, StaticMapData, proficiency, reviewed resolver/parity/correlation contracts plus an explicit drift/gateway/adoption queue | `docs/agents/programs/OTBM_TIBIA_CLIENT_REFERENCE_PROGRAM.md`, `docs/ai-agent/OTBM_TIBIA_CLIENT_REFERENCE_ARCHITECTURE.md`, `tools/ai-agent/tibia_*reference*.py` | Reuse existing TCR producers and owner request `RTREQ-TCR-ITEM-DEFINITIONS-0002`. No drift contract is stable; do not start TCR-010/011/OWA-003, synthesize snapshots, or create duplicate parsers/indexes/gateways/assurance/E2E infrastructure. |"
          catalog_lines = catalog.splitlines()
          matches = [i for i, line in enumerate(catalog_lines) if line.startswith(prefix)]
          assert len(matches) == 1, f"expected one catalogue row, found {len(matches)}"
          catalog_lines[matches[0]] = replacement
          catalog_path.write_text("\n".join(catalog_lines) + "\n", encoding="utf-8")
          PY

      - name: Validate lifecycle corpus
        run: |
          test ! -e docs/agents/tasks/active/CAN-20260728-tcr-009-client-reference-drift.md
          test -e docs/agents/tasks/archive/CAN-20260728-tcr-009-client-reference-drift.md
          grep -Fq 'status: blocked' docs/agents/tasks/archive/CAN-20260728-tcr-009-client-reference-drift.md
          grep -Fq 'RTREQ-TCR-ITEM-DEFINITIONS-0002' docs/agents/programs/OTBM_TIBIA_CLIENT_REFERENCE_PROGRAM.md
          grep -Fq 'optional/deferred-no-concrete-use-case' docs/agents/programs/OTBM_TIBIA_CLIENT_REFERENCE_PROGRAM.md
          grep -Fq 'TCR009_REQUIRES_TWO_COMPLETE_EXACT_REFERENCE_SNAPSHOTS' docs/agents/programs/OTBM_TIBIA_CLIENT_REFERENCE_PROGRAM.md
          python tools/agents/real_tibia_evidence.py validate --as-of 2026-07-26
          python tools/agents/real_tibia_evidence.py generate --check --as-of 2026-07-26

      - name: Remove helper and commit lifecycle closeout
        run: |
          rm .github/workflows/tcr009-lifecycle-closeout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/agents/tasks/active/CAN-20260728-tcr-009-client-reference-drift.md
          git add docs/agents/tasks/archive/CAN-20260728-tcr-009-client-reference-drift.md
          git add docs/agents/programs/OTBM_TIBIA_CLIENT_REFERENCE_PROGRAM.md
          git add docs/agents/MODULE_CATALOG.md
          git add .github/workflows/tcr009-lifecycle-closeout.yml
          git diff --cached --quiet && { echo "Expected lifecycle changes were not produced"; exit 1; }
          git commit -m "docs(tcr): archive blocked TCR-009 lifecycle"
          git push origin HEAD:docs/archive-tcr-009-blocked-20260728
