name: OWA-003D Lifecycle Reconciliation

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/owa-003d-lifecycle.yml"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/owa-003d-lifecycle
          fetch-depth: 0

      - name: Reconcile terminal lifecycle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          archive = Path('docs/agents/tasks/archive/CAN-20260731-owa-003d-exact-execution.md')
          text = archive.read_text(encoding='utf-8')
          replacements = {
              'lifecycle_pr: ""': 'lifecycle_pr: "1046"',
              'pr: null': 'pr: 1046',
              'status: blocked-lifecycle-closing': 'status: blocked-lifecycle-closed',
              'next_action: Open lifecycle PR, bind it here, reconcile programme/roadmap, pass exact-head and readiness gates, then squash-merge.': 'next_action: Pass exact-head and protected readiness gates for lifecycle PR 1046, squash-merge, then preserve the retained impact until exact external re-entry evidence exists.',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'archive replacement count mismatch: {old!r}')
              text = text.replace(old, new, 1)
          archive.write_text(text, encoding='utf-8')

          programme = Path('docs/agents/programs/OTBM_WORLD_ASSURANCE_OPERATIONS_PROGRAM.md')
          text = programme.read_text(encoding='utf-8')
          text = re.sub(r'^updated: .*$', 'updated: 2026-07-31T10:50:00+02:00', text, count=1, flags=re.M)
          text = re.sub(r'^last_verified_commit: ".*"$', 'last_verified_commit: "c59f8071349ca08b27f1afd934ab39132dd959c0"', text, count=1, flags=re.M)
          text, n = re.subn(
              r'(?s)# Active tasks\n\n.*?(?=\n# Queue)',
              '# Active tasks\n\nNo active OWA task remains after feature PR #1044 and lifecycle PR #1046. OWA-003D executed and retained one exact TCR-to-QA freshness impact, then stopped at `OWA003D_NO_REVIEWED_QA008_ROOT_AND_CANONICAL_MAP_CHANGE_CHAIN`. OWA-006 remains independently blocked by `OWA006_NO_RETAINED_REVIEWED_REAL_CANDIDATE_CHAIN`.',
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit('programme active task section mismatch')
          old = '9. **OWA-003D** — exact snapshot B supplied; existing TCR-009/010/011, QA-016 and OWA-003A owners executed; workflow run `30614565219`, artifact `8786807858` retains the exact impact. Downstream stops before QA-008 at `OWA003D_NO_REVIEWED_QA008_ROOT_AND_CANONICAL_MAP_CHANGE_CHAIN` because no reviewed dependency root or distinct canonical map-change chain exists.'
          new = old + ' Feature PR #1044 squash-merged as `c59f8071349ca08b27f1afd934ab39132dd959c0`; lifecycle PR #1046 archives ownership and preserves the external-evidence re-entry boundary.'
          if text.count(old) != 1:
              raise SystemExit('programme OWA-003D sequence entry mismatch')
          text = text.replace(old, new, 1)
          programme.write_text(text, encoding='utf-8')

          roadmap = Path('docs/ai-agent/OTBM_WORLD_ASSURANCE_OPERATIONS_ROADMAP.md')
          text = roadmap.read_text(encoding='utf-8')
          old = '**Priority: OWA-003D exact operational impact retained; downstream QA-008/map-change chain blocked external evidence.**'
          new = '**Priority: OWA-003D operational impact retained and lifecycle-closed; downstream QA-008/map-change chain blocked external evidence.**'
          if text.count(old) != 1:
              raise SystemExit('roadmap priority mismatch')
          text = text.replace(old, new, 1)
          old = '## OWA-003D executed operational evidence — draft PR #1044'
          new = '## OWA-003D executed operational evidence — feature #1044 merged; lifecycle #1046'
          if text.count(old) != 1:
              raise SystemExit('roadmap OWA-003D heading mismatch')
          text = text.replace(old, new, 1)
          anchor = 'The next boundary is:\n'
          addition = 'Feature PR #1044 squash-merged as `c59f8071349ca08b27f1afd934ab39132dd959c0`. Lifecycle PR #1046 releases active ownership while preserving the retained impact and exact re-entry contract.\n\n'
          if text.count(anchor) != 1:
              raise SystemExit('roadmap next-boundary anchor mismatch')
          text = text.replace(anchor, addition + anchor, 1)
          roadmap.write_text(text, encoding='utf-8')
          PY

          git rm docs/agents/tasks/active/CAN-20260731-owa-003d-exact-execution.md
          git rm .github/workflows/owa-003d-lifecycle.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/agents/tasks/archive/CAN-20260731-owa-003d-exact-execution.md \
                  docs/agents/programs/OTBM_WORLD_ASSURANCE_OPERATIONS_PROGRAM.md \
                  docs/ai-agent/OTBM_WORLD_ASSURANCE_OPERATIONS_ROADMAP.md
          git diff --cached --check
          git commit -m "docs(agents): finalize OWA-003D lifecycle"
          git push origin HEAD:docs/owa-003d-lifecycle
