name: Complete Game Session Cache Header

on:
  push:
    branches:
      - fix/CAN-20260724-game-session-cache-headers
    paths:
      - ".github/workflows/complete-game-session-cache-header.yml"

permissions:
  contents: write

jobs:
  patch-and-remove:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v6
        with:
          ref: fix/CAN-20260724-game-session-cache-headers
          fetch-depth: 0

      - name: Apply exact cache contract and remove helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/security/game_session_http_issuer.cpp')
          text = path.read_text(encoding='utf-8')
          old = '<< "Cache-Control: no-store\\r\\n"'
          new = '<< "Cache-Control: no-store, no-cache, must-revalidate, private\\r\\n"'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one cache header literal, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git rm .github/workflows/complete-game-session-cache-header.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/security/game_session_http_issuer.cpp
          git commit -m "fix(security): complete Game Session cache policy"
          git push origin HEAD:fix/CAN-20260724-game-session-cache-headers
