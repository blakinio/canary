name: OWA-003C Executed Evidence

on:
  pull_request:
    paths:
      - ".github/workflows/owa-003c-executed-evidence.yml"
      - ".github/owa-003c/**"
      - "docs/agents/tasks/active/CAN-20260730-owa-003c-executed-evidence.md"
      - "docs/ai-agent/OTBM_TCR_QA_EXECUTED_EVIDENCE.md"
      - "docs/agents/programs/OTBM_WORLD_ASSURANCE_OPERATIONS_PROGRAM.md"
      - "docs/ai-agent/OTBM_WORLD_ASSURANCE_OPERATIONS_ROADMAP.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rematerialize-snapshot-b:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compile exact rematerializer
        run: python -m py_compile .github/owa-003c/rematerialize.py

      - name: Rematerialize exact snapshot B inputs
        env:
          EXPECTED_PACKAGE_VERSION: 15.31.69f220
          OWA003C_OUTPUT: .owa-003c-evidence
        run: python .github/owa-003c/rematerialize.py

      - name: Validate audit JSON
        run: python -m json.tool .owa-003c-evidence/input-audit.json >/dev/null

      - name: Upload exact rematerialized inputs
        uses: actions/upload-artifact@v4
        with:
          name: owa-003c-snapshot-b-${{ github.event.pull_request.head.sha || github.sha }}
          path: .owa-003c-evidence
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
