name: Diagnose Docker Build

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-docker-build.yml"
      - "docker/**"
      - "src/security/game_session_http_issuer.cpp"

permissions:
  contents: read
  packages: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}
      - name: Run and retain Docker build output
        id: build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/docker-image
          docker buildx build \
            --progress=plain \
            --file docker/Dockerfile.x86 \
            --output type=docker,dest=artifacts/docker-image/canary-pr.tar \
            --build-arg VCPKG_FEED_URL=https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json \
            --build-arg VCPKG_FEED_USERNAME=${{ github.repository_owner }} \
            --build-arg VCPKG_BINARY_CACHE_MODE=read \
            --secret id=github_token,env=GITHUB_TOKEN \
            --tag ghcr.io/${GITHUB_REPOSITORY,,}:pr \
            . > docker-build-output.txt 2>&1
          status=$?
          cat docker-build-output.txt
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          exit 0
      - uses: actions/upload-artifact@v7
        with:
          name: docker-build-output
          path: docker-build-output.txt
          if-no-files-found: error
          retention-days: 1
      - name: Preserve failing conclusion
        run: test "${{ steps.build.outputs.status }}" = "0"
