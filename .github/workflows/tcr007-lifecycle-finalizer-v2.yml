---
name: TCR-007 Lifecycle Finalizer V2

on:
  pull_request:
    types: [opened]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'docs/tcr-007-lifecycle-closeout'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Patch exact lifecycle records
        run: python .tcr007-lifecycle-finalize.py
      - name: Restore canonical workflow and commit
        shell: bash
        run: |
          git checkout origin/main -- .github/workflows/tibia-client-reference.yml
          rm -f \
            .github/workflows/tcr007-lifecycle-closeout.yml \
            .github/workflows/tcr007-lifecycle-finalizer-v2.yml \
            .tcr007-closeout-diagnostic.json \
            .tcr007-lifecycle-finalize.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(tcr): finalize TCR-007 lifecycle records'
          git push origin HEAD:docs/tcr-007-lifecycle-closeout
