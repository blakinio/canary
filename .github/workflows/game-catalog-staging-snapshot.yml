name: Game Catalog Staging Snapshot

on:
  pull_request:
    paths:
      - '.github/workflows/game-catalog-staging-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: game-catalog-staging-snapshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch-identifiers:
    name: Apply unique identifier producer fix
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 991
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/CAN-20260728-game-catalog-exporter
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Apply exact guarded patch
        run: python3 tools/game-catalog/apply_identifier_fix.py

      - name: Validate and publish source change
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- . ':!src/game/catalog/game_catalog_exporter.cpp' ':!tests/unit/game/catalog/game_catalog_test.cpp'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game/catalog/game_catalog_exporter.cpp tests/unit/game/catalog/game_catalog_test.cpp
          git commit -m 'fix(catalog): emit only unique snapshot identifiers'
          git push origin HEAD:feat/CAN-20260728-game-catalog-exporter
