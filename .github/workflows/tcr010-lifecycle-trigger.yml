---
name: TCR-010 Lifecycle Trigger

on:
  push:
    branches:
      - docs/CAN-20260730-tcr-010-archive
    paths:
      - ".github/workflows/tcr010-lifecycle-trigger.yml"

permissions:
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: docs/CAN-20260730-tcr-010-archive
          fetch-depth: 0
      - name: Execute closeout and remove temporary workflows
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/tcr010-lifecycle-closeout.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python - <<'PY'") + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          prefix = '          '
          code = '\n'.join(line[len(prefix):] if line.startswith(prefix) else line for line in lines[start:end]) + '\n'
          exec(compile(code, str(workflow), 'exec'), {'__name__': '__main__'})
          PY
          rm .github/workflows/tcr010-lifecycle-closeout.yml
          rm .github/workflows/tcr010-lifecycle-trigger.yml
          git add docs/agents/tasks docs/agents/programs/OTBM_TIBIA_CLIENT_REFERENCE_PROGRAM.md docs/agents/MODULE_CATALOG.md .github/workflows
          git commit -m "docs(agents): archive TCR-010 evidence gateway"
          git push origin HEAD:docs/CAN-20260730-tcr-010-archive
