name: OWA-003C Lifecycle Reconcile

on:
  pull_request:
    paths:
      - ".github/workflows/owa-003c-lifecycle-reconcile.yml"
      - "docs/agents/tasks/archive/CAN-20260730-owa-003c-executed-evidence.md"
      - "docs/agents/programs/OTBM_WORLD_ASSURANCE_OPERATIONS_PROGRAM.md"
      - "docs/ai-agent/OTBM_WORLD_ASSURANCE_OPERATIONS_ROADMAP.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Reconcile lifecycle state
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one anchor in {path}, got {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          archive = "docs/agents/tasks/archive/CAN-20260730-owa-003c-executed-evidence.md"
          program = "docs/agents/programs/OTBM_WORLD_ASSURANCE_OPERATIONS_PROGRAM.md"
          roadmap = "docs/ai-agent/OTBM_WORLD_ASSURANCE_OPERATIONS_ROADMAP.md"

          replace(archive, 'lifecycle_pr: ""', 'lifecycle_pr: "1036"')
          replace(archive, 'pr: null', 'pr: 1036')

          replace(program, 'updated: 2026-07-30T23:00:00+02:00\nlast_verified_commit: "9704087e3d6fc7b434938b343a546c14a23a447e"', 'updated: 2026-07-30T23:30:00+02:00\nlast_verified_commit: "3cc30856257fa7e6b3470801807413bb5dad20cc"')
          replace(program, 'OWA-003C is active as a blocked exact-evidence recovery in draft PR #1035 under task `CAN-20260730-owa-003c-executed-evidence`. It owns only recovery/preflight evidence and creates no substitute TCR, QA, candidate or runtime proof.', 'No active OWA task remains after OWA-003C recovery PR #1035 merged. Lifecycle PR #1036 archives the blocked task and releases ownership without converting either external-evidence blocker into completion.')
          replace(program, '| OWA-003 | TCR-to-QA Drift and Freshness Integration | OWA-003A stable/merged; OWA-003B blocked/lifecycle-closed; OWA-003C recovery blocked in #1035 — `OWA003C_NO_RECOVERABLE_EXACT_TCR009_SNAPSHOT_B_PAYLOAD_OR_RETAINED_REPORT_CHAIN` |', '| OWA-003 | TCR-to-QA Drift and Freshness Integration | OWA-003A stable/merged; OWA-003B blocked/lifecycle-closed; OWA-003C recovery merged #1035, lifecycle #1036 — `OWA003C_NO_RECOVERABLE_EXACT_TCR009_SNAPSHOT_B_PAYLOAD_OR_RETAINED_REPORT_CHAIN` |')
          replace(program, '8. **OWA-003C** — exact-evidence recovery in #1035 exhausted retained Actions artifacts, official-launcher rematerialization and the public exact-tag mirror. It stops at `OWA003C_NO_RECOVERABLE_EXACT_TCR009_SNAPSHOT_B_PAYLOAD_OR_RETAINED_REPORT_CHAIN` without reconstructing report bytes from hashes or summaries.', '8. **OWA-003C** — exact-evidence recovery merged via #1035 and lifecycle-closed via #1036. It exhausted retained Actions artifacts, official-launcher rematerialization and the public exact-tag mirror, then stopped at `OWA003C_NO_RECOVERABLE_EXACT_TCR009_SNAPSHOT_B_PAYLOAD_OR_RETAINED_REPORT_CHAIN` without reconstructing report bytes from hashes or summaries.')
          replace(program, 'PR #1035 records a bounded recovery attempt after OWA-003B.', 'PR #1035 records the bounded recovery attempt after OWA-003B; lifecycle PR #1036 archives the blocked task and releases ownership.')

          replace(roadmap, '**Priority: OWA-003A stable/merged; OWA-003B lifecycle-closed; OWA-003C exact-evidence recovery blocked external evidence.**', '**Priority: OWA-003A stable/merged; OWA-003B lifecycle-closed; OWA-003C recovery/lifecycle closed, blocked external evidence.**')
          replace(roadmap, '## OWA-003C terminal recovery disposition — PR #1035', '## OWA-003C terminal recovery disposition — PR #1035 / lifecycle #1036')
          replace(roadmap, 'TCR-009 proves prior exact snapshot A/B and drift identities, but generated payloads remained outside Git.', 'TCR-009 proves prior exact snapshot A/B and drift identities, but generated payloads remained outside Git. Lifecycle PR #1036 archives the blocked recovery task without converting the blocker into completion.')
          PY
          git diff --check
      - name: Commit reconciliation
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/agents/tasks/archive/CAN-20260730-owa-003c-executed-evidence.md docs/agents/programs/OTBM_WORLD_ASSURANCE_OPERATIONS_PROGRAM.md docs/ai-agent/OTBM_WORLD_ASSURANCE_OPERATIONS_ROADMAP.md
          git commit -m "docs(otbm): reconcile OWA-003C lifecycle state"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
